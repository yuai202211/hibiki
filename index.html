/* ===================== 過去バージョンからの救出 =====================
   アプリ更新時にクラウドのデータファイルが新版に載らないことがあった（8/26の消失事故）。
   artifactの旧バージョンには記録が残っているので、起動時に取りに行って合流する。
   マージは冪等・墓標尊重・本人の新しい編集が常に勝つ＝何度走っても安全 */
/* 版庫プローブ：過去バージョン（＝永久保存の倉庫）を後から読めるかの自動検証。
   結果はstateに載せて次のチェックポイントでクラウドへ→開発側が確認して写真の倉庫化を進める。
   先頭チャンクだけ読んで即中断するので通信量は数KB */
async function probeVault(){
  try{
    if(state.vprobe&&state.vprobe.ok&&Date.now()-(state.vprobe.t||0)<604800000)return;  /* OKなら週1で十分 */
    if(state.vprobe&&!state.vprobe.ok&&Date.now()-(state.vprobe.t||0)<86400000)return;  /* 失敗中も1日1回だけ（結果の揺れで保存が暴れないように） */
    const VER='';   /* 旧版（claude.ai）専用。クラウド版では使わない */
    const r=await fetch('/_f/'+VER+'/',{cache:'no-store'});
    let ok=false,note='st'+r.status;
    if(r.ok&&r.body){
      const rd=r.body.getReader();
      const {value}=await rd.read();
      try{rd.cancel();}catch(e){}
      const head=new TextDecoder().decode(value||new Uint8Array()).slice(0,400);
      ok=head.indexOf('doctype')>=0&&head.indexOf(VER)>=0;
      note=ok?'OK':'内容不一致';
    }
    if(!state.vprobe||state.vprobe.ok!==ok){   /* 保存を伴う記録はok/NGが切り替わった時だけ（st403↔ERRの揺れでは保存しない） */
      state.vprobe={ok,note,ver:VER,t:Date.now()};
      state.updatedAt=Date.now();saveLocal(false);pendingCkpt=true;
    }else{state.vprobe.t=Date.now();state.vprobe.note=note;}
  }catch(e){
    if(!state.vprobe){
      state.vprobe={ok:false,note:'ERR',t:Date.now()};
      state.updatedAt=Date.now();saveLocal(false);pendingCkpt=true;
    }else if(!state.vprobe.ok){state.vprobe.t=Date.now();}
  }
}

let RESCUELOG='未実行';
async function rescueOldVersions(deep){
  /* 端末に残した版ID台帳（保存成功のたびに記録）から新しい順に見に行く。
     台帳が空＝まだ一度も新方式で保存できていない、の意味 */
  let ledger=[];
  try{ledger=JSON.parse(localStorage.getItem('nippo10-vers')||'[]');}catch(e){}
  if(!Array.isArray(ledger))ledger=[];
  ledger=ledger.concat(VERS_MEM);
  const VERS=[...new Set(ledger.map(x=>x&&x.v).filter(v=>typeof v==='string'&&v))].slice(-8).reverse();
  if(!VERS.length){RESCUELOG='版ID台帳が空（保存成功後から自動記録）';return;}
  const logs=[];
  for(const VER of VERS){
    try{
      let old=null;
      /* 旧方式（data/state.json）を先に見る */
      try{
        const r=await fetch('/_f/'+VER+'/data/state.json',{cache:'no-store'});
        if(r.ok){try{old=await r.json();}catch(e2){}}
      }catch(e1){}
      /* 保存方式v2の版：ページ本体の埋め込みCSTATEを取り出す（1版あたり数MBの通信になるので手動救出の時だけ） */
      if((!old||!old.entries)&&deep){
        try{
          const rp=await fetch('/_f/'+VER+'/',{cache:'no-store'});
          if(rp.ok){
            const t=await rp.text();
            const A='/*CSTATE*/let CSTATE=',B=';/*CSTATE-END*/';
            const a=t.indexOf(A),b=t.indexOf(B);
            if(a>=0&&b>a)old=JSON.parse(t.slice(a+A.length,b));
          }
        }catch(e3){}
      }
      if(!old||!old.entries){logs.push(VER.slice(-4)+':なし');continue;}
      const dds=Object.keys(old.entries).sort();
      logs.push(VER.slice(-4)+':OK 最終'+(dds[dds.length-1]||'?')+' 8/26'+(old.entries['2026-08-26']?'あり('+Object.keys(old.entries['2026-08-26']).length+'件)':'なし'));
      const before=JSON.stringify(state);
      const merged=mergeStates(state,old);
      /* 旧版の写真ファイルも本体データへ回収 */
      const need=new Set();
      for(const d in merged.entries)for(const k in merged.entries[d]){
        const en=merged.entries[d][k];
        if(en&&!en.del&&en.ph)for(const pid of en.ph){
          if(!(merged.photos&&merged.photos[pid])&&!PH.mem[pid])need.add(pid);
        }
      }
      for(const pid of need){
        try{
          const pr=await fetch('/_f/'+VER+'/data/p/'+pid+'.jpg');
          if(!pr.ok)continue;
          const bl=await pr.blob();
          const dataURL=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(bl);});
          merged.photos=merged.photos||{};merged.photos[pid]=dataURL;
        }catch(e){}
      }
      if(JSON.stringify(merged)!==before){
        /* fetch待ちの間に本人が書いた記録を巻き戻さない：代入直前の最新stateと再マージ */
        state=mergeStates(state,merged);state.updatedAt=Date.now();
        saveLocal(false);render();schedulePublish();
        toast('🛟 過去バージョンから記録を救出した');
        logs.push('→合流した');
      }else logs.push('→差分なし');
    }catch(e){logs.push(VER.slice(-4)+':ERR '+String(e&&e.message).slice(0,30));}
  }
  RESCUELOG=logs.join('｜')||'旧版に到達できず';
}

function entriesOf(d){const e=state.entries[d]||{};const o={};for(const h in e)if(!e[h].del)o[h]=e[h];return o;}
function plansOf(d){const p=state.plans[d]||{};return Object.keys(p).filter(id=>!p[id].del).map(id=>({id,...p[id]})).sort((x,y)=>(x.ts||0)-(y.ts||0));}

function calcStreak(){
  const has=dt=>{const e=entriesOf(dt);return Object.keys(e).length>0;};
  let d=todayStr(),n=0;
  if(!has(d))d=addDays(d,-1);
  while(has(d)){n++;d=addDays(d,-1);if(n>3650)break;}
  return n;
}

function placeChips(){

  /* 「そのほか」は、全部の行に時間がある時だけ（時間の無い行があると、残りの時間が正しく出せないため） */
  if(stay&&sum&&stay>sum&&a.every(x=>Number(x.m)))h+='<span class="act rest"><i class="a-d"></i><span class="a-t">そのほか</span><span class="a-m">'+esc(durText(stay-sum))+'</span></span>';
  return h+'</span>';
}

function aiStreak(){
  const has=dt=>{const a=(state.ai||{})[dt];return !!(a&&!a.del&&a.touched);};
  let d=todayStr(),n=0;
  if(!has(d))d=addDays(d,-1);
  while(has(d)){n++;d=addDays(d,-1);if(n>3650)break;}
  return n;
}

function openAiSheet(date){
  const a0=(state.ai||{})[date];
  const ex=a0&&!a0.del?a0:null;
  let touched=ex?!!ex.touched:true;   /* 開いた＝触った日がほとんどなので初期ON */
  $('sheet').innerHTML=
    '<div class="grab"></div>'+
    '<div class="sh-time"><span>🤖 今日のAI</span></div>'+
    '<button class="gsignin" id="aiTg" style="justify-content:center"></button>'+
    '<div><div class="sh-label">✦ AIで何を生み出した？（1行でいい）</div>'+
    '<div class="sh-ta-wrap"><textarea id="aiMade" placeholder="例：日記アプリのレビューをAIに投げて次の改善が決まった"></textarea></div></div>'+
    '<div><div class="sh-label">→ 明日AIで試すこと</div>'+
    '<input type="text" id="aiNext" maxlength="200" placeholder="例：教材の台本1章をAIと書く"></div>'+
    '<div class="sh-btns">'+(ex?'<button class="delbtn" id="aiDel">削除</button>':'')+
    '<button class="savebtn" id="aiSave">記　録</button></div>';
  $('aiMade').value=(ex&&ex.made)||'';
  $('aiNext').value=(ex&&ex.next)||'';
  const tg=$('aiTg');
  function mtg(){tg.textContent=touched?'✓ 今日AIに触った':'まだ触ってない（タップで切替）';
    tg.style.background=touched?'#e7f9f0':'#f1f3f8';tg.style.borderColor=touched?'#0bc167':'#dadce0';
    tg.style.color=touched?'#0a9a54':'#8a90a0';}
  mtg();
  tg.onclick=()=>{touched=!touched;mtg();};
  $('aiSave').onclick=()=>{
    const made=$('aiMade').value.trim(),next=$('aiNext').value.trim();
    if(!touched&&!made&&!next){toast('チェックか1行、どっちかは入れてくれ');return;}
    mutate(()=>{state.ai=state.ai||{};state.ai[date]={touched:touched?1:0,made,next,ts:Date.now()};});
    closeSheet();toast('✓ 記録した');
  };
  const del=$('aiDel');
  if(del)del.onclick=()=>{
    if(!del.classList.contains('arm')){del.classList.add('arm');del.textContent='本当に削除？';
      setTimeout(()=>{if(del.isConnected){del.classList.remove('arm');del.textContent='削除';}},2500);return;}
    mutate(()=>{state.ai[date]={del:1,ts:Date.now()};});
    closeSheet();toast('削除した');
  };
  openOvl();
}

  const items=plansOf(d).sort((a,b)=>{

  const endOf=(hh,mm)=>{const a=hh.split(':').map(Number);let t=a[0]*60+a[1]+(mm||60);if(t>1439)t=1439;return pad(Math.floor(t/60))+':'+pad(t%60);};

    '<button class="p2b" data-ed="'+esc(it.id)+'"><div class="p2c">'+esc(it.t)+(it.mm?' <small style="color:#4d7dff;font-weight:800">'+durLabel(it.mm)+'</small>':'')+'</div>'+

  const timed=items.filter(it=>it.hh),untimed=items.filter(it=>!it.hh);
  let html='<div class="glab blue">📅 Googleカレンダー</div><div class="planwrap">'+renderGcal(d)+'</div>';
  html+='<div class="glab blue">☑ 予定（やること）</div>';

/* ===================== Googleカレンダー連携 ===================== */
const GCAL={server:'Google Calendar',mcp:undefined,status:null,cache:{},unsub:null,watchDate:null};

async function gcalInit(){
  GCAL.mcp=(window.claude&&window.claude.use)?await window.claude.use('mcp'):null;
  if(!GCAL.mcp){if(ui.tab!=='di')renderPane();return;}
  try{
    const lt=await GCAL.mcp.listTools();
    const s=(lt.servers||[]).find(x=>x.server===GCAL.server);
    GCAL.status=!s?'absent':(s.authStatus==='needs_reauth'?'reauth':(s.tools&&s.tools.length?'ok':'absent'));
  }catch(e){GCAL.status='ok';/* 状態確認に失敗しても呼び出し時のエラーで案内する */}
  if(ui.tab!=='di')renderPane();
}

function gcalHint(code){
  if(code==='needs_reauth')return '<div class="ghint">🔑 Googleの認証が切れてる。claude.aiの 設定→コネクタ で「Googleカレンダー」を再接続→このページを開き直す</div>';
  if(code==='server_not_connected'||code==='absent')return '<div class="ghint">🔗 claude.aiの 設定→コネクタ で「Googleカレンダー」を接続すると、ここに予定が出る</div>';
  if(code==='selection_required')return '<div class="ghint">Googleカレンダーのコネクタが複数ある。claude.aiでどれを使うか選んでくれ</div>';
  if(code==='approval_required'||code==='blocked_by_policy')return '<div class="ghint">組織のポリシーでブロックされてる</div>';
  return '<div class="ghint">Googleカレンダーをいま読めない。少し待つと自動で再試行する</div>';
}

function renderGcal(d){
  if(GCAL.mcp===null)return '<div class="ghint">🔗 claude.aiで開くと、ここにGoogleカレンダーの予定が出る</div>';
  if(GCAL.status==='absent'||GCAL.status==='reauth')return gcalHint(GCAL.status==='reauth'?'needs_reauth':'absent');
  const c=GCAL.cache[d];
  if(!c)return '<div class="gempty">読み込み中…</div>';
  if(!c.ok)return gcalHint(c.code);
  /* このアプリから飛ばした予定は下のToDo側に出るので、二重表示を避ける */
  const own=new Set(plansOf(d).map(x=>x.gid).filter(Boolean));
  const evs=c.events.filter(ev=>!own.has(ev.id));
  if(!evs.length)return '<div class="gempty">この日の予定なし</div>';
  const hm=x=>{const t=new Date(x);return pad(t.getHours())+':'+pad(t.getMinutes());};
  return evs.map(ev=>{
    const allday=ev.start&&ev.start.date&&!ev.start.dateTime;
    const time=allday?'終日':((ev.start&&ev.start.dateTime?hm(ev.start.dateTime):'')+(ev.end&&ev.end.dateTime?'–'+hm(ev.end.dateTime):''));
    return '<div class="gev"><span class="gt">'+esc(time)+'</span><span class="gs">'+esc(ev.summary||'（無題）')+'</span></div>';
  }).join('');
}

function gcalWatch(d){
  if(!GCAL.mcp||GCAL.status==='absent'||GCAL.status==='reauth')return;
  if(GCAL.watchDate===d&&GCAL.unsub)return;
  if(GCAL.unsub){GCAL.unsub();GCAL.unsub=null;}
  GCAL.watchDate=d;
  const input={startTime:d+'T00:00:00+09:00',endTime:d+'T23:59:59+09:00',orderBy:'startTime',pageSize:50};
  const showing=()=>((ui.tab==='pl'&&ui.date===d)||(ui.tab==='pr'&&addDays(ui.date,1)===d));
  GCAL.unsub=GCAL.mcp.watchTool(GCAL.server,'list_events',input,ev=>{
    if(ev.type==='data'){
      const p=(ev.result&&ev.result.payload)||{};
      const evs=(p.events||[]).filter(e=>e.status!=='cancelled');
      GCAL.cache[d]={ok:true,events:evs};
    }else{
      const code=ev.error&&ev.error.code;
      if(code==='needs_reauth'){GCAL.status='reauth';GCAL.cache[d]=null;}
      else if(code==='server_not_connected'){GCAL.status='absent';GCAL.cache[d]=null;}
      else if(code==='blocked_by_policy'||code==='approval_required'){GCAL.cache[d]={ok:false,code};}
      else if(!GCAL.cache[d]||!GCAL.cache[d].ok){GCAL.cache[d]={ok:false,code:code||'upstream_error'};}
      /* 一時的なエラーで前回データがあるなら表示は維持 */
    }
    if(showing())renderPane();
  },{cache:{staleTime:60000},refetchInterval:300000});
}

function renderDecade(){
  /* 「○年前の同月日」＝生涯日記の背骨。10年で打ち切らず、記録がある最古の年まで何十年でも遡る */
  const dobj=parseD(ui.date);
  let cards='';
  let minY=dobj.getFullYear();
  for(const d in state.entries){const y=Number(d.slice(0,4));if(y>1900&&y<minY)minY=y;}
  const span=Math.max(1,dobj.getFullYear()-minY);
  for(let i=1;i<=span;i++){
    const y=dobj.getFullYear()-i;
    const key=y+'-'+pad(dobj.getMonth()+1)+'-'+pad(dobj.getDate());
    const e=entriesOf(key);
    const hs=Object.keys(e).sort((a,b)=>{
      const sa=e[a].s||((/^\d+$/.test(a)?pad(Number(a)):'12')+':00');
      const sb=e[b].s||((/^\d+$/.test(b)?pad(Number(b)):'12')+':00');
      return sa<sb?-1:sa>sb?1:0;
    });
    if(hs.length){
      const txt=hs.map(h=>{const x=e[h];return (x.t||(x.mv?(x.rt||''):(x.k==='rest'?'休憩':x.k==='sleep'?'睡眠':x.k==='meal'?('食事'+(x.p?' '+x.p:'')):x.k==='ai'?('AI'+(x.p?' '+x.p:'')):x.k==='work'?('仕事'+(x.p?' '+x.p:'')):x.p))||'')+actsLine(x,' ');}).filter(Boolean).join('。');
      cards+='<button class="ycard" data-yd="'+key+'"><div class="y">'+i+'年前 '+y+'</div><p>'+esc(txt||'記録あり')+'</p></button>';
    }
  }
  if(!cards)cards='<div class="ycard ph"><div class="y">🕰 1年目</div><p>来年、ここに「1年前の今日」が出る</p></div>';
  $('decade').innerHTML='<div class="cards">'+cards+'</div>';
  $('decade').querySelectorAll('[data-yd]').forEach(b=>b.onclick=()=>openDayPeek(b.dataset.yd));
}

  if(curMic.btn===btn){micStopAll();return;}
  micStopAll();
  if(!SR){ta.focus();toast('この端末はキーボードのマイク（音声入力）を使ってくれ');return;}
  let r;
  try{r=new SR();}catch(e){ta.focus();toast('音声が使えない。キーボードのマイクで');return;}
  let base=ta.value?(ta.value.replace(/\s+$/,'')+(ta.value.trim()?(ta.tagName==='INPUT'?' ':'\n'):'')):'';
  r.lang='ja-JP';r.interimResults=true;r.continuous=true;
  r.onresult=ev=>{
    r._got=true;
    let inter='';
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      const tr=ev.results[i][0].transcript;
      if(ev.results[i].isFinal)base+=tr;else inter+=tr;
    }
    if(ta.isConnected){ta.value=base+inter;if(ta.scrollHeight)ta.scrollTop=ta.scrollHeight;}
  };
  r.onerror=e=>{
    const c=e&&e.error;
    if(c==='not-allowed'||c==='service-not-allowed'){r._stop=true;toast('マイクの使用を許可してくれ。ダメならキーボードのマイクで');ta.focus();}
  };
  r.onend=()=>{
    /* 無音で勝手に切れても、止めるまで自動でつなぎ直す（長話OK）。
       ただし一度も文字にならないまま切れ続ける端末は、あきらめてキーボード音声へ誘導 */
    r._restarts=(r._restarts||0)+1;
    if(!r._stop&&curMic.r===r&&ta.isConnected&&btn.isConnected&&(r._got||r._restarts<4)){
      try{r.start();return;}catch(e){}
    }
    if(btn.isConnected)btn.classList.remove('rec');
    if(curMic.r===r)curMic={r:null,btn:null,ta:null};
    if(!r._stop&&!r._got&&ta.isConnected){
      ta.focus();
      toast('この端末はマイクが効かない。キーボードのマイク（音声入力）を使ってくれ');
    }
  };
  try{r.start();}catch(e){ta.focus();toast('音声が使えない。キーボードのマイクで');return;}
  curMic={r,btn,ta};
  btn.classList.add('rec');
  /* 録音中に手で打ち始めたら自動で止める（手直し優先） */
  if(!ta._micHook){
    ta._micHook=true;
    ta.addEventListener('input',()=>{if(curMic.ta===ta){micStopAll();toast('手入力に切り替えた');}});
  }
  toast('🎤 話して。もう一度押すと止まる');
}

      /* 種類を変えて隠れた欄の中身は捨てない：移動にしても元の場所(p)を残す／移動をやめても元の経路(rt)と乗り物(tr)を残す（表示は種類に合う方だけ使う） */
      const pKeep=isMv?((ex&&ex.p)||''):p;
      const ne=keepNoT?{p:pKeep,t,ph:phList,noT:1,ts:Date.now()}:{p:pKeep,t,ph:phList,s:tS,e:tE,ts:Date.now()};
      if(tEd&&tE&&!keepNoT)ne.ed=tEd;
      if(isMv){ne.mv=1;ne.rt=rt;if(trSel)ne.tr=trSel;}
      else if(ex&&ex.rt){ne.rt=ex.rt;if(ex.tr)ne.tr=ex.tr;}
      if(eType==='rest')ne.k='rest';
      if(eType==='sleep')ne.k='sleep';
      if(eType==='meal')ne.k='meal';
      if(eType==='ai')ne.k='ai';
      if(eType==='work')ne.k='work';
      if(pfS)ne.pf=pfS;if(pf0S)ne.pf0=pf0S;   /* 出発の県（移動） */
      if(tdS==='_other'){if(tdXS)ne.dx=tdXS;}else if(tdS)ne.d=tdS;   /* 使う物（その他は手入力の文字） */   /* 都道府県（［なし］にした時は付けない） */
      if(actsS.length)ne.acts=actsSort(actsS,actsBase(ne));   /* 時刻の早い順に並べて保存 */
      state.entries[d0][saveKey]=ne;
    });
    closeSheet();toast(d0!==ui.date?('✓ '+payMD(d0)+' に記録した'):'✓ 記録した');   /* 0時をまたいだ時など、見ている日と違う日に保存した時は日付を添える */
    if(!prev&&d0===todayStr())stepNudge();   /* 今日の記録を新しく書いた直後＝きっかけ。「今日の1個」を1回だけ見せる */
  };
  const del=$('shDel');
  if(del)del.onclick=()=>{
    if(!del.classList.contains('arm')){del.classList.add('arm');del.textContent='本当に削除？';
      setTimeout(()=>{if(del.isConnected){del.classList.remove('arm');del.textContent='削除';}},2500);return;}
    const d0=sheetSt.date,k0=sheetSt.key;
    mutate(()=>{state.entries[d0][k0]={del:1,ts:Date.now()};});
    closeSheet();toast('削除した');
  };
  openOvl();
}

function openPrefPicker(cur,onPick){

    openSub('<div class="sh-label">🗾 都道府県（エリアを1回押す）</div>'+
      (rc.length?'<div class="pf-rc"><span>🕘</span>'+rc.map(p=>'<button data-pc="'+p.code+'" style="--ac:'+p.co+'"'+(pc&&pc.code===p.code?' class="cur"':'')+'>'+esc(p.short)+'</button>').join('')+'</div>':'')+
      '<div class="pf-map">'+AREAS.map(a=>'<button data-pa="'+a[0]+'" style="'+AREA_MAP[a[0]]+';--ac:'+a[2]+'"'+(pc&&pc.area===a[0]?' class="cur"':'')+'>'+esc(a[1])+'</button>').join('')+'</div>'+

    $('sheet2').querySelectorAll('[data-pa]').forEach(b=>b.onclick=()=>{if(!sheetSt)return;if(b.dataset.pa==='hok')done(1);else step2(b.dataset.pa);});
    $('pfNone').onclick=()=>done(0);$('pfClose').onclick=closeSub;
  };
  const step2=aid=>{
    const a=areaOf(aid),ps=PREFS.filter(p=>p[2]===aid);if(!a||!ps.length)return;
    const MAINPF={toh:4,kan:13,chu:23,kin:27,chg:34,shi:38,kyu:40};   /* 記録が無い時の代表県 */
    const rc=pfRecent(60).find(c=>{const p=prefOf(c);return p&&p.area===aid;});
    const want=(pc&&pc.area===aid)?pc.code:(rc||MAINPF[aid]);
    const i0=Math.max(0,ps.findIndex(p=>p[0]===want));
    openSub('<div class="sh-label">🗾 '+esc(a.name)+'（くるくる回して選ぶ）</div>'+
      '<div class="pf-dw" style="--ac:'+a.co+'"><i class="pf-band"></i><div class="pf-drum" id="pfDrum">'+ps.map((p,i)=>'<button data-di="'+i+'">'+esc(p[3])+'</button>').join('')+'</div></div>'+
      '<div class="pf-btns"><button id="pfBack">← エリア</button><button id="pfNone">なし</button><button class="pf-ok" id="pfOk" style="background:'+a.co+'">これにする</button></div>',null);
    const dr=$('pfDrum'),its=Array.from(dr.children);let raf=0;
    /* 中央からの距離で 小さく・薄く・中央へ寄せる＝回る円筒に見せる */
    const upd=()=>{raf=0;const c=dr.scrollTop/DH,ci=Math.round(c);
      its.forEach((b,i)=>{const d=i-c,ad=Math.min(Math.abs(d),2.5);
        b.style.transform='translateY('+(-Math.sign(d)*ad*ad*3).toFixed(1)+'px) scale('+(1-ad*0.14).toFixed(3)+')';
        b.style.opacity=(1-ad*0.32).toFixed(2);b.classList.toggle('on',i===ci);});};
    dr.addEventListener('scroll',()=>{if(!raf)raf=requestAnimationFrame(upd);},{passive:true});
    dr.scrollTop=i0*DH;upd();
    its.forEach((b,i)=>b.onclick=()=>dr.scrollTo({top:i*DH,behavior:'smooth'}));
    $('pfBack').onclick=()=>{if(sheetSt)step1();};
    $('pfNone').onclick=()=>done(0);
    $('pfOk').onclick=()=>{const i=Math.min(ps.length-1,Math.max(0,Math.round(dr.scrollTop/DH)));done(ps[i][0]);};
  };
  step1();
}

/* ===================== 夢手帳（熊谷式） ===================== */
let pageMode=null,dseg='list';
function catOf(id){return CATS.find(c=>c.id===Number(id))||CATS[4];}
function dreamsActive(){
  const d=state.dreams||{};
  return Object.keys(d).filter(id=>!d[id].del&&!d[id].ach).map(id=>({id,...d[id]}));
}
function dreamsWon(){
  const d=state.dreams||{};
  return Object.keys(d).filter(id=>!d[id].del&&d[id].ach).map(id=>({id,...d[id]})).sort((a,b)=>(b.ach||0)-(a.ach||0));
}
function dreamDue(d){return d.due||(d.yr?(d.yr+'-12-31'):null);}
function daysTo(ds){return Math.ceil((parseD(ds)-new Date())/86400000);}
function dLeft(d){
  const du=dreamDue(d);if(!du)return '';
  const n=daysTo(du);
  return n>=0?('あと'+n+'日'):'超過';
}
function dSort(arr){
  const pv=p=>p==='A'?0:p==='B'?1:p==='C'?2:3;
  const dk=d=>dreamDue(d)||'9999-12-31';
  return arr.sort((a,b)=>(pv(a.pr)-pv(b.pr))||(dk(a)<dk(b)?-1:dk(a)>dk(b)?1:0)||((a.ts||0)-(b.ts||0)));
}
/* ===== 📌 帯の下に大きく出す夢 =====
   最初から出す物は無い（PIN_DEFAULT は空）。本人が夢のシートで切り替えた分だけ state.pins[id]={on,ts} に入る
   （初期値はデータに書き込まない＝起動のたびに保存が走らない）。叶った・消した夢は自動で出なくなる。出すのは PIN_MAX 個まで */
const PIN_DEFAULT={};
const PIN_MAX=2;
function pinOn(id){const p=(state.pins||{})[id];return p?!!p.on:!!PIN_DEFAULT[id];}
function pinnedDreams(){
  const dk=d=>dreamDue(d)||'9999-12-31';
  return dreamsActive().filter(d=>pinOn(d.id))
    .sort((a,b)=>(dk(a)<dk(b)?-1:dk(a)>dk(b)?1:0)||((a.ts||0)-(b.ts||0))).slice(0,PIN_MAX);
}
function pinIcon(t){
  const s=String(t||'');
  return /引っ?越|引越|住まい|マンション/.test(s)?'🏠':/法人|会社|設立|起業/.test(s)?'🏢':/上場/.test(s)?'📈':/資金|万円|売上|貯金/.test(s)?'💰':'🎯';
}
function renderPins(){
  const el=$('pinRow');if(!el)return;
  const arr=pinnedDreams();
  if(!arr.length){el.style.display='none';el.innerHTML='';return;}
  /* カード1枚＝夢の名前・あと何日・手順の進み・今日の1個。✓で完了、カードを押すと🎯のページ（全文と細かい操作） */
  el.innerHTML=arr.map(d=>{
    const st=stepStat(d),n=st.n,c=catOf(d.cat);
    const left=(n===null)?'期限なし':n<0?('⚠<em>'+(-n)+'</em>日超過'):n===0?'<em>今日</em>まで':('あと<em>'+n+'</em>日');
    const cnt=st.tot?('・'+st.dn+'/'+st.tot+'手'):'';
    return '<div class="pin" data-pin="'+esc(d.id)+'" style="background-color:'+((n!==null&&n<0)?'#e0405a':c.c)+'">'+
      /* 上の段＝夢の名前とあと何日（名前を切らさない）。下の段＝✓と今日の1個 */
      '<div class="pin-h"><span class="pi">'+pinIcon(d.t)+'</span><span class="pt"><b>'+esc(d.t)+'</b><small>'+left+cnt+'</small></span></div>'+
      (st.next?'<div class="pin-s"><button class="pin-ok" data-ok="'+esc(st.next.id)+'" aria-label="やった">✓</button><span class="pin-tx">'+esc(st.next.t)+'</span></div>'
        :st.tot?'<div class="pin-s"><span class="pin-tx">🎉 手順は全部やった</span></div>'
        :'<button class="pin-gen" data-gen="'+esc(d.id)+'">🤖 手順を作る</button>')+
      '</div>';
  }).join('');
  el.style.display='';
  el.querySelectorAll('[data-pin]').forEach(b=>b.onclick=()=>openAimPage(b.dataset.pin));
  el.querySelectorAll('[data-ok]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();stepDone(b.dataset.ok);});
  el.querySelectorAll('[data-gen]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();openAimPage(b.dataset.gen);openStepGen(b.dataset.gen);});
}

/* 人生時計（GMO夢アプリ準拠：生年月日＋目標寿命→残り日数） */
function renderClock(){
  const L=state.life;
  if(!L||!L.bd){
    return '<div class="planwrap" style="background:#fff;border-color:var(--line)">'+
      '<div class="sh-label">⏳ 人生時計のセットアップ（1回だけ）</div>'+
      '<div class="prow" style="margin-top:6px"><input type="date" id="lcBd" lang="ja-JP" style="flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;font-size:15px"></div>'+
      '<div class="prow"><input type="number" id="lcGoal" min="50" max="150" value="120" style="flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;font-size:15px;text-align:center"><span style="align-self:center;font-weight:800;color:var(--sub)">歳まで生きる</span></div>'+
      '<button class="savebtn" id="lcSave" style="width:100%">人生時計を動かす</button>'+
      '<div class="sh-note">生年月日はこの端末とあんたのクラウドにだけ保存される</div></div>';
  }
  const bd=parseD(L.bd),goal=Number(L.goal||120);
  const end=new Date(bd.getFullYear()+goal,bd.getMonth(),bd.getDate());
  const now=new Date();
  const left=Math.max(0,Math.ceil((end-now)/86400000));
  const pct=Math.min(100,Math.max(0,((now-bd)/(end-bd))*100));
  const age=Math.floor((now-bd)/31557600000);
  const C=2*Math.PI*93;
  return '<div class="lifewrap">'+
    '<div class="lifecap">'+goal+'歳まであと</div>'+
    '<div class="lifebig">'+left.toLocaleString()+'<small>日</small></div>'+
    '<div class="lring"><svg viewBox="0 0 210 210"><circle class="bg" cx="105" cy="105" r="93"/>'+
    '<circle class="arc" cx="105" cy="105" r="93" stroke-dasharray="'+(C*pct/100).toFixed(1)+' '+C.toFixed(1)+'"/></svg>'+
    '<div class="inner"><span class="nm">いま '+age+'歳</span><span class="ag">人生の'+pct.toFixed(1)+'%を使った</span>'+
    '<button class="chip" id="lcEdit" style="margin-top:6px;font-size:10.5px">設定</button></div></div>'+
    '<div class="quote">夢あるところに行動がある<br>行動は習慣をつくり<br>習慣は人格をつくり<br>人格は運命をつくる</div>'+
    '</div>';
}

let ytYear=(new Date()).getFullYear();
function renderYearTable(){
  const L=state.life;
  const arr=Object.keys(state.dreams||{}).map(id=>({id,...state.dreams[id]})).filter(d=>!d.del);
  let age='';
  if(L&&L.bd){const by=parseD(L.bd).getFullYear();age='（'+(ytYear-by-1)+'歳〜'+(ytYear-by)+'歳）';}
  let html='<div class="ynav"><button id="ytPrev">‹</button><span>'+ytYear+'年<span class="age">'+age+'</span></span><button id="ytNext">›</button></div>';
  let any=false;
  for(const c of CATS){
    const ds=dSort(arr.filter(d=>Number(d.cat)===c.id&&dreamDue(d)&&dreamDue(d).slice(0,4)==String(ytYear)));
    if(!ds.length)continue;
    any=true;
    html+='<div class="ycat" style="background:'+c.c+'12"><div class="yc-h" style="color:'+c.c+'">'+esc(c.n)+'　'+ds.length+'件</div>'+

      '</div>';

}

/* 本人が書き出した「毎月の支払い」の一覧に合わせる（本人指示 2026-09-30）。1回だけ走る（state.payfix.v1 に印）。

const PAY_FIX1=[];

function fmtYen(a){const n=Number(a)||0;return n.toLocaleString('ja-JP');}

function paysOf(){

function payDays(d){return Math.round((parseD(d)-parseD(todayStr()))/86400000);}

function payPv(p){return !!(p&&p.pv&&!p.done);}

/* 「家賃（10月分）」→「家賃」。月が違っても同じ毎月払いとして扱うための名前 */
function payMonOf(c){const m=PAY_MON_RE.exec(String(c||''));const n=m?Number(payZen(m[1])):0;return (n>=1&&n<=12)?n:0;}
function payBase(c){const s=String(c||'');return (payMonOf(s)?s.replace(PAY_MON_RE,''):s).trim();}   /* 1〜12月の時だけ外す（「（13月分）」は文字のまま残す＝表示と名前を食い違わせない） */

function payHash(s){let a=2166136261,b=5381;s=String(s);for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,16777619)>>>0;b=(Math.imul(b,33)+c)>>>0;}return a.toString(36)+b.toString(36)+s.length.toString(36);}

    :p.m==='debit'?('🏧 口座引落'+(p.fa?'（'+p.fa+'）':''))

  if((tab!=='up'&&tab!=='dn')||(dir!=='asc'&&dir!=='desc'))return;

function paySorted(list,tab){
  const key=tab==='dn'?(x=>payPaidDate(x)||String(x.d)):(x=>String(x.d));
  const sub=tab==='dn'?(x=>x.done||0):(x=>x.ct||x.ts||0);   /* 同じ日の中は、登録した（払った）順 */
  const sg=paySort[tab]==='desc'?-1:1;

    return ka!==kb?((ka<kb?-1:1)*sg):((sub(a)-sub(b))*sg);});

        /* 種類を切り替えて仮の分を消した時：その消した印が「この支払いはやめた」の合図に読まれないよう、再開の印を消した印より新しくしておく */
        if(putInfo.redo){const c2=(state.payrep||{})[nk]||{off:rep?0:1};state.payrep=state.payrep||{};
          state.payrep[nk]=Object.assign({},c2,{ts:Date.now()+2},c2.off?{}:{rs:todayStr()});}}
    });};
  $('pySave').onclick=()=>{
    const o=collect();if(!o)return;
    {let nid=id;if(!nid){nid='py'+Date.now()+Math.floor(Math.random()*1e4);while((state.pays||{})[nid])nid+='_';}   /* 既にある番号は使わない（上書きしない） */
      put(nid,o);}
    if(putInfo.sw==='on'||putInfo.yrSw){try{payRoll();}catch(e){}}   /* 再開した・毎月⇔年間を切り替えた時は、足りない次の分をすぐ作る */
    /* 保存した支払いが見える月へ移す（期日が過去なら今月＝払い残しとして出る。払い済みの編集は今の表示のまま）。
       「毎月」のタブから開いた時は、毎月のタブのまま */
    if(!o.done&&payTab!=='rp'){const cm=todayStr().slice(0,7),dm=o.d.slice(0,7);payYM=(dm<cm)?cm:dm;payTab='up';}
    closeSheet();renderPayPage();
    const nd=payDays(o.d);
    toast((o.done?'✓ 保存した':nd<0?'⚠ 期限を過ぎている支払いとして登録した':nd<=7?'✓ 登録した（'+payLabel(nd)+'）':'✓ 登録した。7日前から知らせる')+
      (putInfo.sw==='off'?'。毎月を止めた（翌月分は作らない）':putInfo.sw==='on'?'。毎月を再開した':(o.rep&&rep&&!(ex&&ex.rep))?(o.yr?'。📅年間払いに登録した':'。🔁毎月の一覧に登録した'):'')+
      ((putInfo.sync||putInfo.moved)?'。翌月以降 '+Math.max(putInfo.sync,putInfo.moved)+'件にも反映した':'')+
      (putInfo.yrSw?('。'+(o.yr?'年間払い':'毎月')+'に切り替えた'+(putInfo.redo?'（先の仮の分は作り直した）':'')):''));
  };
  /* ✓払った：押しただけでは登録しない。「いつ払った？」で本人が日を選んだ時に、その日で登録する
     （本人指示 2026-09-30：払った日は押した日とは限らない。勝手に押した日で登録しない） */
  const dn=$('pyDone');
  const pdReg=pd=>{
    if(!/^\d{4}-\d{2}-\d{2}$/.test(String(pd||''))){toast('払った日を選んでくれ');return;}
    if(pd>todayStr()){toast('払った日に、先の日付は入れられない');return;}
    const o=collect();if(!o)return;
    o.done=Date.now();o.pd=pd;
    put(id,o);
    const sy=Math.max(putInfo.sync,putInfo.moved);
    let made=0;try{made=payRoll()||0;}catch(e){}
    closeSheet();renderPayPage();
    payCelebrate({id,...o},(made&&o.rep&&rep)?1:0);   /* 翌月分の案内は、押した支払いが毎月払い（止めていない）の時だけ */
    if(sy)setTimeout(()=>toast('直した中身を、翌月以降 '+sy+'件にも反映した'),2500);
  };
  /* 「いつ払った？」の箱を開く。keep＝入れかけの日付を残す（読み直しの後に戻す時） */
  const pdOpen=keep=>{
    const o=collect();if(!o)return false;   /* 入力の不備は、日を選ぶ前に知らせる */
    {const hd=document.querySelector('#pyPdBox .pd-h span');if(hd)hd.textContent='✓ いつ'+payDoneWord(o)+'？';}
    const box=$('pyPdBox');if(!box)return false;
    const t=todayStr(),y=addDays(t,-1);
    const list=[['今日',t],['昨日',y]];
    if(o.d<y)list.push(['期日の日',o.d]);   /* 期日が今日・昨日より前の時だけ出す（先の日は「払った日」にならない） */
    $('pyPdChips').innerHTML=list.map(a=>'<button data-pd="'+a[1]+'">'+a[0]+'<b>'+esc(payMD(a[1]))+'</b></button>').join('');
    $('pyPdChips').querySelectorAll('[data-pd]').forEach(b=>b.onclick=()=>pdReg(b.dataset.pd));
    if(!keep)$('pyPd').value='';
    box.style.display='';if(dn)dn.style.display='none';
    return true;
  };
  if(dn)dn.onclick=()=>{if(pdOpen(false)){try{$('pyPdBox').scrollIntoView({block:'center'});}catch(e){}}};
  if($('pyPdGo'))$('pyPdGo').onclick=()=>pdReg($('pyPd').value);
  if($('pyPdX'))$('pyPdX').onclick=()=>{$('pyPdBox').style.display='none';if(dn)dn.style.display='';};
  /* 読み直しで閉じられた時に箱を開いていたら、開いたまま・入れかけの日付も戻す */
  if(dr&&dr.pdo&&$('pyPdBox')&&dn){
    if(/^\d{4}-\d{2}-\d{2}$/.test(dr.pdv||''))$('pyPd').value=dr.pdv;
    pdOpen(true);
  }
  const dl=$('pyDel');
  if(dl)dl.onclick=()=>{
    if(!dl.classList.contains('arm')){dl.classList.add('arm');dl.textContent='本当に削除？';
      setTimeout(()=>{if(dl.isConnected){dl.classList.remove('arm');dl.textContent='削除';}},2500);return;}
    /* 毎月払いの「一番先の分」を消す＝その毎月払いの自動作成が止まる（payRoll が復活させない）。それを本人に伝える */
    /* 一番先の分かどうかは「月」で比べる。同じ月にもう1件ある時（二重に登録した片方を消す等）は、毎月払いを止めない（2026-09-30レビュー指摘） */
    const tail=!!(ex&&ex.rep)&&!paysOf().some(p=>p.id!==id&&p.rep&&payKey(p)===payKey(ex)&&String(p.d).slice(0,7)>=String(ex.d).slice(0,7));
    /* 自動作成が止まる時は、毎月の一覧でも「止めている」と出す（スイッチで再開できる）。
       印を付けないと、一覧では「自動で作る」のままなのに作られない（2026-09-30レビュー指摘） */
    const tk=ex?payKey(ex):'',mark=tail&&!payRepOff(tk);
    mutate(()=>{state.pays[id]={...(state.pays[id]||{}),del:1,ts:Date.now()};if(mark)payRepSet(tk,true);});
    closeSheet();renderPayPage();toast(tail?'削除した。この支払いの自動作成は止めた（🔁毎月のスイッチで再開できる）':'削除した');
  };
}

/* ===== 睡眠のワンタップ（どこで寝たかも一緒に）・「どこで何を」を楽に =====
   夜は「😴 寝る」：今の時刻で睡眠の記録を作る（起床は空＝寝てる最中）。場所は前回寝た場所を自動で入れる。
   朝は「☀ 起きた」：寝てる最中の記録に起床時刻を入れて確定。日またぎは自動で翌日扱い。
   「📍前回の場所」：その場所が入った状態で記録シートを開く（何をしたかだけ書けばいい） */
function durMin(s,e,ed){if(!s||!e)return 0;const a=s.split(':').map(Number),b=e.split(':').map(Number);let m=(b[0]*60+b[1])-(a[0]*60+a[1])+(ed||0)*1440;if(m<0)m+=1440;return m;}
function hmAdd(s,m){const a=String(s||'').split(':').map(Number),t=((a[0]||0)*60+(a[1]||0)+Number(m||0))%1440;return pad(Math.floor(t/60))+':'+pad(t%60);}   /* 'HH:MM'＋分 */
function durText(m){if(!m)return '';const h=Math.floor(m/60),mm=m%60;return (h?h+'時間':'')+(mm?mm+'分':'');}
function nowHM(){const d=new Date();return pad(d.getHours())+':'+pad(Math.floor(d.getMinutes()/10)*10);}
function openSleep(){
  for(const d of [todayStr(),addDays(todayStr(),-1)]){
    const eo=state.entries[d]||{};
    for(const k in eo){const en=eo[k];if(en&&!en.del&&en.k==='sleep'&&en.s&&!en.e)return {d,k,en};}
  }
  return null;
}
function lastSleepPlace(){
  const ds=Object.keys(state.entries).sort().reverse().slice(0,30);
  for(const d of ds){const eo=state.entries[d];for(const k in eo){const en=eo[k];if(en&&!en.del&&en.k==='sleep'&&en.p)return en.p;}}
  return '';
}
function lastPlaceRecent(){
  for(const d of [todayStr(),addDays(todayStr(),-1)]){
    const eo=state.entries[d]||{};let best=null;
    for(const k in eo){const en=eo[k];if(en&&!en.del&&en.p&&en.k!=='sleep'&&!en.mv){if(!best||(en.s||'')>(best.s||''))best=en;}}
    if(best)return best.p;
  }
  return '';
}

}
function quickWake(){
  const o=openSleep();

}

/* ===== 😴 睡眠の見える化（生活態度つき・矯正用） =====
   睡眠の記録（k:sleep）を「起きた日」にまとめ、合計時間と態度を判定する。
   判定：⏰寝坊＝9時以降に起床（毎日のルール「9時までに起床」）／🔁二度寝＝14時前に終わる睡眠が2回以上／
        🦉夜更かし＝1〜5時に就寝／😪寝すぎ＝9時間半以上／😵寝不足＝6時間未満／💤昼寝＝11〜20時に就寝 */
/* 睡眠の目標（本人指示 2026-10-01）：2:00までに寝る・7時間以上・9時までに起きる。3つ揃って他の印も無ければ ✅良い朝 */
const SLEEP_BED='02:00',SLEEP_MIN=420,SLEEP_WAKE='09:00';
/* ✅良い朝が何日続いているか（今日に判定があれば今日から、無ければ昨日から数える） */
function sleepStreak(by,endDay){
  by=by||sleepSessions();let d=endDay||todayStr(),n=0;
  if(!sleepDay(d,by))d=addDays(d,-1);
  while(true){const sd=sleepDay(d,by);if(!sd||!sd.good)break;n++;d=addDays(d,-1);if(n>3650)break;}
  return n;
}
/* 夜、「✚書く」の行に出す締切の札：22時〜2:00は「2:00まで あと◯分」、2:00〜5:00でまだ寝ていなければ「2:00すぎ」。寝ている最中・朝は出さない */
function sleepBedPill(){
  try{
    if(openSleep())return '';
    const now=new Date(),hh=now.getHours(),mm=now.getMinutes();
    if(hh>=22){const left=(24-hh)*60-mm+120;return '<button class="bed'+(left<=20?' hot':left<=60?' warn':'')+'" id="bedPill">🌙 2:00まで'+esc(durText(left))+'　寝る</button>';}
    if(hh<2){const left=(2-hh)*60-mm;return '<button class="bed'+(left<=20?' hot':left<=60?' warn':'')+'" id="bedPill">🌙 2:00まで'+esc(durText(left))+'　寝る</button>';}
    if(hh<5){const t=todayStr();const slept=(sleepSessions()[t]||[]).length>0;   /* 今日もう起きた後なら出さない */
      return slept?'':'<button class="bed over" id="bedPill">⚠ 2:00すぎ　寝る</button>';}
  }catch(e){}
  return '';
}
/* 1分ごとに札だけ描き直す（画面全体は描き直さない＝スクロール位置を動かさない） */
function sleepBedTick(){
  try{
    const el=$('bedPill'),html=(ui.date===todayStr())?sleepBedPill():'';
    if(el){if(!html)el.remove();else el.outerHTML=html;}
    else if(html){const r=document.querySelector('.hour.wr .wr-r');if(r)r.insertAdjacentHTML('afterbegin',html);}
    const b=$('bedPill');if(b)b.onclick=ev=>{ev.stopPropagation();quickSleepStart();};
    /* 札が出ている間は「😴寝る」のチップは重ねて出さない */
    const ws=$('wrSleep');if(ws&&$('bedPill'))ws.remove();
  }catch(e){}
  sleepBarTick();
}
/* ===== 実時間の注意（本人指示 2026-10-01「スマホの時計などリアルタイムな時間を拾い、就寝時間や寝不足がある場合、注意表示」） =====
   日記の記録ではなく端末の時計で「いま」を見て、下のナビのすぐ上に細い帯を出す。
   ①1:30〜2:00「そろそろ寝る」（黄）②2:00〜5:00でまだ寝ていない「2:00をN分すぎた。寝ろ」（赤）③20時〜1時、直近の睡眠が7時間未満「昨夜◯時間（◯不足）。今夜は早く寝る」（紫）。
   寝ている最中・今日もう起きた後・シートを開いている間・トップの「寝る」の札が見えている時（二重になる）は出さない。✕で今日は消せる（端末に覚える） */
function sleepBarInfo(){
  const now=new Date(),hh=now.getHours(),mm=now.getMinutes(),t=todayStr();
  const by=sleepSessions(),sleeping=!!openSleep();
  if(!sleeping){
    const sleptToday=(by[t]||[]).length>0;
    if(hh===1&&mm>=30)return {k:'warn:'+t,cls:'warn',txt:'🌙 2:00まで あと'+(60-mm)+'分。そろそろ寝る',act:'sleep'};
    if(hh>=2&&hh<5&&!sleptToday){const over=(hh-2)*60+mm;return {k:'over:'+t,cls:'over',txt:'⚠ 2:00を'+(over?durText(over):'')+'すぎた。寝ろ',act:'sleep'};}
  }
  if(!sleeping&&(hh>=20||hh<1)){
    const wd=(by[t]&&by[t].length)?t:addDays(t,-1);   /* 今日起きた分があれば今日、無ければ昨日の睡眠 */
    const sd=sleepDay(wd,by);
    const nt=(hh<1)?addDays(t,-1):t;   /* 「今夜」の日付（0時台は前の日の夜の続き＝✕で消した印が0時で復活しない） */
    if(sd&&sd.total<SLEEP_MIN)return {k:'def:'+nt,cls:'def',txt:'😵 '+(wd===t?'今朝までの睡眠 ':'昨夜の睡眠 ')+durText(sd.total)+'（'+durText(SLEEP_MIN-sd.total)+'不足）。今夜は早く寝る',act:'page'};
  }
  return null;
}

function stepsOf(dr){return stepsAll().filter(x=>x.dr===dr).sort((a,b)=>((Number(a.o)||0)-(Number(b.o)||0))||((a.c||0)-(b.c||0)));}
function stepNewId(i){return 'st'+Date.now()+'_'+(i||0)+'_'+Math.floor(Math.random()*1e4);}
/* 進み具合：やった数／全部。残りの手数と残り日数から「1日に何手で間に合うか」（割り算だけ・予定は組まない） */
function stepStat(d){
  const l=stepsOf(d.id),dn=l.filter(x=>x.d).length,left=l.length-dn;
  const du=dreamDue(d),n=du?daysTo(du):null;
  let per=null,lv='ok';
  if(left>0&&n!==null){
    if(n<0)lv='over';
    else if(n===0)lv='hot';
    else{per=Math.ceil(left/n);lv=per>=3?'hot':per>=2?'warm':'ok';}
  }
  const txt=!l.length?'':!left?'手順は全部やった 🎉'
    :(n===null?('残り'+left+'手'):n<0?('残り'+left+'手・期限を過ぎている'):n===0?('残り'+left+'手・今日が期限'):('残り'+left+'手・1日'+per+'手で間に合う'));
  return {l,dn,left,tot:l.length,n,per,lv,txt,next:l.find(x=>!x.d)||null};
}
/* ✓やった：手順を完了にして記録→紙吹雪。次の1個は勝手に出る（考えなくていい） */
function stepDone(sid){
  const s=(state.steps||{})[sid];if(!s||s.del||s.d)return;
  const d=(state.dreams||{})[s.dr],t=todayStr();
  mutate(()=>{
    state.steps[sid]=Object.assign({},s,{d:Date.now(),dts:Date.now(),ts:Date.now()});
    state.moves=state.moves||{};
    /* 記録の番号は手順から決める＝2台で同じ手順を✓しても1件にまとまる（二重に数えない） */
    state.moves['mv_'+sid]={d:t,dr:s.dr,t:s.t,sid:sid,ts:Date.now()};
  });
  if($('page').classList.contains('open')&&pageMode==='aim')renderAimPage();
  const st=(d&&!d.del)?stepStat({id:s.dr,...d}):null;
  celShow('<div class="pc-ck">✓</div><div class="pc-t">やった！</div><div class="pc-n">'+esc(s.t)+'</div>'+
    (st?'<div class="pc-s">🎯 '+esc(d.t)+'　'+st.dn+' / '+st.tot+'手</div>':'')+
    '<div class="pc-s">今日 '+movesOn(t).length+'手目</div>'+
    ((st&&st.next)?'<div class="pc-s" style="opacity:.9;font-size:11.5px">次：'+esc(st.next.t)+'</div>':''));
}
/* きっかけに結ぶ：今日の記録を新しく書いた直後に「今日の1個」を1回だけ見せる（今日まだ1手もやっていない時・30分に1回まで） */
function stepNudge(){
  try{
    if(Date.now()-nudgeAt<1800000)return;
    if(movesOn(todayStr()).length)return;
    const nx=pinnedDreams().map(d=>stepStat(d).next).filter(Boolean)[0];
    if(!nx)return;
    nudgeAt=Date.now();
    /* 出す直前にもう一度確かめる：その間に✓した／手順が変わった／別の案内が出ている時は、出さない */
    setTimeout(()=>{try{
      if(movesOn(todayStr()).length)return;
      const s=(state.steps||{})[nx.id];if(!s||s.del||s.d)return;
      if($('toast').classList.contains('show')||$('ovl').classList.contains('open'))return;
      toast('🎯 今日の1個：'+s.t);
    }catch(e){}},2400);
  }catch(e){}
}

/* ---- AI（アプリの中からClaudeに聞く。呼ぶのは本人がボタンを押した時だけ） ---- */
async function getSample(){
  if(sampleNS!==undefined)return sampleNS;
  try{sampleNS=(window.claude&&window.claude.use)?(await withTimeout(window.claude.use('sample'),12000,'use_sample')):null;}
  catch(e){sampleNS=null;}
  if(!sampleNS)sampleNS=null;
  return sampleNS;
}
function aiErrText(c){
  return c==='cancelled'?''
    :c==='not_granted'?'AIを使う許可が出ていない。自分で1行書いてくれ'
    :c==='rate_limited'?'AIの利用枠がいっぱい。少し待ってからもう一度'
    :c==='session_expired'?'ログインが切れている。入り直してからもう一度'
    :c==='refused'?'AIが答えを出さなかった。状況の書き方を変えてもう一度'
    :(c==='invalid_json'||c==='empty_completion'||c==='bad_shape')?'AIの答えが読めなかった。もう一度押してくれ'
    :(c==='no_sample'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed')?'この画面ではAIを呼べない。自分で1行書いてくれ'
    :'AIとつながらなかった（'+String(c||'不明')+'）。もう一度押してくれ';
}
/* 文章の中から JSON を拾う（json が使えない古い画面向けの保険） */
function aiParse(text){
  const s=String(text||'');
  try{return JSON.parse(s);}catch(e){}
  const m=/```(?:json)?\s*([\s\S]*?)```/.exec(s);
  if(m){try{return JSON.parse(m[1]);}catch(e){}}
  const a=s.search(/[\[{]/),b=Math.max(s.lastIndexOf(']'),s.lastIndexOf('}'));
  if(a>=0&&b>a){try{return JSON.parse(s.slice(a,b+1));}catch(e){}}
  throw {code:'invalid_json'};
}
/* AIの答えを手順の並びに直す（形が多少ちがっても拾う。1個60文字まで・16個まで） */
function stepsFromAi(v){
  const arr=Array.isArray(v)?v:((v&&Array.isArray(v.steps))?v.steps:[]);
  const out=arr.map(x=>(typeof x==='string')?x:(x&&(x.t||x.text||x.step||x.title))||'')
    .map(s=>String(s||'').replace(/\s+/g,' ').trim()).filter(s=>s.length>0).map(s=>s.slice(0,60)).slice(0,16);
  if(!out.length)throw {code:'bad_shape'};
  return out;
}
async function aiAsk(prompt,tier,signal){
  const S=await getSample();
  if(!S)throw {code:'no_sample'};
  AIB.busy=true;AIB.at=Date.now();
  try{
    const opts={modelTier:tier||'default',cache:false};
    if(signal)opts.signal=signal;
    if(typeof S.json==='function')return await S.json(prompt,opts);
    const r=await S(prompt,opts);
    return aiParse(r&&r.text);
  }finally{AIB.busy=false;}
}
function aiGenPrompt(d,cx){

  const done=stepsOf(d.id).filter(x=>x.d).map(x=>x.t);
  return 'あなたは、計画どおりに動くのが苦手な人（ADHD）の伴走者。次の目標を「今日すぐ始められる小さな手順」に分ける。\n\n'+
    '目標: '+d.t+'\n'+
    (du?('期限: '+du+'（今日は '+todayStr()+'。'+(n<0?'期限を過ぎている':'あと'+n+'日')+'）\n'):'期限: 決めていない\n')+
    (d.memo?('本人のメモ: '+String(d.memo).slice(0,400)+'\n'):'')+
    (cx?('本人のいまの状況: '+cx+'\n'):'')+
    (done.length?('もう終わった手順: '+done.slice(-12).join(' / ')+'\n'):'')+
    '\n条件:\n'+
    '- 8〜12個。上から順にやれば目標に届く順番にする'+(done.length?'（終わった手順の続きから）':'')+'\n'+
    '- 1個は5〜15分で終わる大きさ。1個目は2分で終わるくらい簡単にする\n'+
    '- 「〜を3つ書く」「〜に電話する」のように、動詞で終わる具体的な行動にする。1個は20文字以内\n'+
    '- 日付・曜日・時刻は書かない\n'+
    '- 分からない前提は決めつけず、「〜を決める」という手順にする\n'+
    '- 日本語で書く\n\n'+
    '返事は JSON の配列だけ。説明は書かない。例: [{"t":"会社名の候補を3つ書く"},{"t":"本店の住所を決める"}]';
}
function aiSplitPrompt(d,s){
  return '次の手順が大きすぎて始められない。2〜4個の、もっと小さい手順に分ける。\n\n'+
    '目標: '+(d?d.t:'')+'\n大きすぎる手順: '+s.t+'\n\n'+
    '条件:\n- 1個は5分以内で終わる大きさ\n- 1個目は「スマホで◯◯を開く」くらい簡単にする\n'+
    '- 動詞で終わる具体的な行動にする。1個は20文字以内\n- 日付・曜日・時刻は書かない\n- 日本語で書く\n\n'+
    '返事は JSON の配列だけ。説明は書かない。例: [{"t":"法務局のサイトを開く"},{"t":"必要な書類の名前を3つ写す"}]';
}
/* もっと小さく：いまの1個をAIが2〜4個に割って、同じ場所に入れ替える */
async function stepSplit(sid,btn){
  const s0=(state.steps||{})[sid];if(!s0||s0.del||s0.d)return;
  if(AIB.busy){toast('いまAIが考えている。少し待ってくれ');return;}
  const d=(state.dreams||{})[s0.dr];
  if(btn){btn.disabled=true;btn.textContent='🔬 考え中…';}
  toast('🔬 AIが小さく分けている…');
  try{
    const list=stepsFromAi(await aiAsk(aiSplitPrompt(d,s0),'quick',null)).slice(0,4);
    const s=(state.steps||{})[sid];
    /* 待っている間に本人がその手順を ✓・直す・消す をしていたら、AIの答えは捨てる（本人の操作を消さない） */
    if(!s||s.del||s.d||s.t!==s0.t||(s.ts||0)!==(s0.ts||0)){
      toast('その手順は変わっていたので、分けるのをやめた');
      if($('page').classList.contains('open')&&pageMode==='aim'&&!$('ovl').classList.contains('open'))renderAimPage();
      return;
    }
    const all=stepsOf(s.dr),ix=all.findIndex(x=>x.id===sid);
    const o0=Number(s.o)||0,o1=(ix>=0&&all[ix+1])?(Number(all[ix+1].o)||(o0+1)):(o0+1);
    const gap=(o1>o0?(o1-o0):1)/(list.length+1);
    mutate(()=>{
      state.steps[sid]=Object.assign({},s,{del:1,ts:Date.now()});
      list.forEach((t,i)=>{state.steps[stepNewId(i)]={dr:s.dr,t:t,o:o0+gap*i,d:0,c:Date.now()+i,by:'ai',ts:Date.now()};});
    });
    toast('🔬 '+list.length+'個に分けた。1個目からでいい');
  }catch(e){
    const m=aiErrText(e&&e.code);if(m)toast(m);
    if(btn&&btn.isConnected){btn.disabled=false;btn.textContent='🔬 もっと小さく';}
    if(e&&(e.code==='no_sample'||e.code==='not_granted'))openStepEdit(s0.dr,sid);   /* AIが使えない時は、自分で書き直す欄を出す */
    return;
  }
  if($('page').classList.contains('open')&&pageMode==='aim')renderAimPage();
}

    mutate(()=>{state.moves[b.dataset.mv]=Object.assign({},mv,{del:1,ts:Date.now()});

/* 手順を1行で書く／直す。sid が無ければ新しく足す（いちばん後ろへ。手順が1個も残っていなければ、それが今日の1個になる） */
function openStepEdit(dr,sid){
  const d=(state.dreams||{})[dr];if(!d||d.del)return;
  const ex=sid?(state.steps||{})[sid]:null;
  $('sheet').innerHTML='<div class="grab"></div><div class="sh-time"><span>'+(ex?'✏️ 手順を直す':'＋ 手順を足す')+'</span></div>'+
    '<div style="font-weight:800;font-size:14px;text-align:center;word-break:break-word">'+esc(d.t)+'</div>'+
    '<div><div class="sh-label">1行だけ（5分で始められる大きさで・話してもOK）</div><div class="sh-ta-wrap"><input type="text" id="seT" maxlength="60" style="padding-right:46px" placeholder="例：○○に電話する">'+
      '<button class="sh-mic" id="seMic" style="top:5px;bottom:auto">'+MICSVG+'</button></div></div>'+
    '<div class="sh-btns">'+(ex?'<button class="delbtn" id="seDel">削除</button>':'')+
      ((ex&&ex.d)?'<button class="delbtn" id="seUndo" style="background:#f1f3f8;color:#4a4f5e">まだに戻す</button>':'')+
      '<button class="savebtn" id="seSave">決　定</button></div>';
  $('seT').value=ex?(ex.t||''):'';
  $('seMic').onclick=()=>micToggle($('seMic'),$('seT'));
  const back=()=>{closeSheet();if($('page').classList.contains('open')&&pageMode==='aim')renderAimPage();};
  /* シートを開いている間に、その手順が消えていないか（AIが割って入れ替えた・別の端末で消した）を保存の直前に確かめる。
     消えた手順に書き込むと、本人の入力が黙って失われる（2026-09-30レビュー指摘） */
  const gone=()=>{const c=(state.steps||{})[sid];return !c||!!c.del;};
  $('seSave').onclick=()=>{
    const v=$('seT').value.replace(/\s+/g,' ').trim();
    if(!v){toast('手順を1行だけ書いてくれ');return;}
    if(ex&&gone()){
      /* 元の手順はもう無い。書いた文は捨てずに、同じ場所へ新しい手順として足す */
      if(v===ex.t){back();toast('この手順は入れ替わっていた');return;}
      mutate(()=>{state.steps=state.steps||{};state.steps[stepNewId(0)]={dr:dr,t:v,o:(Number(ex.o)||0)-0.0001,d:0,c:Date.now(),by:'me',ts:Date.now()};});
      back();toast('✓ 手順が入れ替わっていたので、新しい手順として足した');return;
    }
    if(ex){if(v!==ex.t)mutate(()=>{state.steps[sid]=Object.assign({},state.steps[sid],{t:v,ts:Date.now()});});}
    else{
      const l=stepsOf(dr),mx=l.reduce((m,x)=>Math.max(m,Number(x.o)||0),0);
      mutate(()=>{state.steps=state.steps||{};state.steps[stepNewId(0)]={dr:dr,t:v,o:mx+1,d:0,c:Date.now(),by:'me',ts:Date.now()};});
    }
    back();toast(ex?'✓ 直した':'✓ 手順を足した');
  };
  const dl=$('seDel');
  if(dl)dl.onclick=()=>{
    if(!dl.classList.contains('arm')){dl.classList.add('arm');dl.textContent='本当に削除？';
      setTimeout(()=>{if(dl.isConnected){dl.classList.remove('arm');dl.textContent='削除';}},2500);return;}
    if(gone()){back();toast('この手順は入れ替わっていた');return;}
    mutate(()=>{state.steps[sid]=Object.assign({},state.steps[sid],{del:1,ts:Date.now()});});
    back();toast('削除した');
  };
  const un=$('seUndo');
  if(un)un.onclick=()=>{
    if(gone()){back();toast('この手順は入れ替わっていた');return;}
    mutate(()=>{state.steps[sid]=Object.assign({},state.steps[sid],{d:0,dts:Date.now(),ts:Date.now()});
      const m=state.moves||{};for(const k in m){if(m[k]&&!m[k].del&&m[k].sid===sid)m[k]=Object.assign({},m[k],{del:1,ts:Date.now()});}});
    back();toast('まだに戻した');
  };
  openOvl();
}
/* AIに手順を作らせる：状況を1行（任意）→ AIの案を見る →「これで始める」で入れる。入れるまではデータを変えない */
function openStepGen(dr){
  const d0=(state.dreams||{})[dr];if(!d0||d0.del)return;
  const d={id:dr,...d0},a=aimOf(dr)||{};
  const old=stepsOf(dr),undone=old.filter(x=>!x.d);
  let draft=null;
  $('sheet').innerHTML='<div class="grab"></div><div class="sh-time"><span>🤖 手順を作る</span></div>'+
    '<div style="font-weight:800;font-size:14px;text-align:center;word-break:break-word">'+esc(d.t)+(dreamDue(d)?'　<span style="color:#8a90a0;font-size:12px">'+esc(dLeft(d))+'</span>':'')+'</div>'+
    '<div><div class="sh-label">いまの状況を1行（書かなくてもOK・話してもOK）</div><div class="sh-ta-wrap"><input type="text" id="sgCx" maxlength="120" style="padding-right:46px" placeholder="例：1人でやる・まだ何も決めていない">'+
      '<button class="sh-mic" id="sgMic" style="top:5px;bottom:auto">'+MICSVG+'</button></div></div>'+
    '<div id="sgOut"></div>'+
    '<div class="sh-btns" id="sgBtns"></div>'+
    '<div class="sh-note" style="text-align:left">AIが5〜15分の手順に分ける。日付は付けない。'+
      (undone.length?'<br>いまの「まだ」の手順 '+undone.length+'個は、新しい手順に入れ替わる（やった分は残る）':'')+
      '<br>AIの案なので、手続きの正しさは公式の案内か専門家で最後に確かめてくれ</div>';
  $('sgCx').value=a.cx||'';
  $('sgMic').onclick=()=>micToggle($('sgMic'),$('sgCx'));
  const btns=h=>{const b=$('sgBtns');if(b)b.innerHTML=h;};
  const idle=()=>{
    btns((draft?'<button class="delbtn" id="sgRe" style="background:#f1f3f8;color:#4a4f5e">🔁 作り直す</button><button class="savebtn" id="sgUse" style="letter-spacing:.06em">✓ これで始める</button>'
               :'<button class="savebtn" id="sgGo" style="letter-spacing:.06em">🤖 AIに作らせる</button>'));
    const go=$('sgGo')||$('sgRe');if(go)go.onclick=run;
    const us=$('sgUse');if(us)us.onclick=use;
  };
  const show=()=>{const o=$('sgOut');if(!o)return;
    o.innerHTML=draft?('<ol class="sg-list">'+draft.map((t,i)=>'<li><b>'+(i+1)+'</b><span>'+esc(t)+'</span></li>').join('')+'</ol>'):'';};
  async function run(){
    if(AIB.busy)return;
    micStopAll();
    const cx=$('sgCx').value.replace(/\s+/g,' ').trim();
    const o=$('sgOut');if(o)o.innerHTML='<div class="sg-wait"><span class="pulse"></span>AIが考えている…（5〜60秒）</div>';
    btns('<button class="delbtn" id="sgStop" style="flex:1">■ 止める</button>');
    try{aiCtl=new AbortController();}catch(e){aiCtl=null;}
    const ctl=aiCtl;
    const st=$('sgStop');if(st)st.onclick=()=>{try{if(ctl)ctl.abort();}catch(e){}};
    try{
      const list=stepsFromAi(await aiAsk(aiGenPrompt(d,cx),'default',ctl?ctl.signal:null));
      if(!$('sgOut'))return;            /* 待っている間にシートが閉じられた */
      draft=list;show();idle();
    }catch(e){
      if(!$('sgOut'))return;
      const m=aiErrText(e&&e.code);
      show();idle();
      /* 理由は必ず見せる（前の案がある時は、その上に出す）。先に書くと show() に消される（2026-09-30レビュー指摘） */
      if(m)$('sgOut').insertAdjacentHTML('afterbegin','<div class="sg-wait" style="color:#e0405a">'+esc(m)+'</div>');
      if(e&&(e.code==='no_sample'||e.code==='not_granted')){
        btns('<button class="savebtn" id="sgSelf" style="letter-spacing:.06em">＋ 自分で1行書く</button>');
        $('sgSelf').onclick=()=>openStepEdit(dr,null);
      }
    }finally{if(aiCtl===ctl)aiCtl=null;}
  }
  function use(){
    if(!draft||!draft.length)return;
    const cx=$('sgCx').value.replace(/\s+/g,' ').trim();
    const cur=stepsOf(dr),mx=cur.reduce((m,x)=>Math.max(m,Number(x.o)||0),0);
    mutate(()=>{
      state.steps=state.steps||{};
      cur.filter(x=>!x.d).forEach(x=>{state.steps[x.id]=Object.assign({},state.steps[x.id],{del:1,ts:Date.now()});});
      draft.forEach((t,i)=>{state.steps[stepNewId(i)]={dr:dr,t:t,o:mx+1+i,d:0,c:Date.now()+i,by:'ai',ts:Date.now()};});
      state.aims=state.aims||{};state.aims[dr]=Object.assign({},state.aims[dr]||{},{cx:cx,ts:Date.now()});
    });
    aimListOpen[dr]=true;
    closeSheet();
    if($('page').classList.contains('open')&&pageMode==='aim')renderAimPage();
    toast('🎯 '+draft.length+'個の手順が出来た。1個目からでいい');
  }
  idle();
  openOvl();
}

/* ミニカレンダー：🟡日記あり・🔵Gカレ予定あり。年タップで年間ビュー */
function openCalSheet(){
  let vm=ui.date.slice(0,7);
  let yearMode=false;
  async function fetchG(ym){
    if(!GCAL.mcp||GCAL.status==='absent'||GCAL.status==='reauth')return;
    GCAL.mcache=GCAL.mcache||{};
    const c=GCAL.mcache[ym];
    if(c&&(c.loading||(c.ok&&Date.now()-c.at<300000)))return;
    GCAL.mcache[ym]={loading:1};
    const y=Number(ym.slice(0,4)),m=Number(ym.slice(5,7));
    const dim=new Date(y,m,0).getDate();
    try{
      const r=await GCAL.mcp.callTool(GCAL.server,'list_events',
        {startTime:ym+'-01T00:00:00+09:00',endTime:ym+'-'+pad(dim)+'T23:59:59+09:00',orderBy:'startTime',pageSize:250});
      const evs=(((r&&r.payload)||{}).events||[]).filter(e=>e.status!=='cancelled');
      const days={};
      for(const ev of evs){
        const s=(ev.start&&(ev.start.dateTime||ev.start.date))||'';
        const key=String(s).slice(0,10);
        if(key)days[key]=(days[key]||0)+1;
      }
      GCAL.mcache[ym]={ok:1,days,at:Date.now()};
    }catch(e){GCAL.mcache[ym]={ok:0,at:Date.now()};}
    if(!yearMode&&vm===ym&&$('calDays'))draw();
  }
  function draw(){
    yearMode=false;
    const y=Number(vm.slice(0,4)),m=Number(vm.slice(5,7));
    const startDow=new Date(y,m-1,1).getDay();
    const dim=new Date(y,m,0).getDate();
    const gc=(GCAL.mcache&&GCAL.mcache[vm]&&GCAL.mcache[vm].days)||{};
    let cells='';
    for(let i=0;i<startDow;i++)cells+='<span></span>';
    for(let dd=1;dd<=dim;dd++){
      const ds=y+'-'+pad(m)+'-'+pad(dd);
      const has=Object.keys(entriesOf(ds)).length>0;
      cells+='<button data-cd="'+ds+'" class="'+(ds===ui.date?'sel':'')+(ds===todayStr()?' tdy':'')+'">'+dd+
        (has?'<i></i>':'')+(gc[ds]?'<i class="g"></i>':'')+'</button>';
    }
    $('sheet').innerHTML='<div class="grab"></div>'+
      '<div class="sh-time"><button id="cmPrev">‹</button><span><button id="cmYear" style="font-weight:800;font-size:19px">'+y+'年</button>'+m+'月</span><button id="cmNext">›</button></div>'+
      '<div class="calgrid caldow">'+YOBI.map((w,i)=>'<span class="'+(i===0?'sun':i===6?'sat':'')+'">'+w+'</span>').join('')+'</div>'+
      '<div class="calgrid" id="calDays">'+cells+'</div>'+
      '<div class="sh-note" style="text-align:left">🟡 日記あり　🔵 Gカレ予定あり　「'+y+'年」タップで年間表示</div>'+
      '<button class="bkbtn" id="cmToday">今日へ</button>';
    $('cmPrev').onclick=()=>{const d2=new Date(y,m-2,1);vm=d2.getFullYear()+'-'+pad(d2.getMonth()+1);draw();};
    $('cmNext').onclick=()=>{const d2=new Date(y,m,1);vm=d2.getFullYear()+'-'+pad(d2.getMonth()+1);draw();};
    $('cmYear').onclick=drawYear;
    $('cmToday').onclick=()=>{ui.date=todayStr();closeSheet();render();scrollToNow();};
    $('calDays').querySelectorAll('[data-cd]').forEach(b=>b.onclick=()=>{ui.date=b.dataset.cd;closeSheet();render();});
    fetchG(vm);
  }
  function drawYear(){
    yearMode=true;
    const y=Number(vm.slice(0,4));
    const curYm=todayStr().slice(0,7);
    const rows=Array.from({length:12},(_,i)=>{
      const ym=y+'-'+pad(i+1);
      return '<button data-ym="'+ym+'"'+(ym===curYm?' class="cur"':'')+'>'+(i+1)+'月</button>';
    }).join('');
    $('sheet').innerHTML='<div class="grab"></div>'+
      '<div class="sh-time"><button id="cyPrev">‹</button><span>'+y+'年</span><button id="cyNext">›</button></div>'+
      '<div class="yeargrid">'+rows+'</div>'+
      '<div class="sh-note">月をタップすると月間カレンダー（🟡日記・🔵Gカレつき）</div>';
    $('cyPrev').onclick=()=>{vm=(y-1)+vm.slice(4);drawYear();};
    $('cyNext').onclick=()=>{vm=(y+1)+vm.slice(4);drawYear();};
    document.querySelectorAll('[data-ym]').forEach(b=>b.onclick=()=>{vm=b.dataset.ym;draw();});
  }
  draw();openOvl();
}

      {const ks=Object.keys(v);if(ks.length>1)ks.sort();clHc(65544);
        for(let i=0;i<ks.length;i++){const x=v[ks[i]],t=typeof x;if(x===undefined||t==='function'||t==='symbol')continue;clHs(ks[i]);clHc(65545);clHv(x);}

function clHashOf(ts,d){

  const h1=Math.imul(CL_H1^(CL_H1>>>16),2246822507)^Math.imul(CL_H2^(CL_H2>>>13),3266489909);

const CL_SIGC=new WeakMap();   /* 項目オブジェクト→{ts,署名}。ts が同じなら計算し直さない（保存のたびに軽く） */
function clSigOf(it,fresh){
  const d=it.data,ts=clTsOf(it.ts);
  if(!fresh&&d&&typeof d==='object'){const c=CL_SIGC.get(d);if(c&&c.ts===ts&&c.g===CL.sigGen)return c.h;}   /* 世代（保存のたびに進む）が同じ時だけ使い回す＝ts を進めないその場の書き換えも拾う */
  const h=clHashOf(ts,d);

}
function clSig(it){return clSigOf(it,true);}   /* 旧版と同じ名前 */
function clCleanDeep(v){if(typeof v==='string')return clClean(v);if(!v||typeof v!=='object')return v;if(Array.isArray(v))return v.map(clCleanDeep);const o={};for(const k in v)o[clClean(k)]=clCleanDeep(v[k]);return o;}
function clHasNul(v){if(typeof v==='string')return v.indexOf('\u0000')>=0;if(!v||typeof v!=='object')return false;if(Array.isArray(v)){for(const x of v)if(clHasNul(x))return true;return false;}for(const k in v){if(k.indexOf('\u0000')>=0||clHasNul(v[k]))return true;}return false;}
/* 送る1行（端末の state は触らず、送る分だけ掃除する） */
function clRowOf(it){return {coll:clClean(String(it.coll)),k:clClean(String(it.k)),ts:clTsOf(it.ts),data:clHasNul(it.data)?clCleanDeep(it.data):it.data};}
const CL_KNOWN_TOP={updatedAt:1,dream:1,entries:1,plans:1,ai:1,dreams:1,memos:1,life:1,photos:1,pha:1,pays:1,rules:1,aims:1,moves:1,pins:1,steps:1,payrep:1,rtn:1,rlog:1,payppl:1,kinds:1,tools:1};
const CL_COLLS=new Set(CL_ID.concat(CL_DAY,CL_DAY2,['_top']));
/* 受け取った行が state に入る形か（clItems の逆と同じ条件）。入らない行は影にも入れない＝件数の比べ合いで迷わない */
function clRowUsable(r){
  const c=r.coll,d=r.data;
  if(CL_DAY2.indexOf(c)>=0)return String(r.k).indexOf('/')>0&&!!d&&typeof d==='object';
  if(c==='pha')return !!(d&&d.a);
  if(CL_DAY.indexOf(c)>=0||CL_ID.indexOf(c)>=0)return !!d&&typeof d==='object';
  if(c==='_top'){if(CL_SKIP[r.k]||CL_DAY2.indexOf(r.k)>=0||CL_DAY.indexOf(r.k)>=0||CL_ID.indexOf(r.k)>=0)return false;
    const v=(d&&typeof d==='object'&&'v' in d&&Object.keys(d).length===1)?d.v:d;return v!=null;}
  return false;
}
/* 鍵から端末の1項目（clItems と同じ形）を取る */
function clItemByKey(key){
  const i=key.indexOf('\u0000');if(i<0)return null;const c=key.slice(0,i),k=key.slice(i+1);
  if(CL_DAY2.indexOf(c)>=0){const j=k.indexOf('/');if(j<0)return null;const v=state[c]&&state[c][k.slice(0,j)]&&state[c][k.slice(0,j)][k.slice(j+1)];return (v&&typeof v==='object')?{coll:c,k,ts:Number(v.ts)||0,data:v}:null;}
  if(CL_DAY.indexOf(c)>=0){const v=state[c]&&state[c][k];return (v&&typeof v==='object')?{coll:c,k,ts:Number(v.ts)||0,data:v}:null;}
  if(c==='pha'){const v=state.pha&&state.pha[k];return v!=null?{coll:c,k,ts:1,data:{a:v}}:null;}
  if(CL_ID.indexOf(c)>=0){const v=state[c]&&state[c][k];return (v&&typeof v==='object')?{coll:c,k,ts:Number(v.ts)||0,data:v}:null;}
  if(c==='_top'){if(CL_SKIP[k]||!CL_COLLS.has(c))return null;const v=state[k];if(v==null||CL_DAY2.indexOf(k)>=0||CL_DAY.indexOf(k)>=0||CL_ID.indexOf(k)>=0)return null;
    return {coll:c,k,ts:(typeof v==='object'&&Number(v.ts))||0,data:(typeof v==='object')?v:{v}};}

}
function clLocalRef(c,k){
  if(CL_DAY2.indexOf(c)>=0){const j=String(k).indexOf('/');const d=state[c]&&state[c][k.slice(0,j)];return d?d[k.slice(j+1)]:undefined;}
  if(c==='_top')return state[k];

/* ---------- 未送信（dirty）＝影との差 ----------
   影（CL.shadow）＝「クラウドが持っていると分かっている中身」の署名。影が無い間（作成中）は、
   この起動で書いた項目（hot）だけを送る。dirty はメモリだけ（毎回計算し直すので、消えても次の起動で見つかる） */
function clItemSkip(it,k,h){
  const b=CL.bad[k];if(b&&b.h===h)return true;   /* 送れない行として隔離中（中身が変われば外れる） */
  /* ts の無い設定値（pha・_cfg など）は、クラウドに既にあるなら送らない＝2台で上書きし合わない */
  if(clTsOf(it.ts)<=1&&CL.shadow[k]!==undefined&&it.coll!=='pays'&&it.coll!=='steps')return true;
  return false;
}
function clIsDirty(it,k,h){return (CL.shadowOk||!!CL.hot[k])&&CL.shadow[k]!==h&&!clItemSkip(it,k,h);}
/* 全項目を比べ直す（起動時・受信後）。fresh＝署名を全部計算し直す */
function clRecomputeDirty(fresh){
  const t0=Date.now(),nd={};
  for(const it of clItems(state)){const k=clKey(it),h=clSigOf(it,!!fresh);CL.curSig[k]=h;if(clIsDirty(it,k,h))nd[k]=1;}
  CL.dirty=nd;CL.perf.recompute=Date.now()-t0;clSaveSync();
}
/* 一部の鍵だけ比べ直す（送信が通った後） */
function clRecomputeKeys(keys){
  for(const k of keys){const it=clItemByKey(k);if(!it){delete CL.dirty[k];continue;}const h=clSigOf(it,false);if(clIsDirty(it,k,h))CL.dirty[k]=1;else delete CL.dirty[k];}
}
/* 保存のたび：変わった項目を hot に入れ、dirty を作り直す（署名は前回と同じ物を使い回すので軽い） */
function clMarkDirty(){
  if(!CL.trackHot)return 0;
  CL.mutSeq++;
  const t0=Date.now(),now=Date.now(),nd={};let n=0;
  for(const it of clItems(state)){const k=clKey(it),h=clSigOf(it,false);
    if(CL.curSig[k]!==h){CL.curSig[k]=h;CL.hot[k]=now;}
    if(CL.ready&&clIsDirty(it,k,h)){nd[k]=1;n++;}}
  if(CL.ready){CL.dirty=nd;clSaveSync();}
  CL.perf.mark=Date.now()-t0;
  if(typeof localSaveFail!=='undefined'&&localSaveFail)clOutbox();
  return n;
}
function clDirtyCount(){return Object.keys(CL.dirty).length;}
/* 起動時：全項目の署名（以後の保存で「何が変わったか」を見るための基準） */
function clBaseSigs(){const t0=Date.now();for(const it of clItems(state))CL.curSig[clKey(it)]=clSigOf(it,true);CL.perf.baseSigs=Date.now()-t0;}

/* 端末の本文が保存できない時（容量不足）だけ、書いた項目の中身を IndexedDB に退避する。次の起動で戻して送る */
function clOutbox(){
  if(!CL.uid||Date.now()-CL.outboxAt<2000)return;CL.outboxAt=Date.now();
  const rows={};for(const k in CL.hot){const it=clItemByKey(k);if(it)rows[k]=clRowOf(it);}
  if(!Object.keys(rows).length)return;
  clStore.upd('outbox:'+CL.uid,cur=>{const o=(cur&&cur.rows)||{};Object.assign(o,rows);return {rows:o,at:Date.now()};});
  clNote('outbox','端末保存に失敗中：'+Object.keys(rows).length+'件を退避');
}
async function clOutboxRestore(){
  if(!CL.uid)return;
  const ob=await clStore.get('outbox:'+CL.uid);if(!ob||!ob.rows)return;
  const rows=Object.values(ob.rows).filter(r=>r&&r.coll&&clRowUsable(r));if(!rows.length)return;
  state=mergeStates(state,clRowsToState(rows));
  for(const r of rows)CL.hot[clKey(r)]=Date.now();
  CL.outboxKeys=Object.keys(ob.rows);
  clNote('outbox','退避した '+rows.length+'件を戻した');
}
function clOutboxPrune(){
  if(!CL.outboxKeys||!CL.outboxKeys.length||!CL.uid)return;
  const left=CL.outboxKeys.filter(k=>CL.dirty[k]||CL.hot[k]);
  if(left.length===CL.outboxKeys.length)return;
  const keep=new Set(left);CL.outboxKeys=left;
  clStore.upd('outbox:'+CL.uid,cur=>{const o={};for(const k in ((cur&&cur.rows)||{}))if(keep.has(k))o[k]=cur.rows[k];return {rows:o,at:Date.now()};});
}

/* ---------- 影の保存（IndexedDB）と読み込み ---------- */
async function clLoadShadow(uid){
  CL.uid=uid;CL.shadowFor=uid;CL.shadow={};CL.seq=0;CL.shadowOk=false;CL.full=null;CL.pushedDuring={};CL.bad={};
  const rec=await clStore.get('shadow:'+uid);
  if(rec&&rec.ver===CL_SHVER&&rec.uid===uid&&rec.map&&typeof rec.map==='object'&&Number(rec.seq)>0){CL.shadow=rec.map;CL.seq=Number(rec.seq);CL.shadowOk=true;}
  CL.shadowLoadedAt=Date.now();
  if(CL.shadowOk){
    /* 影にあって端末に無い項目＝受信した中身を本文に保存できなかった → 全件受信で取り直す */
    const have=new Set();for(const it of clItems(state))have.add(clKey(it));
    let miss=0;for(const k in CL.shadow){if(!have.has(k)&&CL_COLLS.has(k.slice(0,k.indexOf('\u0000'))))miss++;}
    if(miss){clNote('shadow','影にあって端末に無い '+miss+'件 → 全件受信で取り直す');CL.full={since:0,nsh:{},rebuild:true};}
  }
  clSaveSync();
}
function clPersistSoon(){clearTimeout(CL.persistT);CL.persistT=setTimeout(()=>{clPersist();},2000);}
async function clPersist(){
  if(!CL.uid||!CL.shadowOk||CL.seq<=0)return false;
  if(typeof localSaveFail!=='undefined'&&localSaveFail){   /* 本文が置けていない＝受信位置を進めて保存すると、その行を二度と取りに来ない */
    if(!CL.persistWarned){CL.persistWarned=1;clNote('shadow','端末保存に失敗中のため、影と受信位置は保存しない');}return false;}
  CL.persistWarned=0;
  const uid=CL.uid,map=CL.shadow,seq=CL.seq,loaded=CL.shadowLoadedAt,me=CL.tabId;
  return clStore.upd('shadow:'+uid,cur=>{
    let m=map,s=seq;
    /* 別タブが後から書いていた：両方で一致する所だけ残す（影は「クラウドにある」と確かな物だけ＝足りない分は送り直すだけで安全） */
    if(cur&&cur.ver===CL_SHVER&&cur.writer&&cur.writer!==me&&(cur.savedAt||0)>loaded&&cur.map){m={};for(const k in map)if(cur.map[k]===map[k])m[k]=map[k];s=Math.min(seq,Number(cur.seq)||0);}
    return {ver:CL_SHVER,uid,seq:s,map:m,writer:me,savedAt:Date.now()};
  });
}

/* ---------- 送信 ---------- */
function clApplyPushed(keys,hs){
  keys.forEach((k,j)=>{CL.shadow[k]=hs[j];if(CL.full)CL.pushedDuring[k]=hs[j];if(CL.hot[k]&&CL.curSig[k]===hs[j])delete CL.hot[k];});
  clRecomputeKeys(keys);clSaveSync();clPersistSoon();clOutboxPrune();
}
/* 1束を送る。行の形が悪くて拒否されたら半分ずつに割って犯人の行だけ隔離し、残りは流す */
async function clPutSafe(part,rs,hs,ep,sig){
  let n;
  try{n=await clRpcJson('put_items','{"rows":['+rs.join(',')+']}',sig);}
  catch(e){
    if(e.kind!=='row')throw e;
    if(ep!==CLQ.epoch)return false;
    if(part.length===1){const k=clKey(part[0]);CL.bad[k]={h:hs[0],msg:e.message,at:Date.now()};delete CL.dirty[k];
      clNote('quarantine','送れない行：'+k.replace('\u0000','/')+'（'+e.message+'）');return 0;}
    const m=part.length>>1;
    const a=await clPutSafe(part.slice(0,m),rs.slice(0,m),hs.slice(0,m),ep,sig);if(a===false)return false;
    const b=await clPutSafe(part.slice(m),rs.slice(m),hs.slice(m),ep,sig);if(b===false)return false;
    return a+b;
  }
  if(ep!==CLQ.epoch)return false;
  clApplyPushed(part.map(clKey),hs);
  return Number(n)||0;
}
async function clPushStep(ep,sig){
  const keys=Object.keys(CL.dirty);if(!keys.length)return 0;
  const want=new Set(keys),items=[];
  for(const it of clItems(state)){if(want.has(clKey(it)))items.push(it);}
  items.sort((a,b)=>(CL.hot[clKey(b)]||0)-(CL.hot[clKey(a)]||0));   /* いま書いた物から先に */
  let i=0,sent=0,wrote=0,shrink=0;
  while(i<items.length){
    /* 束：件数 chunkN 以内・本文 chunkBytes 以内。本文と署名はここで同時に確定（送信中の編集は次の回で送る） */
    const part=[],rs=[],hs=[];let bytes=0;
    while(i+part.length<items.length&&part.length<CL.chunkN){
      const it=items[i+part.length],s=JSON.stringify(clRowOf(it));
      if(part.length&&bytes+s.length>CL.chunkBytes)break;
      part.push(it);rs.push(s);hs.push(clSigOf(it,true));bytes+=s.length;}
    let n;
    try{n=await clPutSafe(part,rs,hs,ep,sig);}
    catch(e){
      if(e.kind==='timeout'&&part.length>25&&shrink<2&&ep===CLQ.epoch){shrink++;CL.chunkN=Math.max(25,part.length>>1);CL.chunkBytes=Math.max(30000,CL.chunkBytes>>1);
        clNote('push','時間切れ → 束を '+CL.chunkN+' 件に縮めて再挑戦');continue;}
      throw e;}
    if(n===false)return false;
    i+=part.length;sent+=part.length;wrote+=n;CLQ.beat=Date.now();
  }
  if(!shrink){CL.chunkN=Math.min(400,CL.chunkN*2);CL.chunkBytes=Math.min(200000,CL.chunkBytes*2);}
  CL.lastPush=Date.now();
  clNote('push','送信 '+sent+'件（新しく書いた '+wrote+'件）');
  return sent;
}

/* ---------- 受信 ---------- */
/* 受け取った行を影に入れて state へ合流。端末の中身が変わったかを返す（JSON.stringify(state) の前後比較はしない） */
function clMergeRows(rows,full){
  const tgt=full?CL.full.nsh:CL.shadow,use=[];
  for(const r of rows){if(!r||!r.coll||!clRowUsable(r))continue;tgt[clKey(r)]=clSigOf({ts:r.ts,data:r.data},true);use.push(r);}
  if(!use.length)return false;
  const part=clRowsToState(use);
  const refs=use.map(r=>clLocalRef(r.coll,r.k));
  state=mergeStates(state,part);
  /* mergeStates が知らない上位項目（_cfg など）は「端末が常に勝つ」ので、ts で新しい方を採る */
  const tsOf=v=>(v&&typeof v==='object')?(Number(v.ts)||0):0;
  for(const k in part){if(CL_KNOWN_TOP[k])continue;const c=part[k],l=state[k];if(l===undefined||tsOf(c)>tsOf(l))state[k]=c;}
  let changed=false,tie=0;
  use.forEach((r,i)=>{
    const now=clLocalRef(r.coll,r.k);if(now!==refs[i])changed=true;
    /* 同じ ts で中身が違う（払った印などの合流が要る pays・steps 以外）＝送り合いにしない。端末の中身を影とみなす */
    if(r.coll!=='pays'&&r.coll!=='steps'){const k=clKey(r),it=clItemByKey(k);
      if(it&&clTsOf(it.ts)===clTsOf(r.ts)){const h=clSigOf(it,false);if(h!==tgt[k]){tgt[k]=h;tie++;}}}
  });
  if(tie)CL.tieN=(CL.tieN||0)+tie;
  return changed;
}
async function clPullStep(ep,sig,ms){
  const full=!!CL.full;let since=full?CL.full.since:CL.seq,changed=false,got=0,guard=0;
  while(guard++<1000){
    let rows;
    try{rows=await clRpcJson('pull_items',{since_seq:since,lim:CL.pullLim},sig,ms);}
    catch(e){if(e.kind==='timeout'&&CL.pullLim>100)CL.pullLim=Math.max(100,CL.pullLim>>1);throw e;}   /* 時間切れ＝次は小さく取る */
    if(ep!==CLQ.epoch)return false;
    if(!Array.isArray(rows))throw clErr('受信の形が違う',0,'parse','server');
    if(!rows.length)break;   /* 0件が返るまで回す（返った件数 < lim で終わりと決めない） */
    CLQ.beat=Date.now();
    if(clMergeRows(rows,full))changed=true;
    for(const r of rows){const s=Number(r&&r.seq)||0;if(s>since)since=s;}
    if(full)CL.full.since=since;else CL.seq=Math.max(CL.seq,since);
    got+=rows.length;
  }
  let fullDone=false;
  if(full){   /* 最後まで読めた時だけ影を差し替える（途中で失敗したら続きから） */
    CL.shadow=Object.assign(CL.full.nsh,CL.pushedDuring);CL.pushedDuring={};CL.seq=Math.max(CL.seq,since);
    const rb=CL.full.rebuild;CL.full=null;CL.shadowOk=true;fullDone=true;
    clNote('pull','全件受信 完了 '+got+'件'+(rb?'（照合し直し）':''));
  }else if(got)clNote('pull','受信 '+got+'件');
  CL.lastPull=Date.now();
  if(CL.kaCheck)clKaVerify();
  if(changed){try{cfgApply();}catch(e){}}
  clRecomputeDirty(fullDone);
  if(changed){
    CL.quietSave=true;
    try{saveLocal(clDirtyCount()===0);}catch(e){clNote('save','端末保存で例外：'+e.message);}finally{CL.quietSave=false;}
    try{render();}catch(e){clNote('render','描画で例外：'+e.message);}
  }else{try{renderSync();}catch(e){}}
  clPersistSoon();
  if(!CL.firstPull&&CL.shadowOk){CL.firstPull=true;try{afterCloudReady();}catch(e){clNote('ready','起動後の修復で例外：'+e.message);}}
  return {got,fullDone};
}

/* 前回の離脱時の keepalive が届いていたかを、起動後の最初の受信で確かめて記録に残す（iPhone 実機で効いているかの実測） */
function clKaVerify(){
  const ka=CL.kaCheck;CL.kaCheck=null;try{localStorage.removeItem(CL_KA);}catch(e){}
  const ks=Array.isArray(ka.keys)?ka.keys:[];if(!ks.length)return;
  let got=0;for(const k of ks){const it=clItemByKey(k);const tgt=CL.full?CL.full.nsh:CL.shadow;if(it&&tgt[k]===clSigOf(it,true))got++;}
  clNote('keepalive','前回の離脱時の kA '+ka.n+'件 → クラウドに届いていた '+got+'/'+ks.length+'件');
}
/* ---------- 整合の点検（件数と ts の合計を、クラウドと端末で比べる） ---------- */
async function clIntegrity(ep,sig){
  if(clDirtyCount()>0||CL.full)return 'skip';
  const mut=CL.mutSeq;
  const txt=await clRpcText('integrity','{}',sig);
  if(ep!==CLQ.epoch)return 'skip';
  if(CL.mutSeq!==mut||clDirtyCount()>0)return 'skip';   /* 比べている間に書いた＝今回は比べない */
  /* tsum は 2^53 を超える＝文字列のまま BigInt で読む */
  const srv={};for(const m of String(txt).match(/\{[^{}]*\}/g)||[]){const c=/"coll"\s*:\s*"((?:[^"\\]|\\.)*)"/.exec(m),n=/"n"\s*:\s*(\d+)/.exec(m),t=/"tsum"\s*:\s*(-?\d+)/.exec(m);
    if(c&&n&&t){let name;try{name=JSON.parse('"'+c[1]+'"');}catch(e){name=c[1];}srv[name]={n:Number(n[1]),t:BigInt(t[1])};}}
  const lim=Date.now()+3600000,loc={};
  for(const it of clItems(state)){const k=clKey(it);if(CL.bad[k])continue;const c=loc[it.coll]||(loc[it.coll]={n:0,t:0n});c.n++;c.t+=BigInt(Math.min(clTsOf(it.ts),lim));}
  const bad=[];
  for(const c of new Set(Object.keys(srv).concat(Object.keys(loc)))){if(!CL_COLLS.has(c))continue;const a=srv[c]||{n:0,t:0n},b=loc[c]||{n:0,t:0n};
    if(a.n!==b.n||a.t!==b.t)bad.push(c+'(雲'+a.n+'/端'+b.n+')');}
  CL.integ.at=Date.now();CL.integ.due=false;
  if(!bad.length){CL.integ.res='OK';CL.integ.sig='';CL.integ.pend='';clNote('integrity','整合 OK');return 'ok';}
  const s=bad.join(' ');
  if(CL.integ.sig===s){CL.integ.res='NG（保留）'+s;return 'hold';}
  if(CL.integ.pend===s){CL.integ.sig=s;CL.integ.res='NG（保留）'+s;clNote('integrity','照合し直しても一致しない：'+s+'（同じ食い違いの間は再実行しない）');return 'hold';}
  if(Date.now()-CL.integ.rebuildAt<600000){CL.integ.res='NG（10分待ち）'+s;clNote('integrity','整合NG（保留・10分に1回まで）：'+s);return 'wait';}
  CL.integ.rebuildAt=Date.now();CL.integ.pend=s;CL.integ.res='NG → 照合し直し';CL.integ.due=true;
  clNote('integrity','整合NG：'+s+' → 全件受信で照合し直し');
  CL.full={since:0,nsh:{},rebuild:true};
  return 'rebuild';
}
function clIntegDue(){
  if(typeof document!=='undefined'&&document.hidden)return false;
  return CL.integ.due||(Date.now()-CL.integ.at>600000);
}

/* ---------- 同期の1周：[全件受信が要るなら先にいま書いた物を送る] → 受信 → 送信 → 整合 ---------- */
async function clOnce(ep,sig){
  CL.lastTry=Date.now();
  if(!CL.shadowOk&&!CL.full)CL.full={since:0,nsh:{}};
  if(CL.full){
    /* 影を作る全件受信の前に、いま書いた物（影が無い時は hot だけ）を送る＝受信の成否に関係なく届く */
    if(clDirtyCount()){const r=await clPushStep(ep,sig);if(r===false)return false;}
    const p=await clPullStep(ep,sig);if(p===false)return false;
    if(clDirtyCount()){const r=await clPushStep(ep,sig);if(r===false)return false;}
  }else{
    const dirty=clDirtyCount()>0;
    let pre=false;
    if(dirty&&CL.seq>0){   /* 先に増分を軽く受信（払った印などを合流してから送る）。遅い・失敗しても送信は止めない */
      try{const p=await clPullStep(ep,sig,CL.T.pre);if(p===false)return false;pre=true;}
      catch(e){if(ep!==CLQ.epoch)return false;clNote('pull','先読み失敗（'+e.message+'）→ 送信を先に');}}
    if(clDirtyCount()){const r=await clPushStep(ep,sig);if(r===false)return false;}
    if(!pre){const p=await clPullStep(ep,sig);if(p===false)return false;}
  }
  if(ep!==CLQ.epoch)return false;
  if(clIntegDue()&&!clDirtyCount()){
    try{const r=await clIntegrity(ep,sig);if(r==='rebuild')CLQ.again=true;}
    catch(e){if(ep!==CLQ.epoch)return false;clNote('integrity','整合の確認に失敗（'+e.message+'）');}
  }
  return true;
}
/* 同期の入口（これ1本）。実行中なら「もう1周」の印を立てて、その回の結果を待つ */
function cloudSync(force){
  if(!cloudConfigured()||!cloudLoggedIn()||!CL.ready)return Promise.resolve(false);
  if(force){CLQ.fails=0;CL.authDead=false;}
  if(CL.authDead){const w=60000-(Date.now()-(CL.authDeadAt||0));if(w>0){clKick(w);return Promise.resolve(false);}CL.authDead=false;CL.auth401=0;clNote('auth','1分たったので同期をもう一度試す');}   /* 401 が続いても1分後に必ず再開（止まりっぱなしにしない） */
  if(typeof document!=='undefined'&&document.hidden){CLQ.wake=true;clKeepalive('隠れている間');return Promise.resolve(false);}   /* 隠れている間は始めない（止められて宙に浮くだけ） */
  if(CLQ.run){CLQ.again=true;return CLQ.run;}
  clearTimeout(CLQ.t);CLQ.t=null;CLQ.due=0;
  const ep=++CLQ.epoch,ctl=CLQ.ctl=new AbortController(),sig=ctl.signal;
  CLQ.beat=Date.now();CLQ.startedAt=Date.now();
  const dead=new Promise(r=>sig.addEventListener('abort',()=>r('abort')));
  CLQ.run=(async()=>{
    let ok=false,err=null;
    try{renderSync();}catch(e){}
    try{
      do{CLQ.again=false;const r=await Promise.race([clOnce(ep,sig),dead]);
        if(r==='abort'){err=clErr('中断（見張り・復帰）',0,'aborted','aborted');ok=false;break;}
        ok=(r===true);
      }while(ok&&CLQ.again&&ep===CLQ.epoch);
    }catch(e){ok=false;err=e;}
    finally{if(CLQ.ctl===ctl){CLQ.run=null;CLQ.ctl=null;}}
    if(ep!==CLQ.epoch)return false;   /* 打ち切られた古い回：結果を使わない（打ち切った側がやり直しを予約済み） */
    if(ok)clOk();else clFail(err);
    return ok;
  })();
  return CLQ.run;
}
/* 動いている回を打ち切る（見張り・画面復帰・ログイン） */
function clAbortRun(){
  CLQ.epoch++;const c=CLQ.ctl;CLQ.run=null;CLQ.ctl=null;
  try{if(c)c.abort();}catch(e){}
}
function clOk(){
  if(CLQ.fails)clNote('sync','再送で通った');
  CLQ.fails=0;CLQ.firstFailAt=0;CL.retryAt=0;CL.lastErr='';CL.err='';
  try{renderSync();}catch(e){}
}
function clFail(e){
  const msg=String((e&&e.message)||'同期失敗').slice(0,80);
  CL.lastErr=msg;CL.err=msg;
  clNote((e&&e.kind)==='timeout'?'timeout':'sync','失敗：'+msg);
  if(!cloudLoggedIn()){try{renderSync();}catch(x){}return;}
  if(CL.authDead){clKick(60000);try{renderSync();}catch(x){}return;}   /* 401 続き：1分後にもう一度（叩き続けない・止まりもしない） */
  clRetry();
  try{renderSync();}catch(x){}
}
/* 再挑戦：5秒→10→20→40→最大120秒（ゆらぎ付き）。成功で戻る */
function clRetry(){
  CLQ.fails++;if(!CLQ.firstFailAt)CLQ.firstFailAt=Date.now();
  const ms=Math.round(Math.min(120000,CL.retryMs*Math.pow(2,CLQ.fails-1))*(0.8+Math.random()*0.4));
  CL.retryAt=Date.now()+ms;
  clNote('retry',Math.round(ms/1000)+'秒後に再送（'+CLQ.fails+'回目）');
  clearTimeout(CLQ.t);CLQ.t=null;CLQ.due=0;clKick(ms);
}
/* 予約タイマーは1本だけ（早い方が勝つ）。隠れている時に来たら、戻った時に起こす */
function clKick(ms){
  if(!cloudConfigured()||!cloudLoggedIn())return;
  ms=Math.max(0,Number(ms)||0);const at=Date.now()+ms;
  if(CLQ.t&&CLQ.due<=at)return;
  clearTimeout(CLQ.t);CLQ.due=at;
  CLQ.t=setTimeout(()=>{CLQ.t=null;CLQ.due=0;if(typeof document!=='undefined'&&document.hidden){CLQ.wake=true;return;}cloudSync();},ms);
}
function scheduleSync(ms){clKick(ms||1500);}   /* 旧版と同じ名前 */

/* ---------- 画面を離れる瞬間の送信（keepalive。返事を待たない） ---------- */
function clBytes(s){try{return new TextEncoder().encode(s).length;}catch(e){return s.length*3;}}
function clKeepalive(why){
  try{
    if(!cloudConfigured()||!cloudLoggedIn()||!CL.ready||CL.authDead)return false;
    if(Date.now()-CL.kaAt<3000)return false;   /* hidden と pagehide の二重発火を間引く */
    if(CL.sess.expires_at&&Date.now()>CL.sess.expires_at-20000){clNote('keepalive','合言葉の期限が近いので送らない（次の起動で送る）');return false;}
    const keys=Object.keys(CL.dirty);if(!keys.length)return false;
    const want=new Set(keys),list=[];
    for(const it of clItems(state)){if(want.has(clKey(it)))list.push(it);}
    list.sort((a,b)=>((CL.hot[clKey(b)]||0)-(CL.hot[clKey(a)]||0))||(clTsOf(b.ts)-clTsOf(a.ts)));   /* いま書いた物・新しい物から */
    const rs=[],ks=[],hs=[];let size=12;
    for(const it of list){const s=JSON.stringify(clRowOf(it)),b=clBytes(s);if(b+12>CL_KA_MAX)continue;if(size+b+1>CL_KA_MAX)break;rs.push(s);ks.push(clKey(it));hs.push(clSigOf(it,true));size+=b+1;}
    if(!rs.length)return false;
    CL.kaAt=Date.now();
    clNote('keepalive','kA送信 '+rs.length+'件（'+why+'）');
    try{localStorage.setItem(CL_KA,JSON.stringify({n:rs.length,at:CL.kaAt,keys:ks.slice(0,50)}));}catch(e){}
    const h=clHdr();h['x-client-info']='hibiki-ka';
    fetch(CLOUD.url+'/rest/v1/rpc/put_items',{method:'POST',keepalive:true,headers:h,body:'{"rows":['+rs.join(',')+']}'})
      .then(r=>{if(r.ok){clApplyPushed(ks,hs);clPersist();try{renderSync();}catch(e){}clNote('keepalive','kA 届いた '+ks.length+'件');try{localStorage.removeItem(CL_KA);}catch(e){}}else clNote('keepalive','kA 失敗 HTTP '+r.status);})
      .catch(()=>{});
    return true;
  }catch(e){return false;}
}
function clOnHidden(){
  CL.hiddenAt=Date.now();
  if(CL.ready&&CL.persistT){clearTimeout(CL.persistT);CL.persistT=null;clPersist();}   /* 予約中の影の保存を今すぐ（凍結・終了の前に） */
  if(cloudLoggedIn()&&clDirtyCount())clKeepalive('離脱');
}
function clOnVisible(src){
  const hidFor=CL.hiddenAt?Date.now()-CL.hiddenAt:0;
  if(!cloudLoggedIn())return;
  /* 裏に回る前に始まった通信は iOS が殺している事がある＝待たずに打ち切ってやり直す（put_items は何度送っても同じ結果） */
  if(CLQ.run&&CLQ.startedAt<=CL.hiddenAt&&hidFor>=3000){clNote('resume','裏に回る前の通信を打ち切ってやり直す（'+src+'）');clAbortRun();}
  if(hidFor>3600000)CL.integ.due=true;
  CLQ.fails=0;CLQ.wake=false;
  clKick(300);
}

/* ---------- 旧版の関数を差し替え ---------- */
schedulePublish=function(ms){if(CLQ.fails>1)CLQ.fails=1;clKick(ms||1500);};   /* 旧版からの依頼も待たせない */
doPublish=function(force){
  if(typeof document!=='undefined'&&document.hidden){clKeepalive('離脱');return Promise.resolve(false);}   /* 離れた瞬間：keepalive だけ（受信は始めない） */
  if(force)return cloudSync(true);
  if(CLQ.fails)return Promise.resolve(false);
  return cloudSync();
};
/* 写真の置き場（旧版の assets 機能の代わり）。upload(blob)→{id} の形を合わせる */
function clNewAssetId(){const a=new Uint8Array(16);(window.crypto&&crypto.getRandomValues)?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.floor(Math.random()*256));return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join('');}
async function cloudPhotoUpload(blob){
  if(!cloudLoggedIn())throw Object.assign(new Error('not_logged_in'),{code:'not_granted'});
  await clEnsureFresh();
  const id=clNewAssetId(),path='/storage/v1/object/'+CLOUD.bucket+'/'+CL.sess.user.id+'/'+id;
  const r=await clTimed(CL.T.photo,s=>fetch(CLOUD.url+path,{method:'POST',headers:{'apikey':CLOUD.key,'Authorization':'Bearer '+CL.sess.access_token,'Content-Type':blob.type||'image/jpeg','x-upsert':'false'},body:blob,signal:s})
    .then(async x=>({ok:x.ok,status:x.status,text:x.ok?'':await x.text()})));
  if(!r.ok){let j=null;try{j=JSON.parse(r.text);}catch(e){}const e=new Error((j&&(j.message||j.error))||('HTTP '+r.status));e.code=(r.status===429)?'rate_limited':(r.status===401||r.status===403)?'not_granted':'ERR';throw e;}
  return {id};
}
async function cloudPhotoFetch(assetId){
  if(!cloudLoggedIn())return null;
  await clEnsureFresh();
  let b=null;
  try{b=await clTimed(CL.T.photo,s=>fetch(CLOUD.url+'/storage/v1/object/authenticated/'+CLOUD.bucket+'/'+CL.sess.user.id+'/'+assetId,{headers:{'apikey':CLOUD.key,'Authorization':'Bearer '+CL.sess.access_token},signal:s})
    .then(r=>r.ok?r.blob():null));}catch(e){return null;}
  if(!b||!b.size)return null;
  return await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result));fr.onerror=()=>res(null);fr.readAsDataURL(b);});
}
getAssets=async function(){return cloudLoggedIn()?{upload:cloudPhotoUpload}:null;};
verifyBlob=async function(url){
  /* 旧版は '/_blob/<id>' を画像として読めるか見ていた。クラウド版は保管番号を取り直して中身があるかを見る */
  const m=/^\/_blob\/(.+)$/.exec(String(url||''));
  if(!m)return false;
  const du=await cloudPhotoFetch(m[1]);
  return !!(du&&du.indexOf('data:image')===0);
};
/* 表示：保管番号だけある写真は、取りに行って端末に控える（取れるまでは薄い枠） */
const CL_BLANK='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
function cloudPhotoWant(id,assetId){
  if(PH.mem[id]||(state.photos&&state.photos[id]))return;
  if(CL.photoQ.some(x=>x.id===id))return;
  CL.photoQ.push({id,assetId});
  cloudPhotoDrain();
}
async function cloudPhotoDrain(){
  if(CL.photoBusy)return;CL.photoBusy=true;
  try{
    let shown=0;
    while(CL.photoQ.length){
      const {id,assetId}=CL.photoQ.shift();
      if(PH.mem[id])continue;
      let du=null;try{du=await cloudPhotoFetch(assetId);}catch(e){}
      if(du){PH.mem[id]=du;try{if(IDB.ok)idbPut(id,du);}catch(e){}shown++;}
      if(shown&&(CL.photoQ.length===0||shown%4===0)){try{render();}catch(e){}}
    }
  }finally{CL.photoBusy=false;}
}
phUrl=function(id){
  if(state.photos&&state.photos[id])return state.photos[id];
  if(PH.mem[id])return PH.mem[id];
  if(state.pha&&state.pha[id]){cloudPhotoWant(id,state.pha[id]);return CL_BLANK;}
  return CL_BLANK;
};
