<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>HIBIKI 日々記</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0bc167">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HIBIKI">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<style>
  /* 画面の大きさを固定する（本人指示 2026-10-02）。
     ①iPhoneは文字が16pxより小さい入力欄を押すと勝手に拡大する→入力欄は全部16px以上 ②2回タップの拡大を止める */
  html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  input,textarea,select{font-size:16px!important}
  :root{
    --out:#e9ebf1;
    --bg:#fafbfd;
    --card:#ffffff;
    --ink:#1a1c22;
    --sub:#8a90a0;
    --line:#edeff4;
    --green:#0bc167;
    --teal:#00d9a0;
    --pink:#ff6b81;
    --lemon:#fff3c9;
    --amber:#a8790a;
    --maru:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--out);
    font-family:var(--maru);
    display:flex;justify-content:center;
  }
  button,input,textarea{font-family:var(--maru);font-size:inherit;color:inherit}
  button{border:0;background:none;cursor:pointer}
  .app{
    width:100%;max-width:430px;height:100dvh;
    background:var(--bg);color:var(--ink);
    font-size:13.5px;line-height:1.6;font-weight:500;
    display:flex;flex-direction:column;overflow:hidden;
    position:relative;
  }
  @media (min-width:500px){
    body{align-items:center;padding:24px 0}
    .app{height:min(880px,calc(100dvh - 48px));border-radius:32px;box-shadow:0 24px 60px rgba(30,40,70,.18)}
  }

  /* ヘッダー */
  .top{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 16px 2px;flex-shrink:0;gap:6px;
  }
  .datebar{display:flex;align-items:center;gap:6px;min-width:0}
  .datebar .chev{color:#c3c8d4;font-size:20px;padding:2px 7px;border-radius:10px}
  .datebar .chev:active{background:#eef0f5}
  .datebar .d{font-weight:800;font-size:22px;letter-spacing:.01em;white-space:nowrap}
  .datebar .yobi{
    font-size:11px;font-weight:700;color:#fff;background:var(--sub);
    border-radius:8px;padding:2px 8px;flex-shrink:0;
  }
  .datebar .yobi.sun{background:var(--pink)}
  .datebar .yobi.sat{background:#4d7dff}
  .datebar .yr{color:var(--sub);font-size:11px;font-weight:700;line-height:1}
  .hb-brand{display:flex;flex-direction:column;align-items:flex-start;gap:3px;flex-shrink:0;margin-right:2px}
  .hb-brand .hb-logo{font-size:11px;color:#0a9a54}
  .datebar .chev{padding:2px 5px}
  .todaybtn{
    font-size:11px;font-weight:800;color:var(--green);background:#e7f9f0;
    border-radius:999px;padding:3px 10px;flex-shrink:0;
  }
  .right-top{display:flex;align-items:center;gap:7px;flex-shrink:0}
  .streak{
    font-size:12px;font-weight:800;color:var(--pink);
    background:#ffeef1;border-radius:999px;padding:3px 10px;
    font-variant-numeric:tabular-nums;white-space:nowrap;
    cursor:pointer;
  }
  .syncdot{
    width:11px;height:11px;border-radius:50%;background:#c3c8d4;flex-shrink:0;
    cursor:pointer;border:none;padding:0;
  }
  .syncdot.ok{background:var(--green)}
  .syncdot.pending{background:#ffb02e}
  .syncdot.bad{background:#ff5a5a}
  .diagstrip{
    margin:4px 16px 0;padding:4px 10px;border-radius:10px;flex-shrink:0;
    background:#fff4e5;color:#a8790a;font-size:10.5px;line-height:1.5;text-align:left;
    word-break:break-all;max-height:46px;overflow:hidden;width:calc(100% - 32px);
  }
  .diagstrip.bad{background:#ffecec;color:#c43c3c}

  /* 夢：1行ピル */
  .dream{
    margin:8px 16px 0;flex-shrink:0;
    display:flex;align-items:center;gap:7px;min-width:0;width:calc(100% - 32px);
    background:var(--lemon);border-radius:999px;padding:6px 14px;
    font-size:12px;font-weight:700;color:var(--amber);text-align:left;
  }
  .dream .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
  .dream .cnt{flex-shrink:0;font-variant-numeric:tabular-nums}

  /* 「いま」カード */
  .now{
    margin:12px 14px 0;flex-shrink:0;
    background:var(--card);border-radius:24px;
    padding:14px 16px;box-shadow:0 10px 28px rgba(30,40,70,.10);
    display:flex;gap:14px;align-items:center;
  }
  .now.hidden{display:none}
  /* 小さい帯（本人指示 2026-09-30「一度出したら邪魔なデカい画面が出っぱなし」）：
     開いた時はワンタップのボタンだけを1列に出す。大きいペン・文字・カメラは出さない（✚書く と 📷 が同じ役目）。右端の✕で閉じる */
  .now.mini{margin:6px 14px 0;padding:7px 8px 7px 10px;border-radius:16px;gap:8px;box-shadow:0 4px 12px rgba(30,40,70,.08);cursor:default}
  .now.mini .micbig,.now.mini .camsm,.now.mini .nh,.now.mini .hint{display:none}
  .now.mini .chips{margin-top:0}
  .now.mini .chip{padding:6px 12px}
  .now .nowx{
    display:none;width:30px;height:30px;border-radius:50%;background:#f1f3f8;color:#6a7080;font-size:13px;font-weight:800;
    flex-shrink:0;align-items:center;justify-content:center;align-self:flex-start;
  }
  .now.mini .nowx{display:flex}
  .now .nowx:active{background:#e2e6ef}
  .now .nownone{font-size:11.5px;color:var(--sub);font-weight:700}
  .micbig{
    width:58px;height:58px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(135deg,var(--green),var(--teal));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 18px rgba(11,193,103,.35);
  }
  .micbig svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}
  .now .right{flex:1;min-width:0}
  .now .nh{display:flex;align-items:center;gap:7px;font-weight:800;font-size:15.5px}
  .now .pulse{
    width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;
    animation:pu 1.6s ease-in-out infinite;
  }
  @keyframes pu{0%,100%{box-shadow:0 0 0 0 rgba(11,193,103,.35)}55%{box-shadow:0 0 0 7px rgba(11,193,103,0)}}
  @media (prefers-reduced-motion:reduce){.now .pulse{animation:none}}
  .now .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .camsm{
    width:44px;height:44px;border-radius:50%;background:#f1f3f8;
    font-size:20px;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;align-self:center;
  }
  .camsm:active{background:#e2e6ef}
  .chip{
    background:#f1f3f8;border-radius:999px;padding:4px 13px;
    font-size:12px;font-weight:700;color:#4a4f5e;
  }
  .chip:active{background:#e2e6ef}

  /* 3ペイン */
  .seg{
    display:flex;justify-content:center;gap:6px;margin:12px 0 6px;
    font-size:11.5px;font-weight:700;flex-shrink:0;
  }
  .seg button{padding:4px 14px;border-radius:999px;color:var(--sub)}
  .seg button.on{background:var(--green);color:#fff}

  .pane{
    flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;
    padding:0 18px 10px;
  }
  .pane::-webkit-scrollbar{display:none}

  /* タイムライン */
  .hour{
    display:flex;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);
    align-items:flex-start;min-height:42px;width:100%;text-align:left;
  }
  .hour .hh{
    font-variant-numeric:tabular-nums;color:#b8bdca;font-weight:700;
    width:44px;flex-shrink:0;font-size:12px;padding-top:2px;
  }
  .hour.filled .hh{color:var(--ink)}
  .hour .body{flex:1;min-width:0}
  .hour .loc{font-size:11px;color:var(--green);font-weight:800}
  .hour .txt{color:var(--ink);white-space:pre-wrap;word-break:break-word}
  .hour.gap .body{color:#ccd1dc;font-size:13px;font-weight:700}
  /* ✚書く：日報の一番上に張り付く（スクロールしても見えたまま） */
  .hour.wr{
    position:sticky;top:0;z-index:3;background:#eefaf3;border-bottom:0;border-radius:14px;
    padding:6px 8px;margin-bottom:4px;box-shadow:0 4px 12px rgba(30,40,70,.08);align-items:center;cursor:pointer;
  }
  /* 「✚書く」の行の右側：寝る／起きた・📷・⋯（いまカードの開閉） */
  .hour.wr .wr-r{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .hour.wr .wr-b{
    width:34px;height:34px;border-radius:50%;background:#fff;color:#4a4f5e;font-size:15px;font-weight:800;
    display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(30,40,70,.10);
  }
  .hour.wr .wr-b:active{background:#e2e6ef}
  .hour.wr .wr-b.on{background:var(--green);color:#fff}
  .hour.wr .chip{white-space:nowrap;font-size:13.5px;font-weight:800;padding:9px 13px}
  .hour.wr .chip.slp{background:#f4f2ff}
  .hour.wr .body{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 夜の締切の札（2:00までに寝る）：紫→黄→赤 */
  .hour.wr .bed{font-size:13.5px;font-weight:800;padding:9px 13px;border-radius:999px;background:#ece8ff;color:#5b4fd6;white-space:nowrap}
  .hour.wr .bed.warn{background:#fff3c9;color:#a8790a}
  .hour.wr .bed.hot,.hour.wr .bed.over{background:#ffe9ec;color:#e0405a}
  .sgoal{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 8px}
  /* HIBIKI 日々記 のロゴの組み方（本人選択 B・2026-10-03）：1行・同じ下線（ベースライン）。段差を作らない */
  .hb-logo{display:inline-flex;align-items:baseline;gap:.42em;line-height:1;white-space:nowrap}
  .hb-logo b{font-weight:800;letter-spacing:.06em;font-size:1em}
  .hb-logo i{font-style:normal;font-weight:800;font-size:.78em;letter-spacing:.08em;opacity:.92}
  /* 📚 ルーティン */
  .rt-sum{display:flex;gap:8px;margin:4px 0 6px}
  /* 📊 分析 */
  .an-tabs{display:flex;gap:4px;background:#eef0f5;border-radius:14px;padding:4px;margin:2px 0 10px}
  .an-tabs button{flex:1;padding:8px 0;border-radius:10px;font-weight:800;color:#6a7080;background:transparent}
  .an-tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(30,40,70,.1)}
  .an-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px}
  .an-nav b{font-size:17px;font-weight:800;min-width:150px;text-align:center}
  .an-nav button{font-size:22px;color:#8a90a0;padding:0 10px}
  .an-nav button:disabled{opacity:.25}
  .an-bar{display:flex;height:18px;border-radius:999px;overflow:hidden;margin-bottom:12px}
  .an-bar i{display:block;height:100%}
  .an-list{display:grid;gap:8px}
  .an-row{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(32px,.8fr) auto 44px;align-items:center;gap:6px;background:var(--card);border-radius:14px;padding:9px 10px}
  .an-ic{font-size:17px;text-align:center}
  .an-nm{font-weight:800;font-size:13.5px}
  .an-mb{height:8px;border-radius:999px;background:#eef0f5;overflow:hidden}
  .an-mb i{display:block;height:100%;border-radius:999px}
  .an-h{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .an-h small{display:block;font-size:10.5px;color:#9aa3b5;font-weight:700}
  .an-d{font-size:11px;font-weight:800;text-align:right;color:#9aa3b5;white-space:nowrap}
  .an-d.up{color:#0a9a54}.an-d.dn{color:#e0405a}
  .an-row.none{background:transparent;border:1px dashed #dfe3ea}
  /* c1.1 分析：ムダのカード・畳める見出し・移動の中身（4色バー）・どこで */
  .an-row.md{box-shadow:inset 3px 0 0 #e0405a}
  .an-nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .an-nm small{display:block;font-size:10.5px;color:#12a6a0;font-weight:700;overflow:hidden;text-overflow:ellipsis}
  .an-muda{background:#fdecef;border:1px solid #f6c3cc;border-radius:16px;padding:10px 12px;margin-bottom:12px}
  .an-muda.zero{background:#e7f8ef;border-color:#bfe9d2}
  .an-m1{display:flex;align-items:center;gap:8px}
  .an-mi{font-size:26px;line-height:1}
  .an-mt{flex:1;min-width:0;font-weight:800;font-size:14px;color:#b4233d}
  .an-mt b{font-size:22px;margin:0 3px;font-variant-numeric:tabular-nums}
  .an-mt small{font-size:11px;color:#c0566a;white-space:nowrap}
  .an-muda.zero .an-mt{color:#0a9a54}
  .an-m2,.an-m3{font-size:12px;font-weight:700;color:#8a3a4a;margin-top:4px;overflow-wrap:anywhere}
  .an-md{font-size:12.5px;font-weight:800;white-space:nowrap;color:#9aa3b5}
  .an-md.up{color:#e0405a}.an-md.dn{color:#0a9a54}
  .an-sec{margin-top:12px}
  .an-sh{display:flex;align-items:center;gap:6px;width:100%;font-weight:800;font-size:15px;color:var(--ink);padding:4px 0 8px;text-align:left}
  .an-ar{display:inline-block;color:#9aa3b5;transition:transform .15s}
  .an-sec.open .an-ar{transform:rotate(90deg)}
  .an-more{display:block;width:100%;padding:8px 0;font-size:12.5px;font-weight:800;color:#6a7080;border:1px dashed #dfe3ea;border-radius:12px}
  .an-mvr,.an-pfr{background:var(--card);border-radius:14px;padding:8px 10px;min-width:0}
  .an-mv1,.an-pf1{display:flex;align-items:center;gap:6px}
  .an-mv1 b,.an-pf1 b{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .an-mv2,.an-pf2{display:flex;align-items:center;gap:8px;margin-top:6px}
  .an-mvb{flex:1;min-width:0;display:flex;height:10px;border-radius:999px;overflow:hidden;background:#eef0f5}
  .an-mvb i{display:block;height:100%}
  .an-mvt{font-size:11px;font-weight:800;color:#8a90a0;white-space:nowrap}
  .an-mvt em{font-style:normal}.an-mvt em.g{color:#0a9a54}.an-mvt em.r{color:#e0405a}
  .an-lg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;font-weight:700;color:#6a7080;margin:8px 2px 0}
  .an-lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:3px;vertical-align:-1px}
  .an-sub{font-size:12px;font-weight:800;color:#6a7080;margin:12px 2px 6px}
  .an-cps{display:flex;flex-wrap:wrap;gap:6px}
  .an-cp{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;max-width:100%;overflow-wrap:anywhere}
  .an-cp b{font-variant-numeric:tabular-nums}
  .an-cp.md{border-color:#e0405a;color:#b4233d}
  .an-empty{font-size:12px;color:#9aa3b5;font-weight:700;padding:6px 2px}
  .an-dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .an-pf2 .an-mb{flex:1;min-width:0}
  .an-pm{font-size:11.5px;font-weight:800;color:#e0405a;white-space:nowrap}
  .an-pfr{cursor:pointer}
  .an-pfr.sel{box-shadow:0 0 0 2px #c3c8d4}
  .an-pfr .an-cps{margin-top:8px}
  .an-vis{margin-top:10px;display:grid;gap:5px}
  .an-vr{display:flex;gap:8px;align-items:baseline;font-size:12.5px;font-weight:700;color:#2a2f3c;min-width:0}
  .an-vt{font-variant-numeric:tabular-nums;white-space:nowrap}
  .an-vr b{color:#0a9a54;white-space:nowrap}
  .an-vr small{color:#8a90a0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .an-pfr.unset b{color:#9aa3b5}
  .rt-sum>div{flex:1;background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:0 4px 14px rgba(30,40,70,.06)}
  .rt-sum small{display:block;font-size:11.5px;font-weight:800;color:#8a90a0}
  .rt-sum b{font-size:22px;font-weight:800;color:#4d7dff;font-variant-numeric:tabular-nums}
  .rt-card{background:var(--card);border-radius:18px;padding:12px 14px;margin-top:10px;border:1px solid var(--line);border-left:5px solid #c3c8d4}
  .rt-card.done{border-left-color:var(--green)}
  .rt-hd{display:flex;align-items:center;gap:8px}
  .rt-nm{flex:1;min-width:0;text-align:left;background:transparent;font-size:15.5px;font-weight:800;color:var(--ink);word-break:break-word;padding:0}
  .rt-tm{flex-shrink:0;font-size:13px;font-weight:800;color:#0a9a54;background:#eefaf3;border-radius:999px;padding:3px 11px;white-space:nowrap}
  .rt-sub{font-size:11.5px;font-weight:700;color:#8a90a0;margin-top:3px}
  .rt-list,.rt-past{display:grid;gap:4px;margin-top:8px}
  .rt-past{border-top:1px dashed #e3e6ee;padding-top:8px}
  .rt-li{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:transparent;padding:2px 0}
  .rt-li .rt-dt{flex-shrink:0;width:36px;font-size:11px;font-weight:800;color:#9aa3b5;font-variant-numeric:tabular-nums}
  .rt-list .rt-li .rt-dt{display:none}
  .rt-li .rt-tx{flex:1;min-width:0;font-size:13.5px;font-weight:700;color:#2a2f3c;word-break:break-word;line-height:1.55}
  .rt-li .rt-tx small{display:block;font-size:11px;color:#9aa3b5;font-weight:700;font-variant-numeric:tabular-nums}
  .rt-li b{flex-shrink:0;font-size:12px;font-weight:800;color:#0a9a54;white-space:nowrap}
  .rt-past .rt-li .rt-tx,.rt-past .rt-li b{color:#8a90a0}
  .rt-add{display:block;width:100%;margin-top:10px;padding:10px;border-radius:14px;background:linear-gradient(135deg,var(--green),var(--teal));color:#fff;font-weight:800;font-size:14px;box-shadow:0 6px 14px rgba(11,193,103,.22)}
  /* 実時間の注意の帯（下のナビのすぐ上） */
  .slpbar{
    position:absolute;left:10px;right:10px;bottom:calc(var(--navh,64px) + 10px);z-index:30;
    display:flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;border-radius:14px;
    box-shadow:0 8px 20px rgba(30,40,70,.18);font-weight:800;font-size:12.5px;
  }
  .slpbar .sb-t{flex:1;min-width:0;text-align:left;background:transparent;color:inherit;font:inherit;font-weight:800;padding:5px 0;line-height:1.4}
  .slpbar .sb-x{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.75);color:inherit;font-weight:800;flex-shrink:0}
  .slpbar.warn{background:#fff3c9;color:#a8790a}
  .slpbar.over{background:#ffe1e6;color:#c8102e}
  .slpbar.def{background:#ece8ff;color:#5b4fd6}
  .sgoal span{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:#f1f3f8;color:#4a4f5e}
  .hour .nowmark{
    color:var(--green);font-size:11px;font-weight:800;
    display:inline-flex;align-items:center;gap:5px;margin-left:8px;
  }
  .hour .nowmark::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}

  /* 写真 */
  .phrow{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .phth{width:46px;height:46px;border-radius:10px;object-fit:cover;background:#eef0f5;display:block}
  .phmore{
    width:46px;height:46px;border-radius:10px;background:#eef0f5;color:var(--sub);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;
  }
  .phadd{
    width:56px;height:56px;border-radius:10px;border:2px dashed #c9cdd8;
    display:flex;align-items:center;justify-content:center;color:#aab0bf;
    font-size:22px;background:#fff;flex-shrink:0;
  }
  .sheet .phth{width:56px;height:56px}

  /* 時間ワンタッチ選択 */
  .hourchips{display:flex;gap:5px;overflow-x:auto;padding:3px 0;scrollbar-width:none}
  .hourchips::-webkit-scrollbar{display:none}
  .hourchips button{
    min-width:40px;padding:5px 0;border-radius:11px;background:#f1f3f8;
    font-weight:700;font-size:12.5px;color:#4a4f5e;flex-shrink:0;
    font-variant-numeric:tabular-nums;text-align:center;
  }
  .hourchips .sel{background:var(--green);color:#fff;font-weight:800}

  /* 開始–終了つき行の時刻表示 */
  .hour.filled .hh{width:50px}
  .hour .hh b{display:block;font-size:13px;line-height:1.3}
  /* 終わりの時刻も、はっきり読める大きさと色にする（何時から何時までが分かるように） */
  .hour .hh small{display:block;color:#5a6378;font-size:12px;font-weight:800;line-height:1.35}
  .hour .hh small::before{content:"↓";display:block;color:#c3c8d4;font-size:9px;line-height:1.1}
  /* 場所を大きく・居た時間を札で */
  .hour .loc.big{display:block;font-size:15px;line-height:1.35;word-break:break-word}
  .hour .dpill{
    display:inline-block;margin:3px 0 1px;font-size:11.5px;font-weight:800;line-height:1.5;padding:1px 10px;border-radius:999px;
    background:#eefaf3;color:#0a9a54;font-variant-numeric:tabular-nums;
  }
  /* その場所でやったこと（何を・どれくらい） */
  /* 1行ずつ書いた分の見せ方：点・文字（下に小さく時刻）・右に時間の札。時間が無い行は点と文字だけ＝どちらでも形がそろう */
  .acts{display:grid;gap:7px;margin:7px 0 3px}
  .act{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:8px;align-items:start}
  .act .a-d{width:6px!important;height:6px!important;margin:7px 0 0!important;transform:none!important}
  .act .a-t{font-size:14px;font-weight:700;color:#2a2f3c;word-break:break-word;line-height:1.45}
  .act .a-m{font-size:11.5px;font-weight:800;color:#0a9a54;font-variant-numeric:tabular-nums;white-space:nowrap;background:#eefaf3;border-radius:999px;padding:1px 9px;margin-top:1px}
  .act .a-b{grid-column:1 / -1;height:5px;border-radius:99px;background:#eef0f5;overflow:hidden;margin-top:3px}
  .act .a-b i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--teal))}
  .act.rest .a-t,.act.rest .a-m{color:#9aa3b5;font-weight:700}
  /* 内容の書き方の切り替え（選んでいる方が白く浮く） */
  .cmode{display:flex;gap:4px;background:#eef0f5;border-radius:14px;padding:4px}
  .cmode button{flex:1;padding:8px 4px;border-radius:11px;font-weight:800;font-size:12.5px;color:#6a7080;background:transparent;position:relative}
  .cmode button.sel{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(30,40,70,.12)}
  .cmode button i{display:none;position:absolute;top:6px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--green)}
  .cmode button.has i{display:block}
  .act .a-d{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--green);margin-right:7px;vertical-align:middle;transform:translateY(-1px)}
  /* 本文の箇条書き：点をそろえて、折り返しても文字の頭がそろう */
  .txt-p{display:block;white-space:pre-wrap}
  .txt-li{display:flex;gap:7px;align-items:baseline;margin:2px 0}
  .txt-li i{flex-shrink:0;width:5px;height:5px;border-radius:50%;background:var(--green);transform:translateY(-2px)}
  .txt-li span{flex:1;min-width:0;word-break:break-word;white-space:pre-wrap}
  /* 記録シートの「ここでやったこと」の行 */
  /* 1行＝上に「何を」、下に「何時から → 何時まで」と、そこから出したかかった時間 */
  .actrow{display:block;margin-top:8px;padding:8px;border-radius:16px;background:#f6f8fb;border:1px solid var(--line)}
  .actrow .ac-l1{display:flex;gap:6px;align-items:center}
  .actrow .ac-l2{display:flex;gap:6px;align-items:center;margin-top:6px}
  .actrow .ac-t{flex:1;min-width:0}
  .actrow .ac-s,.actrow .ac-e{flex:0 0 auto;width:104px;min-width:0}
  .actrow .ac-ar{color:#8a90a0;font-weight:800;flex-shrink:0}
  .actrow .ac-d{margin-left:auto;font-size:12px;font-weight:800;color:#0a9a54;white-space:nowrap}
  .act .a-c{grid-column:2 / -1;display:block;margin-top:3px;padding:5px 9px;border-radius:10px;background:#f4f6fa;color:#5b6170;font-size:12.5px;font-weight:600;line-height:1.5;word-break:break-word}
  /* 1行の右に縦並び：上 ✕、下 📝詳細 */
  .actrow{display:grid!important;grid-template-columns:minmax(0,1fr) auto;column-gap:6px}
  .actrow .ac-l1{grid-column:1;grid-row:1}
  .actrow .ac-l2{grid-column:1;grid-row:2}
  .actrow .ac-side{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;align-items:center;gap:6px}
  .actrow .ac-k,.actrow .ac-c{grid-column:1 / -1}
  .actrow .ac-cb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:44px;padding:5px 0;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:15px;line-height:1}
  .actrow .ac-cb span{font-size:10px;font-weight:800;color:#6a7080}
  .actrow .ac-side{grid-row:1 / span 3}
  .actrow .ac-pb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:44px;padding:5px 0;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:15px;line-height:1}
  .actrow .ac-pb span{font-size:10px;font-weight:800;color:#6a7080}
  .actrow .ac-pb.on{border-color:var(--green);background:#eefaf3}
  .actrow .ac-ph{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .actrow .ac-ph .phth{width:56px;height:56px}
  .act .a-ph{grid-column:2 / -1;display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
  .act .a-ph img{width:48px;height:48px;object-fit:cover;border-radius:8px}
  #acQ .chip.ac-qm{background:#f1f3f8;color:#5b6170}
  .actrow .ac-cb.on{background:#eef3ff;border-color:#c9d6ff}
  .actrow .ac-c{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:8px 11px;font:inherit;font-size:16px;resize:vertical;background:#fff;outline:none}
  .act .a-r{display:block;font-size:11px;font-weight:700;color:#9aa3b5;font-variant-numeric:tabular-nums;margin-top:1px}
  .act .a-k{font-style:normal;font-size:13px;line-height:1.45;width:auto}
  .act .a-kl{font-style:normal;font-size:10.5px;font-weight:800;color:#6a7080;background:#f1f3f8;border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px}
  /* AIの行は紫で目立たせる */
  .act.k-ai{background:linear-gradient(90deg,#f1efff,#f6f8ff);border-radius:10px;padding:4px 6px;margin:0 -6px}
  .act.k-ai .a-t{color:#3e33a8}.act.k-ai .a-kl{background:#7a6ef3;color:#fff}.act.k-ai .a-m{background:#e6e2ff;color:#5b4fd6}
  .act.k-work .a-kl{background:#e3e9f7;color:#1e3a8a}
  /* 書く画面の種類ボタン（行ごと・小さく） */
  .actrow .ac-k{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
  .actrow .ac-k button{flex:1 1 0;min-width:0;padding:5px 2px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:11px;font-weight:800;color:#6a7080;white-space:nowrap}
  .actrow .ac-k button span{margin-left:2px}
  .actrow .ac-k button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
  .actrow .ac-k button[data-ak=ai]{color:#5b4fd6;border-color:#cfc9ff;background:#f4f2ff}
  .actrow .ac-k button[data-ak=ai].sel{background:linear-gradient(135deg,#7a6ef3,#4d7dff);color:#fff;border-color:transparent}
  .act.rest .a-d{background:#c3c8d4!important}.act.rest .a-m{background:#f1f3f8;color:#9aa3b5}
  /* 書く画面：時刻が空の欄は薄く（書かなくてもいい、が見て分かる） */
  .actrow .ac-s.emp,.actrow .ac-e.emp{opacity:.45}
  .actrow .ac-x{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:#f1f3f8;color:#8a90a0;font-weight:800}
  /* c1.1 種類の帯（横スクロール・＋は帯の外の右端に固定・右端の薄い影＝続きがある印） */
  .actrow .ac-kw{grid-column:1 / -1;display:flex;gap:5px;align-items:center;margin-top:6px;min-width:0}
  .actrow .ac-kw .ac-k{flex:1 1 auto;min-width:0;margin-top:0;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain;padding-bottom:1px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
  .actrow .ac-kw .ac-k.end{-webkit-mask-image:none;mask-image:none}
  .actrow .ac-k::-webkit-scrollbar{display:none}
  .actrow .ac-k button{flex:0 0 auto;min-width:0;padding:6px 8px 7px;box-shadow:inset 0 -3px 0 var(--kc,#c3c8d4)}
  .actrow .ac-k button.sel{background:var(--kc,var(--ink));border-color:var(--kc,var(--ink));color:#fff;box-shadow:none}
  .actrow .ac-add{flex:0 0 auto;width:32px;height:30px;border-radius:10px;background:#eefaf3;color:#0a9a54;font-weight:900;font-size:16px;line-height:1;border:1px dashed #9fdcbc}
  /* 道具の帯（絵だけ・選ぶと名前が出る） */
  .actrow .ac-dw{grid-column:1 / -1;display:flex;gap:5px;align-items:center;margin-top:5px;min-width:0}
  .actrow .ac-dv{flex:1 1 auto;min-width:0;display:flex;gap:5px;align-items:center;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior-x:contain}
  .actrow .ac-dv::-webkit-scrollbar{display:none}
  .actrow .ac-dx{grid-column:1 / -1;margin-top:6px}
  .act .a-dv .a-dx{font-style:normal;font-size:11px;font-weight:800;color:#6a7080;background:#f1f3f8;border-radius:6px;padding:1px 6px;margin:0 6px 0 3px;vertical-align:1px}
  .actrow .ac-dv button[data-ad] em{font-style:normal;font-size:11px;font-weight:800;margin-left:3px;vertical-align:2px}
  .actrow .ac-dv button[data-ad].sel em{display:none}
  .actrow .ac-dv button[data-ad]{flex:0 0 auto;height:30px;min-width:36px;padding:0 7px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:16px;line-height:1;filter:grayscale(.6);opacity:.75}
  .actrow .ac-dv button[data-ad] span{display:none;font-size:11px;font-weight:800;margin-left:4px;vertical-align:2px}
  .actrow .ac-dv button[data-ad].sel{filter:none;opacity:1;background:var(--ink);color:#fff;border-color:var(--ink)}
  .actrow .ac-dv button[data-ad].sel span{display:inline}
  /* 移動の1タップチップ（左の色＝種類の色） */
  /* RV1：AI は選んでいない時は他と同じ白／選択中の白文字に影（明るい色でも読める）／押す物は 40px */
  .actrow .ac-k button[data-ak=ai]:not(.sel){color:#6a7080;border-color:var(--line);background:#fff}
  .actrow .ac-k button.sel{text-shadow:0 1px 1px rgba(0,0,0,.35)}
  .actrow .ac-k button{min-height:40px}
  .actrow .ac-dv button[data-ad]{height:40px;min-width:40px}
  .actrow .ac-add{width:40px;height:40px}
  #acChips .chip,#acQ .chip{min-height:40px}
  #trChips .chip{min-height:36px}
  #acQ .chip.ac-q,#acChips .chip.ac-q{background:#fff;border:1px solid var(--line);box-shadow:inset 4px 0 0 var(--kc,#c3c8d4);font-weight:800}
  /* 日記の行：道具は種類ラベルの右に絵だけ */
  .act .a-dv{font-style:normal;font-size:12.5px;margin-right:5px;vertical-align:0}

  /* 予定（青系ToDo・日報と別世界） */
  .planwrap{
    background:#f4f7ff;border:1px solid #e2e9ff;border-radius:16px;
    padding:10px 12px;margin:6px 0 10px;
  }
  .glab.blue{color:#4d7dff}
  .prow{display:flex;gap:6px;margin-bottom:6px}
  .prow input[type=time]{
    width:100px;flex-shrink:0;background:#fff;border:1px solid #dbe4ff;border-radius:12px;
    padding:8px 6px;font-size:15px;font-weight:700;text-align:center;outline:none;
    font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none;color:#2a3242;
  }
  .prow input[type=text]{
    flex:1;min-width:0;background:#fff;border:1px solid #dbe4ff;border-radius:12px;
    padding:8px 12px;font-size:13.5px;outline:none;color:#2a3242;
  }
  .prow input:focus{border-color:#4d7dff}
  .plan2{display:flex;gap:9px;align-items:flex-start;padding:9px 2px;border-bottom:1px dashed #dbe4ff}
  .plan2:last-child{border-bottom:0}
  .plan2 .tg2{
    width:22px;height:22px;border-radius:7px;border:2px solid #a9bcf5;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;
    margin-top:1px;background:#fff;
  }
  .plan2.done .tg2{background:#4d7dff;border-color:#4d7dff}
  .plan2 .p2t{
    font-variant-numeric:tabular-nums;color:#4d7dff;font-weight:800;font-size:12px;
    width:46px;flex-shrink:0;padding-top:3px;letter-spacing:.02em;
  }
  .plan2 .p2b{flex:1;min-width:0;text-align:left}
  .plan2 .p2c{font-weight:600;font-size:13.5px;color:#2a3242;word-break:break-word;letter-spacing:.02em}
  .plan2.done .p2c{color:#b0bad0;text-decoration:line-through}
  .plan2 .p2p{font-size:11px;color:#7d8cb0;font-weight:700;margin-top:1px}
  .gchip{
    border:1px solid #dbe4ff;background:#fff;color:#7d8cb0;border-radius:999px;
    padding:4px 13px;font-size:11.5px;font-weight:800;
  }
  .gchip.on{background:#4d7dff;color:#fff;border-color:#4d7dff}
  .ycard{text-align:left}

  /* 年間ビュー */
  .yeargrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .yeargrid button{
    padding:14px 0;border-radius:14px;background:#f1f3f8;font-weight:800;font-size:13.5px;
    color:var(--ink);
  }
  .yeargrid button.cur{background:var(--green);color:#fff}

  /* カレンダー（日付タップ） */
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
  .caldow span{font-size:10px;color:var(--sub);font-weight:800}
  .caldow .sun{color:var(--pink)}
  .caldow .sat{color:#4d7dff}
  .calgrid button{
    aspect-ratio:1;border-radius:12px;font-weight:700;font-size:13.5px;
    position:relative;font-variant-numeric:tabular-nums;color:var(--ink);
  }
  .calgrid button.sel{background:var(--green);color:#fff}
  .calgrid button.tdy{box-shadow:inset 0 0 0 2px var(--green)}
  .calgrid button i{
    position:absolute;bottom:4px;left:50%;transform:translateX(-6px);
    width:4px;height:4px;border-radius:50%;background:#e0a814;
  }
  .calgrid button i.g{transform:translateX(2px);background:#4d7dff}
  .calgrid button.sel i{background:#fff}

  /* 写真ビューア */
  .viewer{
    position:absolute;inset:0;background:rgba(10,12,16,.92);z-index:60;
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  }
  .viewer.open{display:flex}
  .viewer img{max-width:94%;max-height:74%;border-radius:14px;object-fit:contain}
  .viewer .vbtns{display:flex;gap:12px}
  .viewer .vbtns button{color:#fff;background:rgba(255,255,255,.15);border-radius:999px;padding:9px 20px;font-weight:700;font-size:13px}
  .viewer .vdel.arm{background:var(--pink)}

  /* 予定ペイン */
  .glab{
    display:flex;align-items:center;gap:6px;
    font-size:10.5px;font-weight:800;color:var(--sub);letter-spacing:.1em;
    margin:12px 0 2px;
  }
  .gev{display:flex;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);align-items:flex-start}
  .gev .gt{
    font-variant-numeric:tabular-nums;color:#4d7dff;font-weight:800;
    font-size:11.5px;width:82px;flex-shrink:0;padding-top:2px;white-space:nowrap;
  }
  .gev .gs{flex:1;min-width:0;word-break:break-word}
  .ghint{
    font-size:11.5px;color:var(--sub);background:#f1f3f8;border-radius:12px;
    padding:9px 12px;font-weight:700;margin:6px 0;
  }
  .gempty{color:#c4c9d4;font-size:12px;font-weight:700;padding:8px 2px}
  .addrow{display:flex;gap:8px;padding:10px 0 6px;align-items:center}
  .addrow input{
    flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:9px 14px;font-size:13px;outline:none;min-width:0;
  }
  .addrow input:focus{border-color:var(--green)}
  .addbtn{
    width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;
    font-size:19px;font-weight:700;flex-shrink:0;line-height:1;
  }
  .plan{
    display:flex;gap:10px;align-items:flex-start;padding:9px 2px;
    border-bottom:1px solid var(--line);width:100%;text-align:left;
  }
  .plan .tg{
    width:22px;height:22px;border-radius:50%;border:2px solid #d5d9e3;
    flex-shrink:0;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:12px;margin-top:2px;background:none;
  }
  .plan.done .tg{background:var(--green);border-color:var(--green)}
  .plan .pt{flex:1;min-width:0;word-break:break-word;text-align:left;padding-top:1px}
  .plan.done .pt{color:#b8bdca;text-decoration:line-through}
  .empty-hint{color:#c4c9d4;font-size:12.5px;font-weight:700;text-align:center;padding:26px 0}

  /* 10年ストリップ */
  .decade{
    padding:10px 14px 9px;border-top:1px solid var(--line);
    background:#f3f5f9;flex-shrink:0;
  }
  .decade .cards{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  .decade .cards::-webkit-scrollbar{display:none}
  .ycard{
    flex-shrink:0;width:170px;background:var(--card);
    border-radius:16px;padding:8px 12px;box-shadow:0 3px 10px rgba(30,40,70,.06);
  }
  .ycard .y{font-size:11px;color:var(--green);font-weight:800}
  .ycard p{
    font-size:11px;color:var(--ink);line-height:1.5;margin-top:2px;font-weight:500;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .ycard.ph .y{color:#b8bdca}
  .ycard.ph p{color:#c4c9d4}

  /* ボトムナビ */
  /* 本人指示 2026-09-29：トップ(全体)／支払い／メモ／ルール の4つ。真ん中のペンは上の「いま」カードと同じ動きなので無くした。
     夢は上の黄色い帯、設定⚙はその右端へ移した。支払い・メモ・ルールのページを開いている間も、この4つは出たまま（1タップで行き来） */
  .nav{
    display:flex;justify-content:space-around;align-items:stretch;
    padding:6px 10px calc(8px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:var(--card);flex-shrink:0;
  }
  .nav .nb{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0 2px;
    border-radius:14px;position:relative;color:#b8bdca;font-size:9.5px;font-weight:800;line-height:1.3;white-space:nowrap;min-width:0;
  }
  .nav .nb:active{background:#f1f3f8}
  .nav .nb.on{color:var(--green)}
  .nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .nav .nbdg{
    position:absolute;top:0;left:50%;margin-left:7px;min-width:17px;height:17px;border-radius:99px;

  /* 💴 何月分のコロコロ（上下に回して選ぶ。真ん中の緑の帯に来たものが選ばれる） */
  .mwheel{position:relative;height:120px;border-radius:16px;background:var(--card);border:1px solid var(--line);overflow:hidden}
  .mwheel .mw-band{position:absolute;left:10px;right:10px;top:40px;height:40px;border-radius:12px;background:#e7f9f0;pointer-events:none}
  .mwheel .mw-sc{
    position:relative;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }
  .mwheel .mw-sc::-webkit-scrollbar{display:none}
  .mwheel .mw-pad{height:40px;flex-shrink:0}
  .mwheel .mw-it{
    display:flex;align-items:center;justify-content:center;width:100%;height:40px;scroll-snap-align:center;
    font-weight:800;font-size:15px;color:#b8bdca;font-variant-numeric:tabular-nums;
  }
  .mwheel .mw-it.sel{color:#0a9a54;font-size:19px}
  /* コロコロの右に「決定」。決定したら畳んで「✓ 10月分」を緑で出す */
  .mwrow{display:flex;gap:8px;align-items:stretch}
  .mwrow .mwheel{flex:1;min-width:0}
  .mw-ok{
    width:78px;flex-shrink:0;border-radius:16px;color:#fff;font-weight:800;font-size:15px;letter-spacing:.12em;
    background:linear-gradient(135deg,var(--green),var(--teal));box-shadow:0 6px 16px rgba(11,193,103,.3);
  }
  .mw-ok:active{transform:scale(.97)}
  .mw-done{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 14px;border-radius:16px;
    background:#e7f9f0;border:1.5px solid var(--green);color:#0a9a54;font-weight:800;font-size:17px;
  }
  .mw-done .ck{
    width:28px;height:28px;border-radius:50%;flex-shrink:0;color:#fff;font-size:15px;
    background:linear-gradient(135deg,var(--green),var(--teal));display:flex;align-items:center;justify-content:center;
  }
  .mw-done .lb{flex:1;min-width:0}
  .mw-done small{flex-shrink:0;font-size:11.5px;color:#4a4f5e;background:#fff;border-radius:999px;padding:4px 11px;font-weight:800}
  /* 💴 支払い：方法ボタン（現金/口座振込/口座引落/カード/コンビニ）は3個×2行で全部同じ大きさ */
  #pyM button{flex:0 0 calc((100% - 10px)/3);font-size:12.5px;min-height:36px}
  /* 支払いページ（本人指示 2026-09-29）：一番上に月／未払いを大きく／未払い・払ったはタブで分ける／
     1件＝1枚のカードで「いつまで・何を・いくら・どこに・方法」が一目で分かる。払ったものは緑×金 */
  .pmon{display:flex;align-items:center;justify-content:center;gap:8px;padding:0 0 8px}
  .pmon .pmv{color:#c3c8d4;font-size:24px;padding:0 14px;border-radius:10px;line-height:1.2}
  .pmon .pmv:active{background:#eef0f5}
  .pmon .pm-m{font-weight:800;font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
  .pmon .pm-m small{font-size:15px;margin-left:2px}
  .pmon .pm-y{color:var(--sub);font-size:12px;font-weight:700}
  .psum{display:flex;gap:8px;margin-bottom:8px}
  .psum>div{flex:1;min-width:0;border-radius:16px;padding:10px 12px;background:var(--card);box-shadow:0 6px 18px rgba(30,40,70,.07)}
  .psum .ps-l{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--sub)}
  .psum .ps-v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3;white-space:nowrap}
  .psum .ps-v small{font-size:12px}
  .psum .ps-c{font-size:11px;font-weight:700;color:var(--sub)}
  .psum .up .ps-v{color:#e0405a}
  .psum .up.zero .ps-v{color:var(--green)}
  .psum .dn{background:linear-gradient(135deg,#e7f9f0,#f2fdf8)}
  .psum .dn .ps-v{color:#0a9a54}
  .ptabs{display:flex;gap:6px;margin:8px 0 2px}
  .ptabs button{flex:1;padding:9px 0;border-radius:12px;font-weight:800;font-size:13px;background:#f1f3f8;color:#6a7080}
  .ptabs button.on[data-pt="up"]{background:var(--ink);color:#fff}
  .ptabs button.on[data-pt="dn"]{background:var(--green);color:#fff}
  .ptabs button.on[data-pt="rp"]{background:#4d7dff;color:#fff}
  .ptabs button{white-space:nowrap;min-width:0}
  /* 並びの切り替え：選んでいる方が濃くなる（未払い＝黒／払った＝緑） */
  .psort{display:flex;align-items:center;gap:6px;margin:9px 0 1px}
  .psort .ps-k{margin-right:auto;font-size:11.5px;font-weight:800;color:var(--sub);padding-left:4px}
  .psort button{padding:7px 13px;border-radius:999px;font-size:12px;font-weight:800;background:#f1f3f8;color:#8a90a0;white-space:nowrap}
  .psort button.on{background:var(--ink);color:#fff;box-shadow:0 4px 10px rgba(26,28,34,.18)}
  .psort.dn button.on{background:var(--green);box-shadow:0 4px 10px rgba(11,193,103,.28)}
  .psort button:active{transform:scale(.97)}
  .pcard{
    display:block;width:100%;text-align:left;
    background:var(--card);border-radius:16px;padding:12px 12px 12px 10px;margin-top:8px;
    border:1px solid var(--line);border-left:5px solid #c3c8d4;
  }
  /* 上の段：日付｜何を｜いくら。下の段：支払先と支払い方法（真ん中から右端まで使って広く出す） */
  .pk-grid{display:grid;grid-template-columns:60px minmax(0,1fr) auto;column-gap:10px;row-gap:9px;align-items:center}
  .pk-grid .pk-date{grid-column:1;grid-row:1 / span 2}
  .pk-grid .pk-main{grid-column:2;grid-row:1}
  .pk-grid .pk-yen{grid-column:3;grid-row:1}
  .pk-info{
    grid-column:2 / span 2;grid-row:2;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 8px;align-items:start;
    padding-top:9px;border-top:1px dashed #e3e6ee;
  }
  .pcard.paid .pk-info{border-top-color:#bfe9d3}
  .pk-tag{
    font-size:10.5px;font-weight:800;line-height:1.5;padding:3px 9px;border-radius:9px;white-space:nowrap;text-align:center;
    background:#f1f3f8;color:#6a7080;
  }
  .pk-tag.m-cash{background:#e2f7ec;color:#0a9a54}
  .pk-tag.m-bank{background:#e8efff;color:#3b63d9}
  .pk-tag.m-debit{background:#f1ebff;color:#6b4bd6}
  .pk-tag.m-card{background:#fff0e2;color:#c9661a}
  .pk-tag.m-cvs{background:#e2f5f7;color:#0e8a93}
  .pk-tag.m-other{background:#ececf4;color:#4a4f5e}
  .pk-tag.none{background:transparent;color:#b8bdca;border:1px dashed #d5d9e3;padding:2px 8px}
  .pcard.paid .pk-tag:not([class*="m-"]):not(.none){background:#fff}
  .pk-v{font-size:12px;font-weight:700;color:#5a6378;line-height:1.5;padding-top:2px;word-break:break-word;min-width:0}
  .pk-v.nm{font-size:13.5px;font-weight:800;color:#1a1c22;padding-top:1px}
  .pk-ac{display:block}
  /* 振込先：「▸」と名前を横に並べる。幅が狭くても「▸」だけが1行に取り残されない（2026-09-30レビュー指摘） */
  .pk-ac.to{display:flex;gap:4px;align-items:flex-start}
  .pk-ac.to::before{content:"▸";color:#3b63d9;font-weight:800;flex-shrink:0}
  .pk-al{min-width:0}
  .pk-bk,.pk-hd{display:inline-block;max-width:100%}
  .pk-hd{font-size:11px;color:#8a90a0}
  @media (max-width:374px){
    .pk-v{font-size:11px}.pk-v.nm{font-size:12.5px}.pk-hd{font-size:10.5px}
    .pk-tag{font-size:10px;padding:3px 7px}
    .pk-info{gap:6px 6px}
  }
  .pk-bd{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
  .pk-mo,.pk-pv,.pk-due{font-size:10.5px;font-weight:800;line-height:1.5;padding:2px 9px;border-radius:999px;white-space:nowrap}
  .pk-mo{background:#1a1c22;color:#fff}
  /* 🔁 毎月のタブ：合計の帯／毎月払い1本＝1枚のカード（下に状態とスイッチ） */
  .rpsum{display:flex;align-items:baseline;gap:8px;background:linear-gradient(135deg,#eaf0ff,#f6f8ff);border-radius:16px;padding:12px 14px;margin-top:9px}
  .rpsum .rs-l{font-size:12px;font-weight:800;color:#3b63d9;margin-right:auto}
  .rpsum b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:#1a1c22}
  .rpsum b small{font-size:11px;margin-left:1px}
  .rpsum .rs-c{font-size:12px;font-weight:800;color:#6a7080}
  .pcard.rp{padding:0;border-left-color:#4d7dff;overflow:hidden}
  .pcard.rp .rp-main{display:block;width:100%;text-align:left;padding:12px 12px 11px 10px;background:transparent}
  .pcard.rp .pk-date b i{font-style:normal;font-size:11px;margin-left:1px}
  .pcard.rp .pk-date b.eom{font-size:15px}
  .pk-yen.na{font-size:12.5px;color:#c98a2f;background:#fff7e8;border-radius:999px;padding:3px 10px}
  .pcard.paid .pk-yen.na{color:#c98a2f}
  /* 入力シートの一番上に、いつも出す「毎月」のスイッチ：切＝青い枠・灰色のスイッチ／入＝緑 */
  .repsw{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px 9px 14px;border-radius:16px;
    background:#f6f8ff;border:1.5px solid #dbe4ff;color:#3b63d9;font-weight:800;font-size:14.5px;
  }
  .repsw .lb{flex:1;min-width:0}
  .repsw .rp-sw{display:block}
  .repsw.on{background:#e7f9f0;border-color:var(--green);color:#0a9a54}
  .repsw:active{transform:scale(.99)}
  /* 毎月と年間払いのスイッチを横に2つ */
  .repduo{display:flex;gap:8px}
  .repduo .repsw{flex:1;min-width:0;padding:8px 9px 8px 11px;font-size:13.5px;gap:6px}
  .repduo .repsw .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .repduo .rp-sw{width:42px;height:26px}
  .repduo .rp-sw i{width:20px;height:20px}
  .repduo .rp-sw.on i{left:19px}
  /* 区分 */
  .pyent{display:flex;gap:6px;margin-top:8px}
  .pyent button{flex:1;min-width:0;padding:9px 4px;border-radius:12px;background:#f1f3f8;color:#6a7080;font-weight:800;font-size:13px;white-space:nowrap}
  .pyent button.sel[data-en=me]{background:#ff8a3d;color:#fff}
  .pyent button.sel[data-en=al]{background:#0bc167;color:#fff}
  .pyent button.sel[data-en=corp]{background:#1e3a8a;color:#fff}
  .pent{display:flex;gap:5px;margin:8px 0 0;overflow-x:auto;scrollbar-width:none}
  .pent::-webkit-scrollbar{display:none}
  .pent button{flex:0 0 auto;padding:6px 11px;border-radius:999px;background:#f1f3f8;color:#6a7080;font-weight:800;font-size:12px;white-space:nowrap}
  .pent button.on{background:var(--ink);color:#fff}
  .pk-en{font-size:10.5px;font-weight:800;line-height:1.5;padding:2px 9px;border-radius:999px;white-space:nowrap}
  .pk-en.en-me{background:#fff0e6;color:#d0611c}.pk-en.en-al{background:#e2f7ec;color:#0a9a54}.pk-en.en-corp{background:#e3e9f7;color:#1e3a8a}
  .pk-yr{font-size:10.5px;font-weight:800;line-height:1.5;padding:2px 9px;border-radius:999px;white-space:nowrap;background:#fff0e2;color:#c9661a}
  .rpsum.yr{margin-top:16px;background:linear-gradient(135deg,#fff0e2,#fffaf3)}
  .rpsum.yr .rs-l{color:#c9661a}
  /* 入力欄の色分け：青＝アプリが入れた（自動）／黄＝まだ空で、手で入れる所 */
  .sheet input.auto,.sheet textarea.auto{background:#eaf2ff;border-color:#7ea4ff}
  .sheet input.need,.sheet textarea.need{background:#fffbe3;border-color:#f0c24a}
  .prbtns button.sel.auto{background:#3b63d9;color:#fff}
  .fld-leg{display:flex;gap:14px;justify-content:center;font-size:10.5px;font-weight:800;color:#8a90a0;margin:-4px 0 0}
  .fld-leg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-2px;border:1.5px solid}
  .fld-leg .a{background:#eaf2ff;border-color:#7ea4ff}
  .fld-leg .n{background:#fffbe3;border-color:#f0c24a}
  /* 毎月 何日に払うか：選んである日（緑）と、1〜30日・月末の表 */
  .mdbox{margin-top:8px}
  .md-grid{
    display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px;
    background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;
  }
  .md-grid button{
    height:38px;border-radius:12px;background:#f1f3f8;color:#2a2f3c;font-weight:800;font-size:14.5px;
    font-variant-numeric:tabular-nums;min-width:0;
  }
  .md-grid button.eom{grid-column:span 4;letter-spacing:.2em}
  .md-grid button.sel{background:linear-gradient(135deg,var(--green),var(--teal));color:#fff;box-shadow:0 4px 10px rgba(11,193,103,.3)}
  .md-grid button:active{transform:scale(.96)}
  .pcard.rp .pk-date small{color:#3b63d9}
  .rp-foot{display:flex;align-items:center;gap:8px;padding:8px 12px 9px 10px;border-top:1px solid #eef0f5;background:#fafbfd}
  .rp-sts{display:flex;flex-wrap:wrap;gap:5px;margin-right:auto;min-width:0}
  .rp-st{font-size:10.5px;font-weight:800;line-height:1.5;padding:2px 9px;border-radius:999px;background:#f1f3f8;color:#6a7080;white-space:nowrap}
  .rp-st.ok{background:#e2f7ec;color:#0a9a54}
  .rp-st.ng{background:#ffe9ec;color:#e0405a}
  .rp-swl{font-size:10.5px;font-weight:800;color:#0a9a54;white-space:nowrap}
  .rp-sw{position:relative;width:50px;height:30px;border-radius:999px;background:#c3c8d4;flex-shrink:0;transition:background .15s}
  .rp-sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.22);transition:left .15s}
  .rp-sw.on{background:var(--green)}
  .rp-sw.on i{left:23px}
  .pcard.rp.off{border-left-color:#c3c8d4}
  .pcard.rp.off .rp-main{opacity:.5}
  .pcard.rp.off .pk-date small,.pcard.rp.off .rp-swl{color:#8a90a0}
  .pk-pv{background:#fff3c9;color:#a8790a}
  .pk-due{background:rgba(255,255,255,.8);color:#6a7080;border:1px solid #d9eee3}
  .pcard.soon{border-left-color:#e0a814}
  .pcard.hot,.pcard.late{border-left-color:#e0405a}
  .pcard.late{background:#fff5f6}
  .pcard.paid{border-color:#c9f0dc;border-left-color:var(--green);background:linear-gradient(135deg,#e7f9f0 0%,#f2fdf8 60%,#fffbe8 100%)}
  .pk-date{width:60px;flex-shrink:0;text-align:center}
  .pk-date b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
  .pk-date small{display:block;font-size:10px;font-weight:800;color:var(--sub);margin-top:2px;white-space:nowrap}
  .pcard.soon .pk-date b,.pcard.soon .pk-date small{color:#c98a2f}
  .pcard.hot .pk-date b,.pcard.hot .pk-date small,.pcard.late .pk-date b,.pcard.late .pk-date small{color:#e0405a}
  .pcard.paid .pk-date b{
    width:30px;height:30px;border-radius:50%;margin:0 auto;color:#fff;font-size:16px;
    background:linear-gradient(135deg,var(--green),var(--teal));
    display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(11,193,103,.3);
  }
  .pcard.paid .pk-date small{color:#0a9a54}
  .pk-main{flex:1;min-width:0}
  .pk-ttl{display:block;font-weight:800;font-size:15.5px;line-height:1.35;word-break:break-word}
  .pk-sub{font-size:11.5px;color:#5a6378;font-weight:700;margin-top:1px;word-break:break-word}
  .pk-yen{flex-shrink:0;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
  .pk-yen small{font-size:10px;margin-left:1px}
  .pcard.paid .pk-yen{color:#0a9a54}
  .pmore{
    width:100%;margin-top:10px;padding:10px 12px;border-radius:14px;background:#f1f3f8;
    color:#4a4f5e;font-weight:800;font-size:12.5px;text-align:left;
  }
  /* 「✓払った」を押すと出る：払った日を選ぶ箱 */
  .pdbox{background:#e7f9f0;border:1.5px solid var(--green);border-radius:18px;padding:12px}
  .pdbox .pd-h{display:flex;align-items:center;font-weight:800;font-size:15px;color:#0a9a54}
  .pdbox .pd-h button{margin-left:auto;width:30px;height:30px;border-radius:50%;background:#fff;color:#6a7080;font-weight:800;font-size:13px}
  .pd-chips{display:flex;gap:8px;margin-top:9px}
  .pd-chips button{
    flex:1;min-width:0;padding:9px 4px 10px;border-radius:14px;background:#fff;border:1.5px solid #bfe9d3;
    color:#0a9a54;font-weight:800;font-size:11.5px;text-align:center;box-shadow:0 4px 10px rgba(11,193,103,.12);
  }
  .pd-chips button:active{transform:scale(.97)}
  .pd-chips button b{display:block;font-size:20px;color:#1a1c22;font-variant-numeric:tabular-nums;line-height:1.25}
  .pd-o{display:flex;gap:8px;margin-top:9px;align-items:center}
  .pd-o input{flex:1;min-width:0}
  .pd-o button{
    flex-shrink:0;padding:11px 14px;border-radius:12px;color:#fff;font-weight:800;font-size:13px;
    background:linear-gradient(135deg,var(--green),var(--teal));
  }
  .paid-banner{
    background:linear-gradient(135deg,var(--green),var(--teal));color:#fff;font-weight:800;
    border-radius:14px;padding:9px 14px;text-align:center;box-shadow:0 6px 16px rgba(11,193,103,.3);
  }
  /* 今月どこまで払ったかのバー */
  .payprog{background:var(--card);border-radius:18px;padding:12px 14px;margin:2px 0 10px;box-shadow:0 6px 18px rgba(30,40,70,.07)}
  .payprog.all{background:linear-gradient(135deg,#e7f9f0,#fff3c9)}
  .payprog .pp-h{display:flex;align-items:baseline;gap:6px;font-weight:800}
  .payprog .pp-n{font-size:26px;color:var(--green);font-variant-numeric:tabular-nums;line-height:1.2}
  .payprog .pp-t{font-size:12px;color:var(--sub)}
  .payprog .pp-bar{height:10px;border-radius:99px;background:#eef0f5;overflow:hidden;margin-top:6px}
  .payprog .pp-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--teal))}
  .payprog .pp-s{font-size:11.5px;color:var(--sub);font-weight:700;margin-top:6px}
  /* 🎯 今の的／次の一手（GMO夢アプリのADHD版）：的は3つまで・一手は1行・押すだけ */
  .am-card{background:var(--card);border-radius:18px;padding:12px 14px;margin-top:9px;box-shadow:0 6px 18px rgba(30,40,70,.07);border:1px solid var(--line)}
  .am-head{display:flex;align-items:center;gap:8px;width:100%;text-align:left}
  .am-head .cdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .am-t{flex:1;min-width:0;font-weight:800;font-size:15px;word-break:break-word}
  .am-left{flex-shrink:0;font-size:11px;font-weight:800;color:var(--sub);background:#f1f3f8;border-radius:999px;padding:2px 9px;white-space:nowrap}
  .am-left.hot{color:#c98a2f;background:#fff7e8}
  .am-left.over{color:#e0405a;background:#fff0f2}
  .am-nx{display:block;width:100%;text-align:left;margin-top:9px;padding:9px 12px;border-radius:14px;background:#f4fdf8;border:1px solid #c9f0dc;font-weight:700;font-size:14px;word-break:break-word}
  .am-nx small{display:block;font-size:10px;font-weight:800;letter-spacing:.12em;color:#0a9a54;margin-bottom:1px}
  .am-nx.empty{background:#fff;border:2px dashed #c9cdd8;color:#8a90a0}
  .am-nx.empty small{color:var(--sub)}
  .am-done{
    display:block;width:100%;margin-top:9px;padding:12px;border-radius:16px;color:#fff;font-weight:800;font-size:15px;letter-spacing:.12em;

<script>
'use strict';
/* 起動の見える化：エラーが出たら白い画面のままにせず、その文を出す（別の端末で開けない時の手がかり） */
(function(){
  const show=(msg)=>{try{const b=document.getElementById('bootmsg');if(!b)return;b.style.display='flex';b.dataset.err='1';
    document.getElementById('bootmsgT').textContent='起動でつまずいた';
    const s=document.getElementById('bootmsgS');s.style.cssText='font-size:12px;color:#e0405a;font-weight:700;word-break:break-all;max-width:92vw';s.textContent=String(msg).slice(0,400);
    if(!document.getElementById('bootmsgR')){const r=document.createElement('button');r.id='bootmsgR';r.textContent='再読み込み';r.style.cssText='margin-top:8px;padding:12px 22px;border-radius:14px;border:0;background:#0bc167;color:#fff;font:800 15px inherit';r.onclick=()=>location.reload();b.appendChild(r);}}catch(e){}};
  window.addEventListener('error',e=>{show((e&&e.message)||'error');});
  window.addEventListener('unhandledrejection',e=>{show((e&&e.reason&&(e.reason.message||e.reason))||'rejection');});
  setTimeout(()=>{try{const b=document.getElementById('bootmsg');if(b&&b.style.display!=='none'&&!b.dataset.err){document.getElementById('bootmsgT').textContent='まだ読み込み中…';document.getElementById('bootmsgS').textContent='回線が遅いか、どこかで止まっている。10秒待っても変わらなければ再読み込み';
    const r=document.createElement('button');r.textContent='再読み込み';r.style.cssText='margin-top:8px;padding:12px 22px;border-radius:14px;border:0;background:#0bc167;color:#fff;font:800 15px inherit';r.onclick=()=>location.reload();b.appendChild(r);}}catch(e){}},10000);
})();
/* ページ言語を日本語に固定（時刻ピッカー等の純正部品が英語表示になるのを防ぐ） */
try{document.documentElement.lang='ja';}catch(e){}
/* ===================== 基本 ===================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const YOBI=['日','月','火','水','木','金','土'];
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return fmt(d);};
const todayStr=()=>fmt(new Date());

/* ===================== 状態 ===================== */
const DEF_DREAM={name:'',due:'',ts:0};
const emptyState=()=>({updatedAt:0,dream:{...DEF_DREAM},entries:{},plans:{},ai:{},dreams:{},memos:{},life:null,photos:{},pha:{},pays:{},rules:{},aims:{},moves:{}});

/* GMO夢アプリからの移植データ（本人が2026-08-26に入力した夢21個＋究極の目標）。ts固定＝何度合流しても同じ・本人の編集が常に勝つ */
const DSEED={};   /* 夢の初期データはクラウド側にある（公開版には入れない） */

/* 夢手帳（熊谷式・公式マニュアル準拠）：6分野と3層 */
const CATS=[
  {id:1,n:'健康（美容）',c:'#3ec97e'},
  {id:2,n:'心・精神',c:'#9b6ef3'},
  {id:3,n:'教養・知識',c:'#4d7dff'},
  {id:4,n:'プライベート・家庭',c:'#ff8f4d'},
  {id:5,n:'社会・仕事',c:'#ff6b81'},
  {id:6,n:'経済（物・お金）',c:'#e0a814'}
];
const LEVELS=[
  {n:'結果レベル',cats:[6],hint:'結果としてお金がついてくる'},
  {n:'実現レベル',cats:[4,5],hint:'仕事と家庭の夢が実現する'},
  {n:'基礎レベル',cats:[1,2,3],hint:'健康・心・教養の土台'}
];
let state=emptyState();
const LS='nippo10-state',LSUI='nippo10-ui';
let SEED=null;

let PHSEED=null;

const ALBUM_URL='';
const PHDATES={}; /* 日付→旧写真の枚数（アルバムへの案内表示用・10KB） */
/* クラウド保存されたデータ本体。チェックポイント保存のたびに、この行が最新データに差し替わる。
   マーカーコメントは差し替えの目印なので絶対に変えないこと */
/*CSTATE*/let CSTATE=null;/*CSTATE-END*/

let ui={date:todayStr(),tab:'di'};
try{const u=JSON.parse(sessionStorage.getItem(LSUI)||'null');if(u&&u.date)ui=u;}catch(e){}
/* 前回「今日」を見ていて、日付が変わっていたら新しい今日へ（読み直しで昨日のまま止まらない）。わざと過去の日を見ていた時は動かさない */
if(ui.ld&&ui.ld!==todayStr()&&ui.date===ui.ld){ui.date=todayStr();ui.tab='di';}
if(ui.date<addDays(todayStr(),-3650)||!/^\d{4}-\d{2}-\d{2}$/.test(ui.date))ui.date=todayStr();

let artifactNS=undefined; // undefined=未確認 null=なし
let localOnly=false,unsynced=false,pubTimer=null,failCount=0,localSaveFail=false;
let expanded={};   // 畳んだ時間帯の展開状態（セッション内のみ）

function saveUI(){try{ui.ld=todayStr();sessionStorage.setItem(LSUI,JSON.stringify(ui));}catch(e){}}   /* ld＝保存した時の「今日」 */
/* 端末保存の写真置き場（1枚ずつ別キー）から写真をstateへ戻す */
function attachPhotos(st){
  try{
    st.photos=st.photos||{};
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.indexOf('nippo10-ph2-')===0){
        const id=k.slice('nippo10-ph2-'.length);
        if(!st.photos[id]){const v=localStorage.getItem(k);if(v)st.photos[id]=v;}
      }
    }
  }catch(e){}
}
/* ===== 写真の置き場＝IndexedDB =====================================
   localStorageは1サイト約5MBしか無く、写真（1枚200-300KB）ですぐ天井に当たる＝これが容量不足の正体。
   IndexedDBは桁違いに大きいので、写真はこちらへ。localStorageには本文（940日でも0.7MB）だけを置く。
   写真はクラウド(CSTATE)にも入っているので、IDBへ書けた分だけlocalStorageから外して空きを作る */
const IDB={db:null,ok:false,tried:false,saved:{}};
function idbOpen(){
  return new Promise(res=>{
    if(IDB.db)return res(IDB.db);
    if(IDB.tried)return res(IDB.db);
    IDB.tried=true;
    let done=false;
    const fin=v=>{if(!done){done=true;res(v);}};
    try{
      if(!window.indexedDB)return fin(null);
      const rq=indexedDB.open('nippo10',1);
      rq.onupgradeneeded=()=>{try{const d=rq.result;if(!d.objectStoreNames.contains('ph'))d.createObjectStore('ph');}catch(e){}};
      rq.onsuccess=()=>{
        try{
          IDB.db=rq.result;
          if(done){
            /* 待ち切れず先へ進んだ後で開いた場合：写真を取り戻してから書き込み先をIDBへ切り替える */
            idbLoadAll(state).then(n=>{IDB.ok=true;if(n){try{render();}catch(e){}saveLocal(false);}},()=>{IDB.ok=true;});
          }else IDB.ok=true;
        }catch(e){}
        fin(IDB.db);
      };
      rq.onerror=()=>fin(null);
      rq.onblocked=()=>fin(null);
      setTimeout(()=>fin(IDB.db),6000);   /* 応答しない環境でも起動を止めない */
    }catch(e){fin(null);}
  });
}
function idbPut(id,val){
  return new Promise(res=>{
    if(!IDB.db)return res(false);
    try{
      const tx=IDB.db.transaction('ph','readwrite');
      tx.objectStore('ph').put(val,id);
      tx.oncomplete=()=>res(true);
      tx.onerror=()=>res(false);
      tx.onabort=()=>res(false);
    }catch(e){res(false);}
  });
}
/* IDBの写真を本体データへ戻す（起動時） */
function idbLoadAll(st){
  return new Promise(res=>{
    if(!IDB.db)return res(0);
    let done=false,n=0;
    const fin=v=>{if(!done){done=true;res(v);}};
    setTimeout(()=>fin(n),6000);   /* 応答が返らない時に起動が止まらないための脱出路（これが無いと永久に開かない） */
    try{
      st.photos=st.photos||{};
      const tx=IDB.db.transaction('ph','readonly');
      const rq=tx.objectStore('ph').openCursor();
      rq.onsuccess=()=>{
        const cur=rq.result;
        if(!cur)return fin(n);

/* マージ：同じ項目は新しいタイムスタンプが勝つ。削除跡も残すので復活しない */
function mergeStates(a,b){
  const out=emptyState();
  out.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);
  out.dream=(b.dream&&(!(a.dream)||((b.dream.ts||0)>(a.dream.ts||0))))?b.dream:(a.dream||{...DEF_DREAM});
  for(const src of[a,b]){
    for(const d in (src.entries||{})){out.entries[d]=out.entries[d]||{};
      for(const h in src.entries[d]){const cur=out.entries[d][h],nu=src.entries[d][h];
        if(!cur||((nu.ts||0)>(cur.ts||0)))out.entries[d][h]=nu;}}
    for(const d in (src.plans||{})){out.plans[d]=out.plans[d]||{};
      for(const id in src.plans[d]){const cur=out.plans[d][id],nu=src.plans[d][id];
        if(!cur||((nu.ts||0)>(cur.ts||0)))out.plans[d][id]=nu;}}
    for(const d in (src.ai||{})){const cur=out.ai[d],nu=src.ai[d];
      if(!cur||((nu.ts||0)>(cur.ts||0)))out.ai[d]=nu;}
    for(const id in (src.dreams||{})){const cur=out.dreams[id],nu=src.dreams[id];
      if(!cur||((nu.ts||0)>(cur.ts||0)))out.dreams[id]=nu;}
    for(const id in (src.memos||{})){const cur=out.memos[id],nu=src.memos[id];
      if(!cur||((nu.ts||0)>(cur.ts||0)))out.memos[id]=nu;}
    /* 支払い：1件ずつ新しい方が勝つ。ただし「払った」の印(done)と払った日(pd)は巻き戻さない。
       新しい方が未払いで、古い方が払い済みなら、払った印を新しい方へ足す（払ったを取り消す機能は無い＝払った印は増えるだけ）。
       別の端末で毎月払いを直した時の「翌月以降への反映」が、こちらの払った記録を未払いへ戻すのを防ぐ（2026-09-30レビュー指摘） */
    for(const id in (src.pays||{})){const cur=out.pays[id],nu=src.pays[id];
      if(!nu)continue;
      if(!cur){out.pays[id]=nu;continue;}
      const win=((nu.ts||0)>(cur.ts||0))?nu:cur,lose=(win===nu)?cur:nu;
      /* 新しい方が未払い・古い方が払い済み：払った事実（金額・支払日・方法・口座・何月分・払った日）は払った側のまま残す。
         名前・メモ・区分・毎月の印だけ、新しい方の直しを採る（2026-10-03レビュー指摘：前は払った印と払った日しか残さず、金額などが未払い版に置き換わった） */
      if(lose.done&&!win.done){   /* 勝った側が「未払いのまま消した印」でも、払った記録は消さない（翌月分の番号を2台で同じにした事で起こり得るようになった経路をふさぐ） */
        const m={...lose,ts:win.ts};
        for(const f of ['c','n','memo','en','rep','yr','dd','d31']){if(win[f]===undefined)delete m[f];else m[f]=win[f];}
        out.pays[id]=m;
      }else out.pays[id]=win;}
    for(const d in (src.rules||{})){const cur=out.rules[d],nu=src.rules[d];
      if(!cur||((nu.ts||0)>(cur.ts||0)))out.rules[d]=nu;}
    /* 🎯今の的（夢ごとの仕分けと次の一手）と、やった一手の記録。どちらも1件ずつ新しい方が勝つ */
    for(const id in (src.aims||{})){const cur=out.aims[id],nu=src.aims[id];
      if(nu&&(!cur||((nu.ts||0)>(cur.ts||0))))out.aims[id]=nu;}
    for(const id in (src.moves||{})){const cur=out.moves[id],nu=src.moves[id];
      if(nu&&(!cur||((nu.ts||0)>(cur.ts||0))))out.moves[id]=nu;}

    for(const k in (src.payrep||{})){const nu=src.payrep[k];if(!nu)continue;

    /* 📚 ルーティン（rtn）とその記録（rlog）。1件ずつ新しい方が勝つ。使うまで項目を作らない */
    for(const k of ['rtn','rlog','payppl','kinds','tools'])for(const id in (src[k]||{})){   /* kinds／tools＝行の種類・道具（c1.1） */const nu=src[k][id];if(!nu)continue;
      out[k]=out[k]||{};const cur=out[k][id];if(!cur||((nu.ts||0)>(cur.ts||0)))out[k][id]=nu;}
    for(const id in (src.pins||{})){const nu=src.pins[id];if(!nu)continue;

    /* 🎯 手順（1個ずつ新しい方が勝つ。消した印も残すので復活しない）。pins と同じく、使うまでは項目を作らない。
       「やった」の印(d)だけは専用の時刻(dts)で比べる＝別の端末で文を直しても、やった印は巻き戻らない（2026-09-30レビュー指摘） */
    for(const id in (src.steps||{})){const nu=src.steps[id];if(!nu)continue;

      if(!cur){out.steps[id]=nu;continue;}
      let w=((nu.ts||0)>(cur.ts||0))?nu:cur;const o=(w===nu)?cur:nu;
      if((o.dts||0)>(w.dts||0))w=Object.assign({},w,{d:o.d,dts:o.dts});
      out.steps[id]=w;}
    for(const id in (src.photos||{})){if(!out.photos[id])out.photos[id]=src.photos[id];}
    for(const id in (src.pha||{})){if(!out.pha[id]&&src.pha[id])out.pha[id]=src.pha[id];}   /* 写真倉庫の番号は和集合＝絶対に落とさない */

  /* 知らないトップレベル項目も捨てない（新旧バージョン混在でもデータを失わない） */
  /* payrep も必ずここに入れる。入れ忘れると、下の「知らない項目」の写しが、1件ずつ合わせた結果を丸ごと上書きする
     ＝別の端末で止めた・再開した印が消える（2026-09-30レビュー指摘） */
  const known={updatedAt:1,dream:1,entries:1,plans:1,ai:1,dreams:1,memos:1,life:1,photos:1,pha:1,pays:1,rules:1,aims:1,moves:1,pins:1,steps:1,payrep:1,rtn:1,rlog:1,payppl:1,kinds:1,tools:1};
  const newer=((b.updatedAt||0)>=(a.updatedAt||0))?b:a;
  const older=(newer===b)?a:b;
  for(const k in older)if(!known[k]&&older[k]!==undefined)out[k]=older[k];
  for(const k in newer)if(!known[k]&&newer[k]!==undefined)out[k]=newer[k];
  return out;
}

/* 既に取り込んだ写真を後から軽くする（本人が設定で押した時だけ実行＝勝手に画質は落とさない） */
function reCompress(dataURL,maxpx,q){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const s=Math.min(1,maxpx/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.width*s));
        c.height=Math.max(1,Math.round(img.height*s));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        const du=c.toDataURL('image/jpeg',q);
        try{c.width=c.height=0;}catch(e){}   /* canvasのメモリを明示的に手放す */
        /* 出来上がりを画像として読み直して検証（真っ白・壊れた物を採用しない） */
        const v=new Image();
        v.onload=()=>{(v.naturalWidth>=200&&v.naturalHeight>=200)?res(du):rej(new Error('blank'));};
        v.onerror=()=>rej(new Error('verify'));
        v.src=du;
      }catch(e){rej(e);}
    };
    img.onerror=()=>rej(new Error('img'));
    img.src=dataURL;
  });
}

function autoShrinkIfHeavy(){
  try{
    if(sessionStorage.getItem('nippo10-autoshrink'))return;
    /* 倉庫が使えるか未確認、または倉庫への引っ越し中は、劣化させる前にそちらへ任せる（5秒おきに再判定） */
    if(!localOnly&&(assetsNS===undefined||PHUP.busy)){setTimeout(autoShrinkIfHeavy,5000);return;}
    let sz=0;for(const id in (state.photos||{}))if(!(state.pha&&state.pha[id]))sz+=(state.photos[id]||'').length;
    if(sz<8e6)return;
    if($('ovl').classList.contains('open')||$('page').classList.contains('open')||Date.now()-LASTACT<5000){setTimeout(autoShrinkIfHeavy,15000);return;}
    try{sessionStorage.setItem('nippo10-autoshrink','1');}catch(e){}
    toast('📉 写真が'+(sz/1e6).toFixed(0)+'MBで保存が重いので、自動で軽くする');
    shrinkPhotos({auto:true});
  }catch(e){}
}
async function shrinkPhotos(opt){
  const auto=!!(opt&&opt.auto);
  const MAXPX=600,Q=0.5;
  if(shrinkBusy){if(!auto)toast('いま軽くしている最中だ');return;}
  const ids=Object.keys(state.photos||{}).filter(id=>!(state.pha&&state.pha[id]));   /* 倉庫送り済みは触らない */
  if(!ids.length){toast('軽くする写真がない');return;}
  shrinkBusy=true;
  try{
    toast('📉 '+ids.length+'枚を軽くしている…');
    /* 全部できてから一括で差し替える（途中の失敗で写真が壊れたまま残らないように） */
    const out={};let before=0,after=0,n=0;
    for(const id of ids){
      const src=state.photos[id];
      if(typeof src!=='string'||src.indexOf('data:')!==0)continue;
      before+=src.length;after+=src.length;
      try{
        const nu=await reCompress(src,MAXPX,Q);
        /* 小さすぎる＝失敗（真っ白など）。安全側に倒して元の写真を残す */
        if(nu&&nu.length>20000&&nu.length<src.length*0.9){out[id]=nu;n++;after+=nu.length-src.length;}
      }catch(e){}
    }
    if(!n){toast('これ以上は軽くできない');return;}
    if(after<before*0.2){toast('⚠ 結果が異常に小さい。安全のため元のままにした');return;}
    for(const id in out){
      state.photos[id]=out[id];
      try{localStorage.removeItem('nippo10-ph2-'+id);}catch(e){}   /* 旧サイズの控えを外す（次の保存で新版が入る） */
    }
    state.updatedAt=Date.now();
    IDB.saved={};                                  /* 軽くした版でIDBを置き換える */
    permFail=false;failCount=0;pubCoolUntil=0;     /* 容量超過で止めていた自動送信を、軽くした今こそ再開させる */
    saveLocal(false);pendingCkpt=true;render();renderSync();
    toast('📉 '+n+'枚を軽くした（'+(before/1e6).toFixed(1)+'MB→'+(after/1e6).toFixed(1)+'MB）。クラウドへ送るので一度画面が読み直される');
    if(auto)schedulePublish(3000);                                   /* 自動時は普段の送信ルール（書いてる最中は待つ） */
    else setTimeout(()=>{if(unsynced&&!localOnly)doPublish(true);},1500);
  }finally{shrinkBusy=false;}
}
function phCompress(file){
  return new Promise((res,rej)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      try{
        const s=Math.min(1,640/Math.max(img.width,img.height));  /* 容量対策：長辺760px（原本はスマホの写真アプリに残る） */
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.width*s));
        c.height=Math.max(1,Math.round(img.height*s));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        const dataURL=c.toDataURL('image/jpeg',0.55);
        URL.revokeObjectURL(url);res(dataURL);
      }catch(e){URL.revokeObjectURL(url);rej(e);}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'));};
    img.src=url;
  });
}
async function phAddFiles(files){
  const ids=[];
  for(const f of Array.from(files).slice(0,6)){
    try{
      const dataURL=await phCompress(f);
      const id=String(Date.now())+Math.floor(Math.random()*1e5);
      PH.mem[id]=dataURL;ids.push(id);
    }catch(e){toast('この写真は読めなかった');}
  }
  return ids;
}

// ===【保存方式v2（v1.23〜）】=================================================
// 旧方式（data/state.jsonをfiles形式でpublish）は2026-08-26頃にプラットフォーム側で
// 無効化された（capability_disabled: publishing files is not available in this view）。
// 新方式＝チェックポイント保存：自分のソースを取得し、CSTATEマーカー行に現在のデータを
// 埋め込み、ページ丸ごと新版としてpublish。成功するとこのビューは新版へリロードされる。
// だから毎編集では送らず、(1)アプリを離れた時 (2)3分操作なし (3)クラウド保存ボタン、で送る。
// 端末保存（localStorage）は今まで通り毎編集で即時。 =============================
let PUBERR='';       // 直近のクラウド保存エラー（診断表示用・端末に永続）
let BOOTLOG='';      // 起動時にクラウド/端末のデータをどう読めたか（診断表示用）
let pendingReload=false;
let pubBusy=false,pubAgain=false;   // publishの多重実行防止（自作自演conflictを避ける）
let pubCoolUntil=0;                 // rate_limited後の冷却期間
let permFail=false;                 // 恒久エラー＝自動再送停止（☁ボタンで解除）
let VERSFAIL=false,VERS_MEM=[];     // 版ID台帳の書込失敗フラグと、セッション内の予備台帳
let useTries=0;                     // claude.use('artifact')がnullだった回数（数回は再挑戦する）
let LASTACT=Date.now();             // 最後にユーザーが触った時刻（アイドル判定用）
let pubStartedAt=0;                 // 送信開始時刻（固まり検知＝2.5分で強制復帰）
let unsyncedSince=0;                // 未同期が始まった時刻（15分たまったら操作中でも送る）
try{PUBERR=localStorage.getItem('nippo10-puberr')||'';}catch(e){}
/* 待ちっぱなし防止：一定時間で必ず答えを出す（遅れて本物が成功した場合はconflict処理が拾う） */
function withTimeout(p,ms,tag){
  return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout',message:tag}),ms))]);
}
/* 埋め込み用にJSONをscriptタグ内でも安全な形にする（本文にタグ終了文字列があっても壊れない）。
   本文にマーカー文字列そのものが書かれても差し替え処理が誤爆しないよう、CSTATEのCをCに逃がす
   （JS評価でもJSON.parseでも元の文字に戻る） */
function jsSafe(s){
  s=s.replace(/\/\*CSTATE/g,'/*\\u0043STATE');
  return s.replace(/<\//g,'<\\/').replace(/<!--/g,'<\\u0021--')
          .replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
}

/* 💴支払い登録シートの書きかけ（入力欄＋選んだチップ）。シートが開いている間だけ paySnap が内容を返す。
   クラウド保存の読み直しでシートが閉じられても、起動時に同じ内容でシートを開き直す（2026-09-29レビュー指摘：
   支払いを続けて登録している最中に保存が走ると、次の入力が読み直しで閉じられる）。
   端末保存にも置くので、クラッシュしても10分以内なら戻る。それより古い分はメモへ移す（消さない） */
var paySnap=null;
function payDraftSave(){
  try{
    if(!paySnap)return;
    const j=JSON.stringify(paySnap());
    sessionStorage.setItem('nippo10-paydraft',j);
    try{localStorage.setItem('nippo10-paydraft-ls',j);}catch(e2){}
  }catch(e){}
}
function payDraftClear(){
  paySnap=null;
  try{sessionStorage.removeItem('nippo10-paydraft');}catch(e){}
  try{localStorage.removeItem('nippo10-paydraft-ls');}catch(e){}
}
/* チップのタップは input イベントが出ないので、タップ・入力・変更のたびに退避する（処理後の値を拾うため一拍おく） */
['click','input','change'].forEach(ev=>document.addEventListener(ev,()=>{if(paySnap)setTimeout(payDraftSave,0);},true));

/* リロードを跨ぐ命綱：publish直前と画面離脱時にstateをsessionStorageへ退避（契約の指定パターン） */
function stashState(){
  try{sessionStorage.setItem('nippo10-esc',JSON.stringify({state,t:Date.now()}));}
  catch(e){
    try{
      const slim=JSON.parse(JSON.stringify(state));slim.photos={};
      sessionStorage.setItem('nippo10-esc',JSON.stringify({state:slim,t:Date.now()}));
    }catch(e2){}

}
/* 書きかけの退避。リロード・クラッシュが来ても文章を失わない。
   記録シート本文とメモは形付きで、それ以外（予定・移動ルート・夢・設定など）の入力欄は総ざらいで拾う */
function writeDraft(){
  try{
    const d={t:Date.now()};
    const ta=$('shTa');
    /* 「ここでやったこと」の行も、文字にして一緒に退避する（本文が空でも、やったことだけ書いてあれば拾う） */
    let ax='';
    try{if(sheetSt&&sheetSt.kind==='entry'&&typeof sheetSt.actsText==='function'&&$('acRows'))ax=sheetSt.actsText()||'';}catch(e0){}
    if(sheetSt&&sheetSt.kind==='entry'&&ta&&(ta.value.trim()||ax)){
      d.entry={date:sheetSt.date,key:sheetSt.key,hour:sheetSt.hour,text:ta.value,acts:ax,place:($('shPlace')?$('shPlace').value:'')};
      /* 移動の経路（本人が書いた時だけ。アプリが先に入れただけの青い欄は拾わない） */
      try{const mvE=$('mvRt'),mvOn=$('secMove')&&$('secMove').style.display!=='none';
        if(mvE&&mvOn&&!mvE.classList.contains('auto')){const r=mvE.value.replace(/\s*→\s*$/,'').trim();if(r)d.entry.rt=r;}}catch(e1){}
    }
    const mta=$('mTa');
    if(pageMode==='memoEd'&&mta&&mta.value.trim())d.memo={text:mta.value};
    payDraftSave();   /* 支払いシートは専用の退避で丸ごと戻す（下の総ざらいでメモに断片を作らない） */
    if(!d.entry&&!d.memo&&!paySnap){
      const box=$('ovl').classList.contains('open')?$('sheet'):($('page').classList.contains('open')?$('page'):null);
      if(box){
        const vals=[...box.querySelectorAll('textarea,input[type="text"]')]
          .filter(el=>!(el.id==='mvRt'&&el.classList.contains('auto')))   /* アプリが先に入れただけの「前の場所 → 」は書きかけではない（ゴミのメモを作らない） */
          .map(el=>el&&el.value?el.value.trim():'').filter(v=>v.length>1);
        if(vals.length)d.other={text:vals.join('\n')};
      }
    }
    const has=d.entry||d.memo||d.other;
    const j=has?JSON.stringify(d):null;
    if(j){sessionStorage.setItem('nippo10-draft',j);try{localStorage.setItem('nippo10-draft-ls',j);}catch(e2){}}
    else{sessionStorage.removeItem('nippo10-draft');try{localStorage.removeItem('nippo10-draft-ls');}catch(e2){}}
  }catch(e){}
}
/* 入力中も1秒おきに退避（前面のままのクラッシュ・電池切れ対策。退避先は端末保存＝再起動でも残る） */

/* 保存成功した版IDを端末に台帳として残す（データがどの版にあるか、後から必ず追える） */
function noteVersion(v){
  if(!v)return;
  VERS_MEM.push({v:String(v),t:Date.now()});   // 端末に書けなくてもセッション内では必ず覚えておく
  try{
    const arr=JSON.parse(localStorage.getItem('nippo10-vers')||'[]');
    if(!arr.length||arr[arr.length-1].v!==v)arr.push({v:String(v),t:Date.now()});
    while(arr.length>50)arr.shift();
    localStorage.setItem('nippo10-vers',JSON.stringify(arr));
    VERSFAIL=false;
  }catch(e){VERSFAIL=true;}
}
/* チェックポイント保存用：自分のソースを取得し、CSTATE行に現在のデータを埋め込んだHTMLを作る。
   ソースは版が変わらない限り不変なのでセッション内でキャッシュ（保存成功後はリロードされるので古くならない） */
let SELF_SRC=null;
async function buildSelfHtml(){
  if(!SELF_SRC){
    for(const p of ['','.','index.html']){
      try{
        const ac=('AbortController' in window)?new AbortController():null;
        const tm=ac?setTimeout(()=>{try{ac.abort();}catch(e2){}},45000):null;
        const r=await fetch(p,ac?{cache:'no-store',signal:ac.signal}:{cache:'no-store'});
        const t=r.ok?await r.text():null;
        if(tm)clearTimeout(tm);
        if(t&&t.indexOf('/*CSTATE*/')>=0){SELF_SRC=t;break;}
      }catch(e){}
    }
  }
  if(!SELF_SRC)return null;
  const a=SELF_SRC.indexOf('/*CSTATE*/'),b=SELF_SRC.indexOf('/*CSTATE-END*/');
  if(a<0||b<=a)return null;
  return SELF_SRC.slice(0,a)+'/*CSTATE*/let CSTATE='+jsSafe(JSON.stringify(cloudView(state)))+';/*CSTATE-END*/'+SELF_SRC.slice(b+'/*CSTATE-END*/'.length);
}
/* conflict（別画面が先に保存）からの自己復帰：端末保存済みを確認してから読み直す。
   シェルが自動で最新版に切り替えるはずだが、来ない環境では自分でリロードして合流する */
function conflictHeal(){
  if(localSaveFail)return;               // 端末保存できていない時のリロードは絶対にしない（データが飛ぶ）
  let n=[];
  try{n=JSON.parse(sessionStorage.getItem('nippo10-crl')||'[]');}catch(e){}
  const now=Date.now();
  n=n.filter(t=>now-t<600000);
  if(n.length>=3){notePubErr('conflict','自動復帰3回失敗。ランプタップ→☁を押してくれ');return;}
  n.push(now);
  try{sessionStorage.setItem('nippo10-crl',JSON.stringify(n));}catch(e){}
  setTimeout(()=>{
    if(!unsynced||localSaveFail)return;  // その間に緑になった／端末保存が失敗に転じたなら触らない
    if($('ovl').classList.contains('open')||$('page').classList.contains('open')){pendingReload=true;toast('別画面の保存と合流するため、閉じたら読み直す');return;}
    writeDraft();stashState();location.reload();
  },4000);
}
/* シート/ページを閉じた時に、見送っていたクラウド保存やpendingReloadを消化する */
function maybePendingReload(){
  if(pendingCkpt&&unsynced&&!localOnly&&!permFail){pendingCkpt=false;schedulePublish(1500);}
  if(!pendingReload)return;
  pendingReload=false;
  setTimeout(()=>{
    if(!unsynced||localSaveFail)return;
    if($('ovl').classList.contains('open')||$('page').classList.contains('open')){pendingReload=true;return;}
    writeDraft();stashState();location.reload();
  },600);
}
/* 支払いページを開いている印（クラウド保存→読み直しの後で同じページへ戻すため）。閉じたら消す。2分で時効 */

function schedulePublish(ms){clearTimeout(pubTimer);pubTimer=setTimeout(doPublish,ms||2000);}
let pendingCkpt=false;   // シート/ページを開いていて保存を見送った印（閉じた時に実行）
async function doPublish(force){
  if(pubBusy){pubAgain=true;return;}                 // 送信中の多重発射禁止（自作自演conflict防止）
  if(permFail)return;                                // 恒久エラー中は自動再送しない（☁ボタンで解除）
  if(Date.now()<pubCoolUntil){schedulePublish(pubCoolUntil-Date.now()+1500);return;}
  /* 暴走ブレーキ：10分間に6回以上保存していたら5分休む（何かがループしても版を乱造しない。端末保存は無傷） */
  if(VERS_MEM.filter(v=>Date.now()-v.t<600000).length>=6){
    notePubErr('cool','保存が頻発したため5分小休止（記録は端末に保存済み）');
    pubCoolUntil=Date.now()+300000;schedulePublish(302000);return;
  }
  /* 保存成功＝画面の読み直しなので、入力中は絶対に送らない。ただし記録し終えた直後は即送る（押して数秒で緑）。
     forceはアプリを離れる瞬間の保存（下書きは退避済みなので読み直されても失わない） */
  if(!force){
    /* 💴支払いページは文字入力の無い一覧なので、開いたままでも送る（支払いも日記と同じ「押して3秒」・本人指示 2026-09-29）。
       読み直し後は同じ支払いページへ戻す（payReopenMark→起動時に復帰）。入力シートが開いている間は従来どおり待つ */
    /* 🎯一手のページも同じ（文字入力はシート側）。ただし夢の仕分け中は、読み直しで流れを切らないよう待つ */
    if($('ovl').classList.contains('open')||($('page').classList.contains('open')&&!(pageMode==='pay'||pageMode==='rtn'||(pageMode==='aim'&&!aimSorting())))){pendingCkpt=true;return;}
    if(AIB.busy&&Date.now()-AIB.at<180000){pendingCkpt=true;schedulePublish(4000);return;}          /* AIが手順を考えている最中は待つ（読み直しで答えを捨てない・最長3分） */
    if(PHUP.busy&&Date.now()-PHUP.busyAt<120000){pendingCkpt=true;schedulePublish(4000);return;}   /* 写真の引っ越し中は待つ（最長2分） */  /* 入力シート/ページが開いている間は待つ */
    const idle=Date.now()-LASTACT;
    if(idle<2500){pendingCkpt=true;schedulePublish(2600-idle);return;}  /* 指が動いている間だけ短く待って必ず再挑戦 */
  }
  pubBusy=true;pubStartedAt=Date.now();
  try{
    if(!artifactNS){
      try{artifactNS=(window.claude&&window.claude.use)?await withTimeout(window.claude.use('artifact'),20000,'use'):null;}
      catch(e){artifactNS=undefined;notePubErr('use_throw',e&&e.message);schedulePublish(15000);return;}
      if(!artifactNS){
        useTries++;
        if(useTries<5){artifactNS=undefined;notePubErr('use_null','クラウド機能の準備待ち('+useTries+'/5)');renderSync();schedulePublish(8000*useTries);return;}
        localOnly=true;renderSync();greyNotice();return;
      }
      useTries=0;
    }
    if(!(state.updatedAt>0))return;                  // 本人入力ゼロ（シードのみ）は送らない
    const wasUnsynced=unsynced;
    const html=await buildSelfHtml();
    const sentAt=state.updatedAt;                    // 今回の便に載った版の印（送信中の追記を見分ける）
    if(!html){
      notePubErr('no_self_src','自分のソースを取得できない。電波を確認');
      failCount++;schedulePublish(Math.min(120000,10000*failCount));return;
    }
    /* 壊れた自分を公開しない：出荷前に埋め込みデータを読み戻して検品 */
    try{
      const A='/*CSTATE*/let CSTATE=',B=';/*CSTATE-END*/';
      const va=html.indexOf(A),vb=html.indexOf(B);
      const chk=JSON.parse(html.slice(va+A.length,vb));
      if(!chk||chk.updatedAt!==sentAt)throw 0;
    }catch(eV){
      notePubErr('build_corrupt','組み立てた保存データが壊れている。送信中止');
      failCount++;schedulePublish(Math.min(120000,10000*failCount));return;
    }
    /* 容量の安全弁：上限(16MB)の9割を超えたら送らず警告（記録は端末に安全） */
    if(html.length>14000000){
      permFail=true;renderSync();
      notePubErr('too_large','容量が上限に接近('+Math.round(html.length/1e6)+'MB)。写真整理が必要');
      toast('写真が多くて容量上限に近い。記録は端末に安全。写真の整理が要る');
      return;
    }
    /* 組み立てている間に入力シートが開かれたら、今回は送らない（閉じた時に送る） */
    if(!force&&$('ovl').classList.contains('open')){pendingCkpt=true;return;}
    stashState();writeDraft();                       // 保存成功後の読み直しに備えて先に退避（契約の指定パターン）
    payReopenMark();                                 // 支払いページを開いたままなら、読み直し後に同じページへ戻す
    let res;
    try{
      res=await withTimeout(artifactNS.publish(html),120000,'publish');
    }catch(e){
      const code=(e&&e.code)||'throw';
      notePubErr(code,e&&e.message);
      if(code==='rate_limited'){pubCoolUntil=Date.now()+75000;schedulePublish(80000);}
      else if(code==='conflict'){conflictHeal();}
      else if(code==='too_large'){permFail=true;renderSync();toast('データが大きすぎて送れない。設定→バックアップを保存してくれ');}
      else if(code==='invalid_content'||code==='transform_error'||code==='read_only_path'){permFail=true;renderSync();}
      else if(code==='not_granted'||code==='not_writer'||code==='not_declared'||code==='capability_disabled'||code==='capability_removed'||code==='consent_required'){
        localOnly=true;renderSync();
      }else{
        /* 一時障害：間隔を広げつつ諦めない（予約は常に1本＝schedulePublish経由） */
        failCount++;
        schedulePublish(Math.min(120000,10000*failCount)+Math.random()*5000);
      }
      return;
    }
    noteVersion(res&&res.version);
    try{localStorage.setItem('nippo10-pubsize',String(html.length));}catch(e){}  /* 診断用：クラウド保存サイズの実測 */
    try{sessionStorage.removeItem('nippo10-esc');}catch(e){}
    failCount=0;
    /* 送信中に新しい記録が増えていたら「同期済み」とは言わない＝すぐ次の便を出す */
    const clean=(state.updatedAt===sentAt);
    saveLocal(clean);
    if(clean&&PH.pending.length&&!localSaveFail){PH.pending=[];phSavePending();}
    if(!clean)schedulePublish(4000);
    else if(wasUnsynced)toast('🟢 クラウドに保存した');
    /* この後シェルがこのビューを新版へ読み直す。全データ保存済みなので安全 */
  }finally{
    pubBusy=false;
    if(pubAgain){pubAgain=false;if(unsynced)schedulePublish();}
  }
}
