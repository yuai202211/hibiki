<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>HIBIKI 日々記</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0bc167">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HIBIKI">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<style>
  html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  input,textarea,select{font-size:16px!important}
  :root{
    --out:#e9ebf1;
    --bg:#fafbfd;
    --card:#ffffff;
    --ink:#1a1c22;
    --sub:#8a90a0;
    --line:#edeff4;
    --green:#0bc167;
    --teal:#00d9a0;
    --pink:#ff6b81;
    --lemon:#fff3c9;
    --amber:#a8790a;
    --maru:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--out);
    font-family:var(--maru);
    display:flex;justify-content:center;
  }
  button,input,textarea{font-family:var(--maru);font-size:inherit;color:inherit}
  button{border:0;background:none;cursor:pointer}
  .app{
    width:100%;max-width:430px;height:100dvh;
    background:var(--bg);color:var(--ink);
    font-size:13.5px;line-height:1.6;font-weight:500;
    display:flex;flex-direction:column;overflow:hidden;
    position:relative;
  }
  @media (min-width:500px){
    body{align-items:center;padding:24px 0}
    .app{height:min(880px,calc(100dvh - 48px));border-radius:32px;box-shadow:0 24px 60px rgba(30,40,70,.18)}
  }

  .top{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 16px 2px;flex-shrink:0;gap:6px;
  }
  .datebar{display:flex;align-items:center;gap:6px;min-width:0}
  .datebar .chev{color:#c3c8d4;font-size:20px;padding:2px 7px;border-radius:10px}
  .datebar .chev:active{background:#eef0f5}
  .datebar .d{font-weight:800;font-size:22px;letter-spacing:.01em;white-space:nowrap}
  .datebar .yobi{
    font-size:11px;font-weight:700;color:#fff;background:var(--sub);
    border-radius:8px;padding:2px 8px;flex-shrink:0;
  }
  .datebar .yobi.sun{background:var(--pink)}
  .datebar .yobi.sat{background:#4d7dff}
  .datebar .yr{color:var(--sub);font-size:11px;font-weight:700;line-height:1}
  .hb-brand{display:flex;flex-direction:column;align-items:flex-start;gap:3px;flex-shrink:0;margin-right:2px}
  .hb-brand .hb-logo{font-size:11px;color:#0a9a54}
  .datebar .chev{padding:2px 5px}
  .todaybtn{
    font-size:11px;font-weight:800;color:var(--green);background:#e7f9f0;
    border-radius:999px;padding:3px 10px;flex-shrink:0;
  }
  .right-top{display:flex;align-items:center;gap:7px;flex-shrink:0;margin-left:auto}
  .top{flex-wrap:wrap;row-gap:4px}
  .streak{
    font-size:12px;font-weight:800;color:var(--pink);
    background:#ffeef1;border-radius:999px;padding:3px 10px;
    font-variant-numeric:tabular-nums;white-space:nowrap;
    cursor:pointer;
  }
  .syncdot{
    width:11px;height:11px;border-radius:50%;background:#c3c8d4;flex-shrink:0;
    cursor:pointer;border:none;padding:0;
  }
  .syncdot.ok{background:var(--green)}
  .syncdot.pending{background:#ffb02e}
  .syncdot.bad{background:#ff5a5a}
  .diagstrip{
    margin:4px 16px 0;padding:4px 10px;border-radius:10px;flex-shrink:0;
    background:#fff4e5;color:#a8790a;font-size:10.5px;line-height:1.5;text-align:left;
    word-break:break-all;max-height:46px;overflow:hidden;width:calc(100% - 32px);
  }
  .diagstrip.bad{background:#ffecec;color:#c43c3c}

  .dream{
    margin:8px 16px 0;flex-shrink:0;
    display:flex;align-items:center;gap:7px;min-width:0;width:calc(100% - 32px);
    background:var(--lemon);border-radius:999px;padding:6px 14px;
    font-size:12px;font-weight:700;color:var(--amber);text-align:left;
  }
  .dream .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
  .dream .cnt{flex-shrink:0;font-variant-numeric:tabular-nums}

  .now{
    margin:12px 14px 0;flex-shrink:0;
    background:var(--card);border-radius:24px;
    padding:14px 16px;box-shadow:0 10px 28px rgba(30,40,70,.10);
    display:flex;gap:14px;align-items:center;
  }
  .now.hidden{display:none}
  .now.mini{margin:6px 14px 0;padding:7px 8px 7px 10px;border-radius:16px;gap:8px;box-shadow:0 4px 12px rgba(30,40,70,.08);cursor:default}
  .now.mini .micbig,.now.mini .camsm,.now.mini .nh,.now.mini .hint{display:none}
  .now.mini .chips{margin-top:0}
  .now.mini .chip{padding:6px 12px}
  .now .nowx{
    display:none;width:30px;height:30px;border-radius:50%;background:#f1f3f8;color:#6a7080;font-size:13px;font-weight:800;
    flex-shrink:0;align-items:center;justify-content:center;align-self:flex-start;
  }
  .now.mini .nowx{display:flex}
  .now .nowx:active{background:#e2e6ef}
  .now .nownone{font-size:11.5px;color:var(--sub);font-weight:700}
  .micbig{
    width:58px;height:58px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(135deg,var(--green),var(--teal));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 18px rgba(11,193,103,.35);
  }
  .micbig svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}
  .now .right{flex:1;min-width:0}
  .now .nh{display:flex;align-items:center;gap:7px;font-weight:800;font-size:15.5px}
  .now .pulse{
    width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;
    animation:pu 1.6s ease-in-out infinite;
  }
  @keyframes pu{0%,100%{box-shadow:0 0 0 0 rgba(11,193,103,.35)}55%{box-shadow:0 0 0 7px rgba(11,193,103,0)}}
  @media (prefers-reduced-motion:reduce){.now .pulse{animation:none}}
  .now .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .camsm{
    width:44px;height:44px;border-radius:50%;background:#f1f3f8;
    font-size:20px;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;align-self:center;
  }
  .camsm:active{background:#e2e6ef}
  .chip{
    background:#f1f3f8;border-radius:999px;padding:4px 13px;
    font-size:12px;font-weight:700;color:#4a4f5e;
  }
  .chip:active{background:#e2e6ef}

  .seg{
    display:flex;justify-content:center;gap:6px;margin:12px 0 6px;
    font-size:11.5px;font-weight:700;flex-shrink:0;
  }
  .seg button{padding:4px 14px;border-radius:999px;color:var(--sub)}
  .seg button.on{background:var(--green);color:#fff}

  .pane{
    flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;
    padding:0 18px 10px;
  }
  .pane::-webkit-scrollbar{display:none}
  .scr{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;display:flex;flex-direction:column;overscroll-behavior:contain}
  .scr::-webkit-scrollbar{display:none}
  .scr>*{flex-shrink:0}
  .scr>.pane{flex:1 0 auto;min-height:0;overflow:visible}
  .seg{position:relative}.tlord{position:absolute;left:4px;top:50%;transform:translateY(-50%);font-size:10.5px;font-weight:800;color:#5b6475;background:#eef0f5;border-radius:999px;padding:3px 8px;cursor:pointer;white-space:nowrap}.tlord.on{background:#1f2430;color:#fff}
  .tlfold{width:100%;text-align:left}.tlfold .gp-l b{color:var(--ink)}.tlfold .tlf-g{font-size:11.5px;font-weight:800;color:#8a93a6;background:#eef0f5;border-radius:999px;padding:1px 8px;margin-left:6px}
  .pfoot{padding:0 18px calc(10px + env(safe-area-inset-bottom))}.pfoot:empty{display:none}
  body.grab,body.grab *{cursor:grabbing!important;user-select:none!important}

  .hour{
    display:flex;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);
    align-items:flex-start;min-height:42px;width:100%;text-align:left;
  }
  .hour .hh{
    font-variant-numeric:tabular-nums;color:#b8bdca;font-weight:700;
    width:44px;flex-shrink:0;font-size:12px;padding-top:2px;
  }
  .hour.filled .hh{color:var(--ink)}
  .hour .body{flex:1;min-width:0}
  .hour .loc{font-size:11px;color:var(--green);font-weight:800}
  .hour .txt{color:var(--ink);white-space:pre-wrap;word-break:break-word}
  .hour.gap .body{color:#ccd1dc;font-size:13px;font-weight:700}
  .hour.wr{
    position:sticky;top:0;z-index:3;background:#eefaf3;border-bottom:0;border-radius:14px;
    padding:6px 8px;margin-bottom:4px;box-shadow:0 4px 12px rgba(30,40,70,.08);align-items:center;cursor:pointer;
  }
  .hour.wr .wr-r{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .hour.wr .wr-b{
    width:34px;height:34px;border-radius:50%;background:#fff;color:#4a4f5e;font-size:15px;font-weight:800;
    display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(30,40,70,.10);
  }
  .hour.wr .wr-b:active{background:#e2e6ef}
  .hour.wr .wr-b.on{background:var(--green);color:#fff}
  .hour.wr .chip{white-space:nowrap;font-size:13.5px;font-weight:800;padding:9px 13px}
  .hour.wr .chip.slp{background:#f4f2ff}
  .hour.wr .body{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hour.wr .body{flex:0 0 auto;min-width:2.6em}
  .hour.wr .wr-r{gap:4px}.hour.wr .wr-r .chip.mvb.ic2{width:40px;height:40px;flex-direction:column;justify-content:center;gap:0;line-height:1.05;font-size:15px}.hour.wr .wr-r .chip.mvb.ic2 small{font-size:8.5px;font-weight:800;opacity:.85}
  .slpb2 .bed b,.slpb2 .bed b{margin-left:8px;background:#fff;border-radius:999px;padding:2px 8px;font-size:12px}.slpb2 .sb-ls{background:none;font:inherit;font-weight:800;padding:0;text-align:left}.slpb2 .sb-ls b{font-size:13.5px}.hour.wr .wr-r .chip.mvb{height:36px;padding:0 10px}.hour.wr .wr-r .chip.mvb.sr,.hour.wr .wr-r .chip.mvb.sp,.hour.wr .wr-r .chip.mvb.tel{width:36px;padding:0;justify-content:center}
  .hour.wr .hh{width:auto;min-width:0;margin-right:6px}.hour.wr .wr-r .chip.mvb{padding:0 6px;font-size:12.5px}.hour.wr{gap:3px}
  .slpb2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 6px;padding:4px 6px 4px 10px;border-radius:14px;background:#f4f2ff;min-height:40px}.slpb2:empty{display:none}
  .slpb2 .sb-l{font-size:12.5px;font-weight:800;color:#5b4fd6;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.slpb2 .sb-l .chip{background:transparent;padding:4px 2px;font-size:12.5px}
  .slpb2 .bed{font-size:13px;font-weight:800;padding:8px 12px;border-radius:999px;background:#ece8ff;color:#5b4fd6;white-space:nowrap}.slpb2 .bed.warn{background:#fff3c9;color:#a8790a}.slpb2 .bed.hot,.slpb2 .bed.over{background:#ffe9ec;color:#e0405a}
  .slpb2 .chip.mvb{height:34px;display:inline-flex;align-items:center;gap:4px;padding:0 12px;white-space:nowrap;font-size:13px;font-weight:800;border-radius:999px}.slpb2 .chip.mvb.slp{background:#ece8ff;color:#5b4fd6}.slpb2 .chip.mvb.wake{background:#fff3c9;color:#a8790a}.slpb2 .chip.mvb b{font-size:12px;background:#fff;border-radius:999px;padding:2px 7px}
  .hour.wr .wr-r{flex:1 1 0;min-width:0;flex-wrap:wrap;justify-content:flex-end;row-gap:6px}
  .hour.wr .bed{font-size:13.5px;font-weight:800;padding:9px 13px;border-radius:999px;background:#ece8ff;color:#5b4fd6;white-space:nowrap}
  .hour.wr .bed.warn{background:#fff3c9;color:#a8790a}
  .hour.wr .bed.hot,.hour.wr .bed.over{background:#ffe9ec;color:#e0405a}
  .hour.wr .chip.mvb{height:40px;display:inline-flex;align-items:center;gap:4px;padding:0 12px}
  .hour.wr .chip.mvb.go{background:#d9f4e4;color:#13864a}
  .hour.wr .chip.mvb.pz{background:#fff6e5;color:#a8790a;padding:0 10px}
  .hour.wr .chip.mvb.pz.on{background:#ffe2b8;color:#8a5a00}
  .hour.wr .chip.mvb.slp{background:#ece8ff;color:#5b4fd6}
  .hour.wr .chip.mvb.wake{background:#fff3c9;color:#a8790a}
  .hour.wr .chip.mvb.car{background:#d7f0ec;color:#0f766e}
  .hour.wr .chip.mvb.arr{background:#ffe6cf;color:#c4560c}
  .hour.wr .chip.mvb b{font-size:12px;font-weight:800;background:#fff;border-radius:999px;padding:2px 7px}
  .hour.wr .wr-r.tight .chip.mvb .mvl{display:none}
  .hour.wr .wr-r.tight .bed{font-size:12px;padding:9px 8px}
  .hour.wr .wr-r.wrap{flex-shrink:1;min-width:0;flex-wrap:wrap;justify-content:flex-end;row-gap:4px}
  .sgoal{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 8px}
  .hb-logo{display:inline-flex;align-items:baseline;gap:.42em;line-height:1;white-space:nowrap}
  .hb-logo b{font-weight:800;letter-spacing:.06em;font-size:1em}
  .hb-logo i{font-style:normal;font-weight:800;font-size:.78em;letter-spacing:.08em;opacity:.92}
  .rt-sum{display:flex;gap:8px;margin:4px 0 6px}
  .an-tabs{display:flex;gap:4px;background:#eef0f5;border-radius:14px;padding:4px;margin:2px 0 10px}
  .an-tabs button{flex:1;padding:8px 0;border-radius:10px;font-weight:800;color:#6a7080;background:transparent}
  .an-tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(30,40,70,.1)}
  .an-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px}
  .an-nav b{font-size:17px;font-weight:800;min-width:150px;text-align:center}
  .an-nav button{font-size:22px;color:#8a90a0;padding:0 10px}
  .an-nav button:disabled{opacity:.25}
  .an-bar{display:flex;height:18px;border-radius:999px;overflow:hidden;margin-bottom:12px}
  .an-bar i{display:block;height:100%}
  .an-list{display:grid;gap:8px}
  .an-row{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(32px,.8fr) auto 44px;align-items:center;gap:6px;background:var(--card);border-radius:14px;padding:9px 10px}
  .an-ic{font-size:17px;text-align:center}
  .an-nm{font-weight:800;font-size:13.5px}
  .an-mb{height:8px;border-radius:999px;background:#eef0f5;overflow:hidden}
  .an-mb i{display:block;height:100%;border-radius:999px}
  .an-h{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .an-h small{display:block;font-size:10.5px;color:#9aa3b5;font-weight:700}
  .an-d{font-size:11px;font-weight:800;text-align:right;color:#9aa3b5;white-space:nowrap}
  .an-d.up{color:#0a9a54}.an-d.dn{color:#e0405a}
  .an-row.none{background:transparent;border:1px dashed #dfe3ea}
  .an-row.md{box-shadow:inset 3px 0 0 #e0405a}
  .an-nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .an-nm small{display:block;font-size:10.5px;color:#12a6a0;font-weight:700;overflow:hidden;text-overflow:ellipsis}
  .an-muda{background:#fdecef;border:1px solid #f6c3cc;border-radius:16px;padding:10px 12px;margin-bottom:12px}
  .an-muda.zero{background:#e7f8ef;border-color:#bfe9d2}
  .an-m1{display:flex;align-items:center;gap:8px}
  .an-mi{font-size:26px;line-height:1}
  .an-mt{flex:1;min-width:0;font-weight:800;font-size:14px;color:#b4233d}
  .an-mt b{font-size:22px;margin:0 3px;font-variant-numeric:tabular-nums}
  .an-mt small{font-size:11px;color:#c0566a;white-space:nowrap}
  .an-muda.zero .an-mt{color:#0a9a54}
  .an-m2,.an-m3{font-size:12px;font-weight:700;color:#8a3a4a;margin-top:4px;overflow-wrap:anywhere}
  .an-md{font-size:12.5px;font-weight:800;white-space:nowrap;color:#9aa3b5}
  .an-md.up{color:#e0405a}.an-md.dn{color:#0a9a54}
  .an-sec{margin-top:12px}
  .an-sh{display:flex;align-items:center;gap:6px;width:100%;font-weight:800;font-size:15px;color:var(--ink);padding:4px 0 8px;text-align:left}
  .an-ar{display:inline-block;color:#9aa3b5;transition:transform .15s}
  .an-sec.open .an-ar{transform:rotate(90deg)}
  .an-more{display:block;width:100%;padding:8px 0;font-size:12.5px;font-weight:800;color:#6a7080;border:1px dashed #dfe3ea;border-radius:12px}
  .an-mvr,.an-pfr{background:var(--card);border-radius:14px;padding:8px 10px;min-width:0}
  .an-mv1,.an-pf1{display:flex;align-items:center;gap:6px}
  .an-mv1 b,.an-pf1 b{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .an-mv2,.an-pf2{display:flex;align-items:center;gap:8px;margin-top:6px}
  .an-mvb{flex:1;min-width:0;display:flex;height:10px;border-radius:999px;overflow:hidden;background:#eef0f5}
  .an-mvb i{display:block;height:100%}
  .an-mvt{font-size:11px;font-weight:800;color:#8a90a0;white-space:nowrap}
  .an-mvt em{font-style:normal}.an-mvt em.g{color:#0a9a54}.an-mvt em.r{color:#e0405a}
  .an-lg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;font-weight:700;color:#6a7080;margin:8px 2px 0}
  .an-lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:3px;vertical-align:-1px}
  .an-sub{font-size:12px;font-weight:800;color:#6a7080;margin:12px 2px 6px}
  .an-cps{display:flex;flex-wrap:wrap;gap:6px}
  .an-cp{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;max-width:100%;overflow-wrap:anywhere}
  .an-cp b{font-variant-numeric:tabular-nums}
  .an-cp.md{border-color:#e0405a;color:#b4233d}
  .an-empty{font-size:12px;color:#9aa3b5;font-weight:700;padding:6px 2px}
  .an-dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .an-pf2 .an-mb{flex:1;min-width:0}
  .an-pm{font-size:11.5px;font-weight:800;color:#e0405a;white-space:nowrap}
  .an-pfr{cursor:pointer}
  .an-pfr.sel{box-shadow:0 0 0 2px #c3c8d4}
  .an-pfr .an-cps{margin-top:8px}
  .an-hb{margin:2px 0 10px}
  .an-hb1{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
  .an-hb1 b:first-child{color:#5b4fd6}.an-hb1 b:last-child{color:#b45309}
  .an-vis{margin-top:10px;display:grid;gap:5px}
  .an-vr{display:flex;gap:8px;align-items:baseline;font-size:12.5px;font-weight:700;color:#2a2f3c;min-width:0}
  .an-vt{font-variant-numeric:tabular-nums;white-space:nowrap}
  .an-vr b{color:#0a9a54;white-space:nowrap}
  .an-vr small{color:#8a90a0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .an-pfr.unset b{color:#9aa3b5}
  .rt-sum>div{flex:1;background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:0 4px 14px rgba(30,40,70,.06)}
  .rt-sum small{display:block;font-size:11.5px;font-weight:800;color:#8a90a0}
  .rt-sum b{font-size:22px;font-weight:800;color:#4d7dff;font-variant-numeric:tabular-nums}
  .rt-card{background:var(--card);border-radius:18px;padding:12px 14px;margin-top:10px;border:1px solid var(--line);border-left:5px solid #c3c8d4}

  .rt-hd{display:flex;align-items:center;gap:8px}

<script>
'use strict';
(function(){
  const show=(msg)=>{try{const b=document.getElementById('bootmsg');if(!b)return;b.style.display='flex';b.dataset.err='1';
    document.getElementById('bootmsgT').textContent='起動でつまずいた';
    const s=document.getElementById('bootmsgS');s.style.cssText='font-size:12px;color:#e0405a;font-weight:700;word-break:break-all;max-width:92vw';s.textContent=String(msg).slice(0,400);
    if(!document.getElementById('bootmsgR')){const r=document.createElement('button');r.id='bootmsgR';r.textContent='再読み込み';r.style.cssText='margin-top:8px;padding:12px 22px;border-radius:14px;border:0;background:#0bc167;color:#fff;font:800 15px inherit';r.onclick=()=>location.reload();b.appendChild(r);}}catch(e){}};
  window.addEventListener('error',e=>{show((e&&e.message)||'error');});

async function shrinkPhotos(opt){
  const auto=!!(opt&&opt.auto);
  const MAXPX=600,Q=0.5;

  const ids=Object.keys(state.photos||{}).filter(id=>!(state.pha&&state.pha[id]));

  shrinkBusy=true;
  try{
    toast('📉 '+ids.length+'枚を軽くしている…');
    const out={};let before=0,after=0,n=0;
    for(const id of ids){
      const src=state.photos[id];
      if(typeof src!=='string'||src.indexOf('data:')!==0)continue;
      before+=src.length;after+=src.length;
      try{
        const nu=await reCompress(src,MAXPX,Q);
        if(nu&&nu.length>20000&&nu.length<src.length*0.9){out[id]=nu;n++;after+=nu.length-src.length;}
      }catch(e){}
    }
    if(!n){toast('これ以上は軽くできない');return;}
    if(after<before*0.2){toast('⚠ 結果が異常に小さい。安全のため元のままにした');return;}

}
function phCompress(file){
  return new Promise((res,rej)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      try{
        const s=Math.min(1,640/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.width*s));
        c.height=Math.max(1,Math.round(img.height*s));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        const dataURL=c.toDataURL('image/jpeg',0.55);
        URL.revokeObjectURL(url);res(dataURL);
      }catch(e){URL.revokeObjectURL(url);rej(e);}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'));};
    img.src=url;
  });
}

}

async function doPublish(force){
  if(pubBusy){pubAgain=true;return;}                 // 送信中の多重発射禁止（自作自演conflict防止）
  if(permFail)return;                                // 恒久エラー中は自動再送しない（☁ボタンで解除）
  if(Date.now()<pubCoolUntil){schedulePublish(pubCoolUntil-Date.now()+1500);return;}
  if(VERS_MEM.filter(v=>Date.now()-v.t<600000).length>=6){
    notePubErr('cool','保存が頻発したため5分小休止（記録は端末に保存済み）');
    pubCoolUntil=Date.now()+300000;schedulePublish(302000);return;
  }
  if(!force){
    if($('ovl').classList.contains('open')||($('page').classList.contains('open')&&!(pageMode==='pay'||pageMode==='rtn'||(pageMode==='aim'&&!aimSorting())))){pendingCkpt=true;return;}
    if(AIB.busy&&Date.now()-AIB.at<180000){pendingCkpt=true;schedulePublish(4000);return;}
    if(PHUP.busy&&Date.now()-PHUP.busyAt<120000){pendingCkpt=true;schedulePublish(4000);return;}   /* 写真の引っ越し中は待つ（最長2分） */
    const idle=Date.now()-LASTACT;
    if(idle<2500){pendingCkpt=true;schedulePublish(2600-idle);return;}
  }
  pubBusy=true;pubStartedAt=Date.now();
  try{
    if(!artifactNS){
      try{artifactNS=(window.claude&&window.claude.use)?await withTimeout(window.claude.use('artifact'),20000,'use'):null;}
      catch(e){artifactNS=undefined;notePubErr('use_throw',e&&e.message);schedulePublish(15000);return;}
      if(!artifactNS){
        useTries++;
        if(useTries<5){artifactNS=undefined;notePubErr('use_null','クラウド機能の準備待ち('+useTries+'/5)');renderSync();schedulePublish(8000*useTries);return;}
        localOnly=true;renderSync();greyNotice();return;
      }
      useTries=0;
    }
    if(!(state.updatedAt>0))return;                  // 本人入力ゼロ（シードのみ）は送らない
    const wasUnsynced=unsynced;
    const html=await buildSelfHtml();
    const sentAt=state.updatedAt;                    // 今回の便に載った版の印（送信中の追記を見分ける）
    if(!html){
      notePubErr('no_self_src','自分のソースを取得できない。電波を確認');
      failCount++;schedulePublish(Math.min(120000,10000*failCount));return;
    }
    try{
      const A='/*CSTATE*/let CSTATE=',B=';/*CSTATE-END*/';
      const va=html.indexOf(A),vb=html.indexOf(B);
      const chk=JSON.parse(html.slice(va+A.length,vb));
      if(!chk||chk.updatedAt!==sentAt)throw 0;
    }catch(eV){
      notePubErr('build_corrupt','組み立てた保存データが壊れている。送信中止');
      failCount++;schedulePublish(Math.min(120000,10000*failCount));return;
    }
    if(html.length>14000000){
      permFail=true;renderSync();
      notePubErr('too_large','容量が上限に接近('+Math.round(html.length/1e6)+'MB)。写真整理が必要');
      toast('写真が多くて容量上限に近い。記録は端末に安全。写真の整理が要る');
      return;
    }
    if(!force&&$('ovl').classList.contains('open')){pendingCkpt=true;return;}
    stashState();writeDraft();                       // 保存成功後の読み直しに備えて先に退避（契約の指定パターン）
    payReopenMark();                                 // 支払いページを開いたままなら、読み直し後に同じページへ戻す
    let res;
    try{
      res=await withTimeout(artifactNS.publish(html),120000,'publish');
    }catch(e){
      const code=(e&&e.code)||'throw';
      notePubErr(code,e&&e.message);
      if(code==='rate_limited'){pubCoolUntil=Date.now()+75000;schedulePublish(80000);}
      else if(code==='conflict'){conflictHeal();}
      else if(code==='too_large'){permFail=true;renderSync();toast('データが大きすぎて送れない。設定→バックアップを保存してくれ');}
      else if(code==='invalid_content'||code==='transform_error'||code==='read_only_path'){permFail=true;renderSync();}
      else if(code==='not_granted'||code==='not_writer'||code==='not_declared'||code==='capability_disabled'||code==='capability_removed'||code==='consent_required'){
        localOnly=true;renderSync();
      }else{
        failCount++;
        schedulePublish(Math.min(120000,10000*failCount)+Math.random()*5000);
      }
      return;
    }
    noteVersion(res&&res.version);
    try{localStorage.setItem('nippo10-pubsize',String(html.length));}catch(e){}
    try{sessionStorage.removeItem('nippo10-esc');}catch(e){}
    failCount=0;
    const clean=(state.updatedAt===sentAt);
    saveLocal(clean);
    if(clean&&PH.pending.length&&!localSaveFail){PH.pending=[];phSavePending();}
    if(!clean)schedulePublish(4000);
    else if(wasUnsynced)toast('🟢 クラウドに保存した');
  }finally{
    pubBusy=false;
    if(pubAgain){pubAgain=false;if(unsynced)schedulePublish();}
  }
}

function cntDay(st,d){

async function probeVault(){

    if(state.vprobe&&!state.vprobe.ok&&Date.now()-(state.vprobe.t||0)<86400000)return;

      const rd=r.body.getReader();
      const {value}=await rd.read();

      note=ok?'OK':'内容不一致';
    }
    if(!state.vprobe||state.vprobe.ok!==ok){
      state.vprobe={ok,note,ver:VER,t:Date.now()};
      state.updatedAt=Date.now();saveLocal(false);pendingCkpt=true;
    }else{state.vprobe.t=Date.now();state.vprobe.note=note;}
  }catch(e){
    if(!state.vprobe){
      state.vprobe={ok:false,note:'ERR',t:Date.now()};
      state.updatedAt=Date.now();saveLocal(false);pendingCkpt=true;
    }else if(!state.vprobe.ok){state.vprobe.t=Date.now();}
  }
}

  const top=pin5();   /* c7.8：普段の5つは本人が決めた順 */
  const learned=Object.keys(seen).sort((a,b)=>seen[b]-seen[a]).slice(0,4);

const GCAL={server:'Google Calendar',mcp:undefined,status:null,cache:{},unsub:null,watchDate:null};

async function gcalInit(){
  GCAL.mcp=(window.claude&&window.claude.use)?await window.claude.use('mcp'):null;
  if(!GCAL.mcp){if(ui.tab!=='di')renderPane();return;}
  try{
    const lt=await GCAL.mcp.listTools();
    const s=(lt.servers||[]).find(x=>x.server===GCAL.server);
    GCAL.status=!s?'absent':(s.authStatus==='needs_reauth'?'reauth':(s.tools&&s.tools.length?'ok':'absent'));
  }catch(e){GCAL.status='ok';/* 状態確認に失敗しても呼び出し時のエラーで案内する */}
  if(ui.tab!=='di')renderPane();
}

function gcalHint(code){
  if(code==='needs_reauth')return '<div class="ghint">🔑 Googleの認証が切れてる。claude.aiの 設定→コネクタ で「Googleカレンダー」を再接続→このページを開き直す</div>';
  if(code==='server_not_connected'||code==='absent')return '<div class="ghint">🔗 claude.aiの 設定→コネクタ で「Googleカレンダー」を接続すると、ここに予定が出る</div>';
  if(code==='selection_required')return '<div class="ghint">Googleカレンダーのコネクタが複数ある。claude.aiでどれを使うか選んでくれ</div>';
  if(code==='approval_required'||code==='blocked_by_policy')return '<div class="ghint">組織のポリシーでブロックされてる</div>';
  return '<div class="ghint">Googleカレンダーをいま読めない。少し待つと自動で再試行する</div>';
}

function renderGcal(d){
  if(GCAL.mcp===null)return '<div class="ghint">🔗 claude.aiで開くと、ここにGoogleカレンダーの予定が出る</div>';
  if(GCAL.status==='absent'||GCAL.status==='reauth')return gcalHint(GCAL.status==='reauth'?'needs_reauth':'absent');
  const c=GCAL.cache[d];
  if(!c)return '<div class="gempty">読み込み中…</div>';
  if(!c.ok)return gcalHint(c.code);
  const own=new Set(plansOf(d).map(x=>x.gid).filter(Boolean));
  const evs=c.events.filter(ev=>!own.has(ev.id));
  if(!evs.length)return '<div class="gempty">この日の予定なし</div>';
  const hm=x=>{const t=new Date(x);return pad(t.getHours())+':'+pad(t.getMinutes());};
  return evs.map(ev=>{
    const allday=ev.start&&ev.start.date&&!ev.start.dateTime;
    const time=allday?'終日':((ev.start&&ev.start.dateTime?hm(ev.start.dateTime):'')+(ev.end&&ev.end.dateTime?'–'+hm(ev.end.dateTime):''));
    return '<div class="gev"><span class="gt">'+esc(time)+'</span><span class="gs">'+esc(ev.summary||'（無題）')+'</span></div>';
  }).join('');
}

function gcalWatch(d){
  if(!GCAL.mcp||GCAL.status==='absent'||GCAL.status==='reauth')return;
  if(GCAL.watchDate===d&&GCAL.unsub)return;
  if(GCAL.unsub){GCAL.unsub();GCAL.unsub=null;}
  GCAL.watchDate=d;
  const input={startTime:d+'T00:00:00+09:00',endTime:d+'T23:59:59+09:00',orderBy:'startTime',pageSize:50};
  const showing=()=>((ui.tab==='pl'&&ui.date===d)||(ui.tab==='pr'&&addDays(ui.date,1)===d));
  GCAL.unsub=GCAL.mcp.watchTool(GCAL.server,'list_events',input,ev=>{
    if(ev.type==='data'){
      const p=(ev.result&&ev.result.payload)||{};
      const evs=(p.events||[]).filter(e=>e.status!=='cancelled');
      GCAL.cache[d]={ok:true,events:evs};
    }else{
      const code=ev.error&&ev.error.code;
      if(code==='needs_reauth'){GCAL.status='reauth';GCAL.cache[d]=null;}
      else if(code==='server_not_connected'){GCAL.status='absent';GCAL.cache[d]=null;}
      else if(code==='blocked_by_policy'||code==='approval_required'){GCAL.cache[d]={ok:false,code};}
      else if(!GCAL.cache[d]||!GCAL.cache[d].ok){GCAL.cache[d]={ok:false,code:code||'upstream_error'};}
    }
    if(showing())renderPane();
  },{cache:{staleTime:60000},refetchInterval:300000});
}

function renderDecade(){

  let minY=dobj.getFullYear();
  for(const d in state.entries){const y=Number(d.slice(0,4));if(y>1900&&y<minY)minY=y;}
  const span=Math.max(1,dobj.getFullYear()-minY);
  for(let i=1;i<=span;i++){
    const y=dobj.getFullYear()-i;
    const key=y+'-'+pad(dobj.getMonth()+1)+'-'+pad(dobj.getDate());
    const e=entriesOf(key);
    const hs=Object.keys(e).sort((a,b)=>{

      return sa<sb?-1:sa>sb?1:0;

function micStopAll(){
  if(curMic.r){curMic.r._stop=true;try{curMic.r.stop();}catch(e){}}

function micToggle(btn,ta){
  if(curMic.btn===btn){micStopAll();return;}
  micStopAll();
  if(!SR){ta.focus();toast('この端末はキーボードのマイク（音声入力）を使ってくれ');return;}
  let r;
  try{r=new SR();}catch(e){ta.focus();toast('音声が使えない。キーボードのマイクで');return;}
  let base=ta.value?(ta.value.replace(/\s+$/,'')+(ta.value.trim()?(ta.tagName==='INPUT'?' ':'\n'):'')):'';
  r.lang='ja-JP';r.interimResults=true;r.continuous=true;
  r.onresult=ev=>{
    r._got=true;
    let inter='';
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      const tr=ev.results[i][0].transcript;
      if(ev.results[i].isFinal)base+=tr;else inter+=tr;
    }
    if(ta.isConnected){ta.value=base+inter;if(ta.scrollHeight)ta.scrollTop=ta.scrollHeight;}
  };
  r.onerror=e=>{
    const c=e&&e.error;
    if(c==='not-allowed'||c==='service-not-allowed'){r._stop=true;toast('マイクの使用を許可してくれ。ダメならキーボードのマイクで');ta.focus();}
  };
  r.onend=()=>{
    r._restarts=(r._restarts||0)+1;
    if(!r._stop&&curMic.r===r&&ta.isConnected&&btn.isConnected&&(r._got||r._restarts<4)){
      try{r.start();return;}catch(e){}
    }
    if(btn.isConnected)btn.classList.remove('rec');
    if(curMic.r===r)curMic={r:null,btn:null,ta:null};
    if(!r._stop&&!r._got&&ta.isConnected){
      ta.focus();
      toast('この端末はマイクが効かない。キーボードのマイク（音声入力）を使ってくれ');
    }
  };
  try{r.start();}catch(e){ta.focus();toast('音声が使えない。キーボードのマイクで');return;}
  curMic={r,btn,ta};
  btn.classList.add('rec');
  if(!ta._micHook){
    ta._micHook=true;
    ta.addEventListener('input',()=>{if(curMic.ta===ta){micStopAll();toast('手入力に切り替えた');}});
  }

}

    if(nu.t===p.t&&nu.hh===(p.hh||null)&&nu.pl===(p.pl||'')&&nu.mm===(p.mm||null))return true;

      '<div class="pf-btns"><button id="pfBack">← エリア</button><button id="pfNone">なし</button><button class="pf-ok" id="pfOk" style="background:'+a.co+'">これにする</button></div>',null);
    const dr=$('pfDrum'),its=Array.from(dr.children);let raf=0;
    const upd=()=>{raf=0;const c=dr.scrollTop/DH,ci=Math.round(c);
      its.forEach((b,i)=>{const d=i-c,ad=Math.min(Math.abs(d),2.5);
        b.style.transform='translateY('+(-Math.sign(d)*ad*ad*3).toFixed(1)+'px) scale('+(1-ad*0.14).toFixed(3)+')';
        b.style.opacity=(1-ad*0.32).toFixed(2);b.classList.toggle('on',i===ci);});};
    dr.addEventListener('scroll',()=>{if(!raf)raf=requestAnimationFrame(upd);},{passive:true});

    $('pfOk').onclick=()=>{const i=Math.min(ps.length-1,Math.max(0,Math.round(dr.scrollTop/DH)));done(ps[i][0]);};
  };

function dreamsActive(){

}
function dreamsWon(){

function dreamDue(d){return d.due||(d.yr?(d.yr+'-12-31'):null);}
function daysTo(ds){return Math.ceil((parseD(ds)-new Date())/86400000);}
function dLeft(d){
  const du=dreamDue(d);if(!du)return '';

  return n>=0?('あと'+n+'日'):'超過';
}
function dSort(arr){
  const pv=p=>p==='A'?0:p==='B'?1:p==='C'?2:3;
  const dk=d=>dreamDue(d)||'9999-12-31';
  return arr.sort((a,b)=>(pv(a.pr)-pv(b.pr))||(dk(a)<dk(b)?-1:dk(a)>dk(b)?1:0)||((a.ts||0)-(b.ts||0)));
}
const PIN_DEFAULT={};
const PIN_MAX=2;
function pinOn(id){const p=(state.pins||{})[id];return p?!!p.on:!!PIN_DEFAULT[id];}
function pinnedDreams(){
  const dk=d=>dreamDue(d)||'9999-12-31';
  return dreamsActive().filter(d=>pinOn(d.id))
    .sort((a,b)=>(dk(a)<dk(b)?-1:dk(a)>dk(b)?1:0)||((a.ts||0)-(b.ts||0))).slice(0,PIN_MAX);
}

      if(dsArm!==sid){dsArm=sid;paint();return;}

      dsArm='';paint();});
    const add=()=>{const v=inp.value.replace(/\s+/g,' ').trim().slice(0,60);if(!v){toast('1行だけ書いてくれ');return;}
      const mx=stepsOf(id).reduce((m,x)=>Math.max(m,Number(x.o)||0),0);
      mutate(()=>{state.steps=state.steps||{};state.steps[stepNewId(0)]={dr:id,t:v,o:mx+1,d:0,c:Date.now(),by:'me',ts:Date.now()};});
      inp.value='';dsArm='';paint();try{$('dsIn').focus();}catch(e){}};
    $('dsAdd').onclick=add;
    inp.onkeydown=ev=>{if(ev.key==='Enter'&&!ev.isComposing&&ev.keyCode!==229){ev.preventDefault();add();}};
  };
  paint();
}

function totalDiaryDays(){
  let n=0;
  for(const d in state.entries){const e=state.entries[d];for(const k in e){if(e[k]&&!e[k].del){n++;break;}}}
  return n;
}
function openStatsSheet(){
  const t=todayStr();
  let days=0,cnt=0;const byY={};let first=null;
  for(const d of Object.keys(state.entries).sort()){
    const e=state.entries[d];let n=0;
    for(const k in e)if(e[k]&&!e[k].del)n++;
    if(n>0){days++;cnt+=n;const y=d.slice(0,4);byY[y]=(byY[y]||0)+1;if(!first)first=d;}
  }
  const span=first?(Math.floor((parseD(t)-parseD(first))/86400000)+1):0;
  const rate=span?(Math.round(days/span*1000)/10):0;
  const st=calcStreak();
  const years=Object.keys(byY).sort();
  let sm=0,sn=0;
  for(let i=0;i<7;i++){const d=addDays(t,-i);const eo=state.entries[d]||{};for(const k in eo){const en=eo[k];if(en&&!en.del&&en.k==='sleep'&&en.s&&en.e){sm+=durMin(en.s,en.e,en.ed);sn++;}}}
  const avgSleep=sn?durText(Math.round(sm/sn/10)*10):'';
  $('sheet').innerHTML='<div class="grab"></div>'+
    '<div class="sh-time"><span>📔 記録の実績</span></div>'+
    '<div style="text-align:center;padding:8px 0 4px">'+
    '<div style="font-size:38px;font-weight:800;color:var(--green);line-height:1.2">'+days+'<span style="font-size:16px">日目</span></div>'+
    '<div style="color:#8a90a0;font-size:12.5px;font-weight:700;margin-top:4px">🔥 連続'+st+'日｜記録'+cnt+'件｜記入率'+rate+'%</div>'+
    (avgSleep?'<div style="color:#5b4fd6;font-size:12.5px;font-weight:700;margin-top:2px">😴 直近7日の平均睡眠 '+avgSleep+'（'+sn+'回）</div>':'')+'</div>'+
    '<div class="sh-note" style="text-align:left;line-height:2.1;font-size:12.5px">'+
    years.map(y=>'　'+y+'年：'+byY[y]+'日').join('<br>')+
    (first?('<br>　初日：'+first.replace(/-/g,'/')+'（'+span+'日間）'):'')+
    '</div>'+
    '<div class="sh-note">続いてることが、何よりの実績だ。</div>';
  openOvl();
}

function memosOf(){
  const m=state.memos||{};
  return Object.keys(m).filter(id=>!m[id].del).map(id=>({id,...m[id]})).sort((a,b)=>(b.ts||0)-(a.ts||0));
}
const PAY_ALARM_DAYS={7:1,5:1,3:1,2:1,1:1,0:1};
let PAY_C_PRESETS=['家賃','携帯電話','電気','ガス','水道','ネット回線','サブスク','保険','駐車場代','借入返済'];
const PAY_MON_RE=/[（(]\s*([0-9０-９]{1,2})\s*月分\s*[）)]/;
function payZen(s){return String(s==null?'':s).replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0));}
function payAmt(v){return Number(payZen(v).replace(/[.．].*$/,'').replace(/[^0-9]/g,''))||0;}
let PAY_N_PRESETS=[];
let PAY_AUTO={};
const PAY_BANKS=['三菱UFJ銀行','三井住友銀行','みずほ銀行','りそな銀行','ゆうちょ銀行','楽天銀行','住信SBIネット銀行','PayPay銀行','GMOあおぞらネット銀行','信用金庫'];

let PAY_MY_ACC=[];
function payMyAcc(v){
  const s=String(v||'');if(!s)return '';
  for(const a of PAY_MY_ACC){const bank=String(a).split('（')[0].trim();if(bank&&s.indexOf(bank)===0)return a;}
  return s;
}
const PAY_ACC_OLD={};
function payAccFix(){
  const m=state.pays||{};let n=0;
  for(const id in m){const p=m[id];if(!p||p.del||!p.fa)continue;
    const nu=PAY_ACC_OLD[String(p.fa).trim()];
    if(nu&&nu!==p.fa){m[id]=Object.assign({},p,{fa:nu,ts:Date.now()});n++;}
  }
  if(n){state.updatedAt=Date.now();saveLocal(false);pendingCkpt=true;}
  return n;
}
const PAY_FIX1=[];
function payFix1(){
  if(state.payfix&&state.payfix.v1)return 0;
  const m=state.pays=state.pays||{},now=Date.now();let n=0;
  const dayIn=(ym,day)=>{const a=ym.split('-').map(Number);return ym+'-'+pad(Math.min(day,new Date(a[0],a[1],0).getDate()));};
  PAY_FIX1.forEach((sp,i)=>{
    const same=Object.keys(m).filter(k=>m[k]&&!m[k].del&&m[k].d&&payBase(m[k].c)===sp.c);
    const open=same.filter(k=>m[k].rep&&!m[k].done);
    for(const k of open){const p=m[k],nd=dayIn(String(p.d).slice(0,7),sp.day);
      if(p.d!==nd||Number(p.dd)!==sp.day){m[k]=Object.assign({},p,{d:nd,dd:sp.day,ts:now});n++;}}
    if(!open.length){
      const id='pyfx1_'+i+'_202610';
      if(m[id])return;
      const src=same.map(k=>m[k]).sort((a,b)=>a.d<b.d?1:-1)[0]||null;
      const nu={n:src?(src.n||''):(PAY_AUTO[sp.c]||''),a:src?(Number(src.a)||0):0,d:dayIn('2026-10',sp.day),dd:sp.day,c:sp.c,memo:'',rep:1,done:0,pv:1,ts:now,ct:now};
      if(src&&src.m){nu.m=src.m;
        if(src.m==='bank'){nu.fa=src.fa||'';nu.ta=src.ta||'';}
        else if(src.m==='debit'){if(src.fa)nu.fa=src.fa;}
        else if(src.m==='card'){if(src.cd)nu.cd=src.cd;}
        else if(src.m==='other'){if(src.mx)nu.mx=src.mx;}}
      m[id]=nu;n++;
    }
  });
  state.payfix=Object.assign({},state.payfix||{},{v1:now});
  state.updatedAt=now;saveLocal(false);pendingCkpt=true;
  return n;
}
function fmtYen(a){const n=Number(a)||0;return n.toLocaleString('ja-JP');}
function payYenTxt(a){return Number(a)?(fmtYen(a)+'円'):'金額？';}
function paysOf(){
  const m=state.pays||{};
  return Object.keys(m).filter(id=>m[id]&&!m[id].del&&m[id].d).map(id=>({id,...m[id]})).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
}
function payDays(d){return Math.round((parseD(d)-parseD(todayStr()))/86400000);}
function payLabel(n){return n<0?('期限を'+(-n)+'日過ぎている'):n===0?'今日が支払日':n===1?'明日が支払日':('あと'+n+'日');}
function payColor(n){return n<=2?'#e0405a':n<=7?'#c98a2f':'#8a90a0';}
function payMD(d){const a=d.split('-');return Number(a[1])+'/'+Number(a[2]);}
function payPv(p){return !!(p&&p.pv&&!p.done);}
function payMDp(p){return payMD(p.d)+(payPv(p)?'（仮）':'');}
function payMonOf(c){const m=PAY_MON_RE.exec(String(c||''));const n=m?Number(payZen(m[1])):0;return (n>=1&&n<=12)?n:0;}
function payBase(c){const s=String(c||'');return (payMonOf(s)?s.replace(PAY_MON_RE,''):s).trim();}
function payMo(p){const n=Number(p&&p.mo)||0;return (n>=1&&n<=12)?n:0;}
function payKey(p){return payBase(p.c)+'|'+(p.n||'');}
function payHash(s){let a=2166136261,b=5381;s=String(s);for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,16777619)>>>0;b=(Math.imul(b,33)+c)>>>0;}return a.toString(36)+b.toString(36)+s.length.toString(36);}
function payTitle(p){return (p.c||p.n||'支払い')+(payMo(p)?'（'+payMo(p)+'月分）':'');}
function payHow(p){
  return p.m==='bank'?('🏦 '+(p.fa||'？')+' → '+(p.ta||'？'))
    :p.m==='debit'?('🏧 口座引落'+(p.fa?'（'+p.fa+'）':''))
    :p.m==='card'?('💳 カード'+(p.cd?'（'+p.cd+'）':''))
    :p.m==='cvs'?'🏪 コンビニ払い'
    :p.m==='other'?('✏️ '+(p.mx||'その他'))
    :p.m==='cash'?'💴 現金':'';
}
function paySub(p){return [(p.c&&p.n)?p.n:'',payHow(p)].filter(Boolean).join('・');}
function payNextMonth(d,dd){
  const a=d.split('-').map(Number);
  const first=new Date(a[0],a[1],1);
  const last=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
  return fmt(new Date(first.getFullYear(),first.getMonth(),Math.min(Number(dd)||a[2],last)));
}
function payAlarms(){return paysOf().filter(p=>!p.done&&payDays(p.d)<=(p.pv?14:7));}
function payAlarmToday(){return payAlarms().filter(p=>{const n=payDays(p.d);return n<0||PAY_ALARM_DAYS[n]||(p.pv&&(n===14||n===10));});}

const PAY_EOM=99;
function payAnc(p){const dd=Number(p&&p.dd)||0;if(dd===31)return p.d31?31:PAY_EOM;return dd||Number(String((p&&p.d)||'').slice(8))||1;}
function payRepOff(k){const r=(state.payrep||{})[k];return !!(r&&r.off);}
function payRepSet(k,off,gone){
  state.payrep=state.payrep||{};
  const r={off:off?1:0,ts:Date.now()};
  if(!off)r.rs=todayStr();
  if(off&&gone)r.gone=1;
  state.payrep[k]=r;
}
function payNextYear(d){const a=String(d).split('-').map(Number);const ld=new Date(a[0]+1,a[1],0).getDate();return (a[0]+1)+'-'+pad(a[1])+'-'+pad(Math.min(a[2],ld));}
function paySeries(){
  const by={},rp=state.payrep||{};
  for(const p of paysOf()){if(!p.rep)continue;const k=payKey(p);(by[k]=by[k]||[]).push(p);}
  return Object.keys(by).filter(k=>!(rp[k]&&rp[k].off&&rp[k].gone)).map(k=>{const list=by[k],last=list[list.length-1],next=list.find(x=>!x.done)||null,tpl=next||last;
    return {k,list,last,next,tpl,off:payRepOff(k),day:payAnc(tpl),yr:!!tpl.yr};
  }).sort((a,b)=>(a.off-b.off)||(a.yr-b.yr)||(a.yr?(String(a.tpl.d).slice(5)<String(b.tpl.d).slice(5)?-1:1):(a.day-b.day))||(a.k<b.k?-1:a.k>b.k?1:0));
}
function payRoll(){
  const arr=paysOf().filter(p=>p.rep);
  if(!arr.length)return 0;
  let made=0;

        const same=(x,y)=>['c','n','a','d','dd','d31','yr','en','mo','m','fa','ta','cd','mx'].every(f=>String(x[f]==null?'':x[f])===String(y[f]==null?'':y[f]));

              w.d=y+'-'+pad(md[0])+'-'+pad(Math.min(md[1],new Date(y,md[0],0).getDate()));}

function renderMemoPage(){
  pageMode='memo';
  const p=$('page');
  const arr=memosOf();
  const now=Date.now();
  const groups=[];const byKey={};
  for(const m of arr){
    let key,label;
    if(now-(m.ts||0)<604800000){key='recent';label='過去7日間';}
    else{const d=new Date(m.ts||0);key=d.getFullYear()+'-'+d.getMonth();label=d.getFullYear()+'年'+(d.getMonth()+1)+'月';}
    if(!byKey[key]){byKey[key]={label,items:[]};groups.push(byKey[key]);}
    byKey[key].items.push(m);
  }
  const rows=g=>g.items.map(m=>{
    const lines=(m.t||'').split('\n').filter(x=>x.trim());
    const d=new Date(m.ts||0);
    const dt=(now-(m.ts||0)<604800000)?((d.getMonth()+1)+'/'+d.getDate()):(d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate()));
    return '<button class="memo-row" data-me="'+esc(m.id)+'"><div class="m1">'+esc((lines[0]||'（無題）').slice(0,42))+'</div>'+
      '<div class="m2"><span style="color:#9aa3b5;font-weight:700">'+dt+'</span>　'+esc(lines.slice(1).join(' ').slice(0,44))+'</div></button>';
  }).join('');
  p.innerHTML='<div class="page-head"><button class="bk" id="pgBk">‹ 戻る</button><span class="tt">📝 メモ</span><button class="padd" id="pgAdd">＋</button></div>'+
    '<div class="page-body">'+
    '<div style="color:#8a90a0;font-size:11.5px;font-weight:700;padding:0 2px 4px">'+arr.length+'件のメモ</div>'+
    (arr.length?groups.map(g=>'<div class="glab" style="margin:10px 0 4px;color:var(--green)">'+esc(g.label)+'</div>'+rows(g)).join('')
      :'<div class="empty-hint">手帳の白紙ページ。<br>思いついたら＋で書き殴る。整理はAIの仕事</div>')+
    '</div>';
  p.classList.add('open');
  $('pgBk').onclick=closePage;
  $('pgAdd').onclick=()=>renderMemoEditor(null);
  p.querySelectorAll('[data-me]').forEach(b=>b.onclick=()=>renderMemoEditor(b.dataset.me));
}

function sleepSessions(){
  const by={};

    if(en&&!en.del&&en.k!=='sleep'&&!en.mv&&Array.isArray(en.acts)&&en.s&&en.e){for(const a of en.acts){if(!a||a.k!=='sleep')continue;let s,e,ed;if(a.s&&a.e){s=a.s;e=a.e;ed=(a.e<=a.s)?1:0;if(a.s<en.s)ed=Number(en.ed)||0;}else if(a.w){s=en.s;e=en.e;ed=Number(en.ed)||0;}else continue;
        const wd=ed?addDays(d,ed):d;const min=durMin(s,e,ed);if(min>0)(by[wd]=by[wd]||[]).push({date:d,k,s,e,ed,min,p:en.p||'',bd:(a.bd===0?0:(a.bd===1?1:(en.bd===0?0:-1)))});}}
    if(!en||en.del||en.k!=='sleep'||!en.s||!en.e)continue;
    const wd=en.ed?addDays(d,en.ed):d;const min=durMin(en.s,en.e,en.ed);if(min<=0)continue;
    (by[wd]=by[wd]||[]).push({date:d,k,s:en.s,e:en.e,ed:en.ed||0,min,p:en.p||'',bd:(en.bd===0?0:(en.bd===1?1:-1))});}}
  for(const wd in by)by[wd].sort((a,b)=>(a.date+a.s)<(b.date+b.s)?-1:1);
  return by;
}
const SLEEP_MAX8=480;
function sleepDay(wd,by){alarmCfg();
  const ss=(by||sleepSessions())[wd]||[];
  if(!ss.length)return null;
  const total=ss.reduce((a,x)=>a+x.min,0);
  const main=ss.reduce((a,x)=>x.min>a.min?x:a,ss[0]);
  const morning=ss.filter(x=>x.e<'14:00'&&!(x.date===wd&&x.s>='11:00'&&x.s<'20:00'));
  const lastWake=morning.length?morning.reduce((a,x)=>x.e>a?x.e:a,'00:00'):null;
  const flags=[];
  if(morning.length>=2)flags.push('🔁 二度寝'+(morning.length>2?'×'+(morning.length-1):''));
  if(lastWake&&lastWake>'10:00')flags.push('⏰ 寝坊');
  else if(lastWake&&lastWake>SLEEP_WAKE)flags.push('☀ 9時すぎ');
  if(main.date===wd&&main.s>=SLEEP_BED&&main.s<'11:00')flags.push('🦉 夜更かし');
  if(ss.some(x=>x.date===wd&&x.s>='11:00'&&x.s<'20:00'))flags.push('💤 昼寝');
  if(total>SLEEP_MAX8)flags.push('😪 寝すぎ');
  if(total<420)flags.push('😵 寝不足');
  return {wd,ss,total,main,lastWake,flags,good:flags.length===0};
}

function openStepEdit(dr,sid){
  const d=(state.dreams||{})[dr];if(!d||d.del)return;
  const ex=sid?(state.steps||{})[sid]:null;
  $('sheet').innerHTML='<div class="grab"></div><div class="sh-time"><span>'+(ex?'✏️ 手順を直す':'＋ 手順を足す')+'</span></div>'+
    '<div style="font-weight:800;font-size:14px;text-align:center;word-break:break-word">'+esc(d.t)+'</div>'+
    '<div><div class="sh-label">1行だけ（5分で始められる大きさで・話してもOK）</div><div class="sh-ta-wrap"><input type="text" id="seT" maxlength="60" style="padding-right:46px" placeholder="例：○○に電話する">'+
      '<button class="sh-mic" id="seMic" style="top:5px;bottom:auto">'+MICSVG+'</button></div></div>'+
    '<div class="sh-btns">'+(ex?'<button class="delbtn" id="seDel">削除</button>':'')+
      ((ex&&ex.d)?'<button class="delbtn" id="seUndo" style="background:#f1f3f8;color:#4a4f5e">まだに戻す</button>':'')+
      '<button class="savebtn" id="seSave">決　定</button></div>';
  $('seT').value=ex?(ex.t||''):'';
  $('seMic').onclick=()=>micToggle($('seMic'),$('seT'));
  const back=()=>{closeSheet();if($('page').classList.contains('open')&&pageMode==='aim')renderAimPage();};
  const gone=()=>{const c=(state.steps||{})[sid];return !c||!!c.del;};
  $('seSave').onclick=()=>{
    const v=$('seT').value.replace(/\s+/g,' ').trim();
    if(!v){toast('手順を1行だけ書いてくれ');return;}
    if(ex&&gone()){
      if(v===ex.t){back();toast('この手順は入れ替わっていた');return;}
      mutate(()=>{state.steps=state.steps||{};state.steps[stepNewId(0)]={dr:dr,t:v,o:(Number(ex.o)||0)-0.0001,d:0,c:Date.now(),by:'me',ts:Date.now()};});
      back();toast('✓ 手順が入れ替わっていたので、新しい手順として足した');return;
    }
    if(ex){if(v!==ex.t)mutate(()=>{state.steps[sid]=Object.assign({},state.steps[sid],{t:v,ts:Date.now()});});}
    else{
      const l=stepsOf(dr),mx=l.reduce((m,x)=>Math.max(m,Number(x.o)||0),0);
      mutate(()=>{state.steps=state.steps||{};state.steps[stepNewId(0)]={dr:dr,t:v,o:mx+1,d:0,c:Date.now(),by:'me',ts:Date.now()};});
    }
    back();toast(ex?'✓ 直した':'✓ 手順を足した');
  };
  const dl=$('seDel');
  if(dl)dl.onclick=()=>{
    if(!dl.classList.contains('arm')){dl.classList.add('arm');dl.textContent='本当に削除？';
      setTimeout(()=>{if(dl.isConnected){dl.classList.remove('arm');dl.textContent='削除';}},2500);return;}
    if(gone()){back();toast('この手順は入れ替わっていた');return;}
    mutate(()=>{state.steps[sid]=Object.assign({},state.steps[sid],{del:1,ts:Date.now()});});
    back();toast('削除した');
  };
  const un=$('seUndo');
  if(un)un.onclick=()=>{
    if(gone()){back();toast('この手順は入れ替わっていた');return;}
    mutate(()=>{state.steps[sid]=Object.assign({},state.steps[sid],{d:0,dts:Date.now(),ts:Date.now()});
      const m=state.moves||{};for(const k in m){if(m[k]&&!m[k].del&&m[k].sid===sid)m[k]=Object.assign({},m[k],{del:1,ts:Date.now()});}});
    back();toast('まだに戻した');
  };
  openOvl();
}
function openStepGen(dr){
  const d0=(state.dreams||{})[dr];if(!d0||d0.del)return;
  const d={id:dr,...d0},a=aimOf(dr)||{};
  const old=stepsOf(dr),undone=old.filter(x=>!x.d);
  let draft=null;
  $('sheet').innerHTML='<div class="grab"></div><div class="sh-time"><span>🤖 手順を作る</span></div>'+
    '<div style="font-weight:800;font-size:14px;text-align:center;word-break:break-word">'+esc(d.t)+(dreamDue(d)?'　<span style="color:#8a90a0;font-size:12px">'+esc(dLeft(d))+'</span>':'')+'</div>'+
    '<div><div class="sh-label">いまの状況を1行（書かなくてもOK・話してもOK）</div><div class="sh-ta-wrap"><input type="text" id="sgCx" maxlength="120" style="padding-right:46px" placeholder="例：1人でやる・まだ何も決めていない">'+
      '<button class="sh-mic" id="sgMic" style="top:5px;bottom:auto">'+MICSVG+'</button></div></div>'+
    '<div id="sgOut"></div>'+
    '<div class="sh-btns" id="sgBtns"></div>'+
    '<div class="sh-note" style="text-align:left">AIが5〜15分の手順に分ける。日付は付けない。'+
      (undone.length?'<br>いまの「まだ」の手順 '+undone.length+'個は、新しい手順に入れ替わる（やった分は残る）':'')+
      '<br>AIの案なので、手続きの正しさは公式の案内か専門家で最後に確かめてくれ</div>';
  $('sgCx').value=a.cx||'';
  $('sgMic').onclick=()=>micToggle($('sgMic'),$('sgCx'));
  const btns=h=>{const b=$('sgBtns');if(b)b.innerHTML=h;};
  const idle=()=>{
    btns((draft?'<button class="delbtn" id="sgRe" style="background:#f1f3f8;color:#4a4f5e">🔁 作り直す</button><button class="savebtn" id="sgUse" style="letter-spacing:.06em">✓ これで始める</button>'
               :'<button class="savebtn" id="sgGo" style="letter-spacing:.06em">🤖 AIに作らせる</button>'));
    const go=$('sgGo')||$('sgRe');if(go)go.onclick=run;
    const us=$('sgUse');if(us)us.onclick=use;
  };
  const show=()=>{const o=$('sgOut');if(!o)return;
    o.innerHTML=draft?('<ol class="sg-list">'+draft.map((t,i)=>'<li><b>'+(i+1)+'</b><span>'+esc(t)+'</span></li>').join('')+'</ol>'):'';};
  async function run(){
    if(AIB.busy)return;
    micStopAll();
    const cx=$('sgCx').value.replace(/\s+/g,' ').trim();
    const o=$('sgOut');if(o)o.innerHTML='<div class="sg-wait"><span class="pulse"></span>AIが考えている…（5〜60秒）</div>';
    btns('<button class="delbtn" id="sgStop" style="flex:1">■ 止める</button>');
    try{aiCtl=new AbortController();}catch(e){aiCtl=null;}
    const ctl=aiCtl;
    const st=$('sgStop');if(st)st.onclick=()=>{try{if(ctl)ctl.abort();}catch(e){}};
    try{
      const list=stepsFromAi(await aiAsk(aiGenPrompt(d,cx),'default',ctl?ctl.signal:null));
      if(!$('sgOut'))return;
      draft=list;show();idle();
    }catch(e){
      if(!$('sgOut'))return;
      const m=aiErrText(e&&e.code);
      show();idle();
      if(m)$('sgOut').insertAdjacentHTML('afterbegin','<div class="sg-wait" style="color:#e0405a">'+esc(m)+'</div>');
      if(e&&(e.code==='no_sample'||e.code==='not_granted')){
        btns('<button class="savebtn" id="sgSelf" style="letter-spacing:.06em">＋ 自分で1行書く</button>');
        $('sgSelf').onclick=()=>openStepEdit(dr,null);
      }
    }finally{if(aiCtl===ctl)aiCtl=null;}
  }
  function use(){
    if(!draft||!draft.length)return;
    const cx=$('sgCx').value.replace(/\s+/g,' ').trim();
    const cur=stepsOf(dr),mx=cur.reduce((m,x)=>Math.max(m,Number(x.o)||0),0);
    mutate(()=>{
      state.steps=state.steps||{};
      cur.filter(x=>!x.d).forEach(x=>{state.steps[x.id]=Object.assign({},state.steps[x.id],{del:1,ts:Date.now()});});
      draft.forEach((t,i)=>{state.steps[stepNewId(i)]={dr:dr,t:t,o:mx+1+i,d:0,c:Date.now()+i,by:'ai',ts:Date.now()};});
      state.aims=state.aims||{};state.aims[dr]=Object.assign({},state.aims[dr]||{},{cx:cx,ts:Date.now()});
    });
    aimListOpen[dr]=true;
    closeSheet();
    if($('page').classList.contains('open')&&pageMode==='aim')renderAimPage();
    toast('🎯 '+draft.length+'個の手順が出来た。1個目からでいい');
  }
  idle();
  openOvl();
}

function optItems(key){
  const C=OPT_CFG[key],st=state[key]||{},out=[];
  if(C.plain){
    const ids=Object.keys(st);
    if(key==='payppl')Object.keys(PAY_PPL_DEF).forEach(k=>{if(ids.indexOf(k)<0)ids.push(k);});
    ids.forEach(id=>{const o=st[id]||(key==='payppl'?PAY_PPL_DEF[id]:null);if(!o||!o.n)return;
      out.push({id,ic:'',lb:String(o.n),o:(o.o!=null)?Number(o.o):9999,ts:o.ts||0,off:false,gone:!!o.del,own:true});});
    if(key==='projects')out.sort((a,b)=>b.ts-a.ts);else out.sort((a,b)=>a.o-b.o||a.ts-b.ts);
    return out;}
  const base=C.base();
  base.forEach((b,i)=>{const o=st[b[0]];
    out.push({id:b[0],ic:(o&&o.ic)||b[1],lb:(o&&o.lb)||b[2],o:(o&&o.o!=null)?Number(o.o):i*10,off:!!(o&&o.off),gone:false,own:false,url:C.url?((o&&o.url!=null)?String(o.url):(b[3]||'')):'',g:C.grp?((o&&o.g)||b[3]||''):''});});
  for(const id in st){const o=st[id];if(!o||!o.own||!o.lb||base.some(b=>b[0]===id))continue;
    out.push({id,ic:o.ic||C.dic,lb:String(o.lb),o:Number(o.o)||9999,off:!!o.off&&!o.del,gone:!!o.del,own:true,url:o.url?String(o.url):'',g:o.g||''});}
  out.sort((a,b)=>a.o-b.o);
  if(key==='kgrp'&&!(st.P&&st.P.o!=null)){const iP=out.findIndex(x=>x.id==='P');if(iP>=0){const p=out.splice(iP,1)[0];const iB=out.findIndex(x=>x.id==='B');out.splice(iB>=0?iB+1:out.length,0,p);}}

function learnTodayMin(t){   /* 今日の記録のうち 勉強・読書・音声・動画で学ぶ の分（行の種類も記録そのものの種類も）。同じ分は1回だけ数える。
     分析の集計（anaCount）は記録そのものの種類を「滞在」に入れるので使わない */
  try{
    t=t||todayStr();const LK={study:1,read:1,audio:1,vstudy:1},eo=(state.entries||{})[t]||{},isT=(t===todayStr());
    const hm=s=>{const a=String(s||'').split(':').map(Number);return (a[0]||0)*60+(a[1]||0);},now=hm(nowMin());
    const mark=new Uint8Array(2880);
    for(const k in eo){const en=eo[k];if(!en||en.del||en.noT||!en.s)continue;
      const a=hm(en.s);let b;
      if(en.e){b=hm(en.e)+(Number(en.ed)||0)*1440;if(b<a)b+=1440;}else if(isT&&a<=now)b=now;else continue;
      if(LK[en.k])for(let m=a;m<b&&m<2880;m++)mark[m]=1;
      const AX=actsExpand(en.acts).filter(ac=>ac&&LK[ac.k]);
      for(const ac of AX){if(ac.s&&ac.e){let x=hm(ac.s),y=hm(ac.e);if(x<a)x+=1440;if(y<x)y+=1440;for(let m=x;m<y&&m<2880;m++)mark[m]=1;}}
      for(const ac of AX){if(!(ac.s&&ac.e)&&Number(ac.m)>0){let left=Number(ac.m);for(let m=a;m<b&&m<2880&&left>0;m++)if(!mark[m]){mark[m]=1;left--;}}}}
    let c=0;for(let m=0;m<1440;m++)c+=mark[m];return c;
  }catch(e){return 0;}}

function depAuto(x){const tk=placeKey(x.to);if(!tk)return false;const eo=(state.entries||{})[x.d]||{},cr=Number(x.cr)||0;
  for(const k in eo){const en=eo[k];if(!en||en.del||!en.s||(Number(en.ts)||0)<cr)continue;
    if(en.mv){if(placeKey(String(en.rt||'').split('→').pop())===tk)return true;}
    else if(placeKey(en.p)===tk)return true;}
  return false;}
function depLive(x){return !!(x&&!x.del&&!x.done&&x.d&&/^\d\d:\d\d$/.test(x.at||'')&&String(x.to||'').trim()&&!depAuto(x));}
function depList(){const D=state.dep||{},td=todayStr(),out=[];

function depNotifOk(){return typeof Notification!=='undefined';}

function depMs(x){const a=String(x.d).split('-').map(Number),h=hmMin(x.at);return new Date(a[0],a[1]-1,a[2],Math.floor(h/60),h%60,0).getTime();}

    if(nm>=m&&nm<=m+5)kind='now';else if(nm>=m-15&&nm<m)kind='pre';else if(nm>=m-120&&nm<=m-105&&!(Number(x.cr)>depMs(x)-120*60000))kind='2h';

async function clPullStep(ep,sig,ms){
  const full=!!CL.full;let since=full?CL.full.since:CL.seq,changed=false,got=0,guard=0;
  while(guard++<1000){
    let rows;
    try{rows=await clRpcJson('pull_items',{since_seq:since,lim:CL.pullLim},sig,ms);if(CL.pullLim<500)CL.pullLim=Math.min(500,CL.pullLim*2);}
    catch(e){if(e.kind==='timeout'&&CL.pullLim>100)CL.pullLim=Math.max(100,CL.pullLim>>1);
      clPullFlush();throw e;}
    if(ep!==CLQ.epoch){clPullFlush();return false;}
    if(!Array.isArray(rows)){clPullFlush();throw clErr('受信の形が違う',0,'parse','server');}
    if(!rows.length)break;
    CLQ.beat=Date.now();
    if(clMergeRows(rows,full)){changed=true;CL.pendingChanged=true;}
    for(const r of rows){const s=Number(r&&r.seq)||0;if(s>since)since=s;}
    if(full)CL.full.since=since;else CL.seq=Math.max(CL.seq,since);
    got+=rows.length;
  }
  let fullDone=false;
  if(full){
    CL.shadow=Object.assign(CL.full.nsh,CL.pushedDuring);CL.pushedDuring={};CL.seq=Math.max(CL.seq,since);
    const rb=CL.full.rebuild;CL.full=null;CL.shadowOk=true;fullDone=true;
    clNote('pull','全件受信 完了 '+got+'件'+(rb?'（照合し直し）':''));
  }else if(got)clNote('pull','受信 '+got+'件');
  CL.lastPull=Date.now();
  if(CL.kaCheck)clKaVerify();
  if(changed||CL.pendingChanged){changed=true;try{cfgApply();}catch(e){}}
  clRecomputeDirty(fullDone);
  if(changed){CL.pendingChanged=false;
    CL.quietSave=true;
    try{saveLocal(clDirtyCount()===0);}catch(e){clNote('save','端末保存で例外：'+e.message);}finally{CL.quietSave=false;}
    try{render();}catch(e){clNote('render','描画で例外：'+e.message);}
  }else{try{renderSync();}catch(e){}}
  clPersistSoon();
  if(!CL.firstPull&&CL.shadowOk){CL.firstPull=true;try{afterCloudReady();}catch(e){clNote('ready','起動後の修復で例外：'+e.message);}}
  return {got,fullDone};
}

function clPullFlush(){

  CL.quietSave=true;
  try{saveLocal(clDirtyCount()===0);}catch(e){clNote('save','端末保存で例外：'+e.message);}finally{CL.quietSave=false;}
  try{render();}catch(e){clNote('render','描画で例外：'+e.message);}

}

async function clOnce(ep,sig){
  CL.lastTry=Date.now();
  if(!CL.shadowOk&&!CL.full)CL.full={since:0,nsh:{}};
  if(CL.full){
    if(clDirtyCount()){const r=await clPushStep(ep,sig);if(r===false)return false;}
    const p=await clPullStep(ep,sig);if(p===false)return false;
    if(clDirtyCount()){const r=await clPushStep(ep,sig);if(r===false)return false;}
  }else{
    const dirty=clDirtyCount()>0;
    let pre=false;
    if(dirty&&CL.seq>0){
      try{const p=await clPullStep(ep,sig,CL.T.pre);if(p===false)return false;pre=true;}
      catch(e){if(ep!==CLQ.epoch)return false;clNote('pull','先読み失敗（'+e.message+'）→ 送信を先に');}}
    if(clDirtyCount()){const r=await clPushStep(ep,sig);if(r===false)return false;}
    if(!pre){const p=await clPullStep(ep,sig);if(p===false)return false;}
  }
  if(ep!==CLQ.epoch)return false;
  if(clIntegDue()&&!clDirtyCount()){
    try{const r=await clIntegrity(ep,sig);if(r==='rebuild')CLQ.again=true;}
    catch(e){if(ep!==CLQ.epoch)return false;clNote('integrity','整合の確認に失敗（'+e.message+'）');}
  }

}
function cloudSync(force){

  if(CLQ.run){CLQ.again=true;return CLQ.run;}
  clearTimeout(CLQ.t);CLQ.t=null;CLQ.due=0;

function clRetry(e){

function clKeepalive(why){

    const keys=Object.keys(CL.dirty);if(!keys.length)return false;

    list.sort((a,b)=>((CL.hot[clKey(b)]||0)-(CL.hot[clKey(a)]||0))||(clTsOf(b.ts)-clTsOf(a.ts)));
    const rs=[],ks=[],hs=[];let size=12;

    if(!rs.length)return false;
    CL.kaAt=Date.now();

    try{localStorage.setItem(CL_KA,JSON.stringify({n:rs.length,at:CL.kaAt,keys:ks.slice(0,50)}));}catch(e){}
    const h=clHdr();h['x-client-info']='hibiki-ka';

    }catch(e){ng++;}
    i++;if(i%10===0||i===todo.length)clImpSay('📦 写真 '+i+'/'+todo.length+'（新規 '+ok+'・既にあった '+dup+'・失敗 '+ng+'）');
  };
  for(let p=0;p<todo.length;p+=4)await Promise.all(todo.slice(p,p+4).map(one));
  clImpSay('📦 写真の引っ越し：新規 '+ok+'・既にあった '+dup+'・失敗 '+ng+(skip?'・番号が合わず飛ばした '+skip:'')+'（全 '+todo.length+'）');
  PH.mem={};render();
}
const clHM=t=>t?new Date(t).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'—';
function cloudStatusText(){
  const n=clDirtyCount();
  return (CL.lastErr?('⚠ '+CL.lastErr+'｜'):'')+(n?('未送信 '+n+'件'):'送信済み')+(CL.lastPull?('｜最終受信 '+clHM(CL.lastPull)):'')+(CL.retryAt>Date.now()?('｜再送 '+Math.ceil((CL.retryAt-Date.now())/1000)+'秒後'):'');
}
function clSyncDiagHtml(){
  try{
    if(!cloudConfigured())return '';
    const now=Date.now(),n=clDirtyCount(),nb=Object.keys(CL.bad).length;
    const fmt=t=>{const d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()+' '+d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});};
    const line='状態：'+(cloudLoggedIn()?'ログイン中':((CL.sess&&CL.sess.dead)?'ログイン切れ':'未ログイン'))+'｜未送信 '+n+'件｜最後の送信 '+clHM(CL.lastPush)+'｜最後の受信 '+clHM(CL.lastPull)+
      '｜次の再送 '+(CL.retryAt>now?Math.ceil((CL.retryAt-now)/1000)+'秒後':'—')+'｜整合 '+(CL.integ.res||'未確認')+'｜影 '+(CL.shadowOk?(CL.full?'照合し直し中':'あり'):'作成中（クラウドと照合待ち）')+
      '｜控え '+(CL.storeOk===false?'メモリのみ':'IndexedDB')+(CLQ.run?'｜同期中':'')+(CL.lastErr?'｜エラー '+CL.lastErr:'')+
      (nb?'｜送れない行 '+nb+'件：'+Object.keys(CL.bad).slice(0,5).map(k=>k.replace('\u0000','/')).join('、'):'');
    const rows=CL.log.slice().reverse().map(e=>'<div>'+esc(fmt(e.t))+' 〔'+esc(e.ev)+'〕'+esc(e.msg)+'</div>').join('');
    return '<div class="sh-label" style="margin-top:12px">同期の記録</div>'+
      '<div class="sh-note" id="clDiag" style="text-align:left;word-break:break-all">'+esc(line)+'</div>'+
      '<div class="sh-note" id="clLog" style="text-align:left;font-size:11.5px;line-height:1.5;max-height:220px;overflow:auto;word-break:break-all">'+(rows||'（まだ記録なし）')+'</div>';
  }catch(e){return '';}
}
function clNoShadow(){return cloudConfigured()&&cloudLoggedIn()&&CL.ready&&!CL.shadowOk;}
function clStripText(){
  const now=Date.now(),n=clDirtyCount();
  const showErr=CL.lastErr&&(CLQ.fails>=2||(CLQ.firstFailAt&&now-CLQ.firstFailAt>20000));
  return ((typeof localSaveFail!=='undefined'&&localSaveFail)?'🔴 端末保存に失敗｜':'🟠 ')+(clNoShadow()?'照合中（クラウドと突き合わせ待ち）'+(n?'｜いま書いた '+n+'件':''):'未送信 '+n+'件')+(CL.lastPush?'｜最後の送信 '+clHM(CL.lastPush):'')+
    (showErr?'｜'+CL.lastErr:'')+(CL.retryAt>now?'｜再送 '+Math.ceil((CL.retryAt-now)/1000)+'秒後':(CLQ.run?'｜送信中':''));
}
{
  const _rs=renderSync;
  renderSync=function(){
    const noSh=clNoShadow();
    unsynced=clDirtyCount()>0||noSh;
    localOnly=!(cloudConfigured()&&cloudLoggedIn());
    _rs();
    const d=$('syncdot');if(d){d.onclick=openLoginSheet;if(localOnly&&cloudConfigured())d.title='未ログイン（タップでログイン）';}
    const s=$('diagstrip');
    if(s&&cloudConfigured()&&!cloudLoggedIn()){s.style.display='';s.className='diagstrip';
      s.textContent=(CL.sess&&CL.sess.dead)?'⚪ ログインが切れた：記録はこの端末に保存中（タップしてログインし直す）':'⚪ 未ログイン：この端末だけに保存中（タップしてログインすると全端末で同期）';s.onclick=openLoginSheet;}
    else if(s&&cloudLoggedIn()){
      const showErr=CL.lastErr&&(CLQ.fails>=2||(CLQ.firstFailAt&&Date.now()-CLQ.firstFailAt>20000));
      if(clDirtyCount()||showErr||noSh||(typeof localSaveFail!=='undefined'&&localSaveFail)){s.style.display='';s.className='diagstrip'+((typeof localSaveFail!=='undefined'&&localSaveFail)?' bad':'');s.textContent=clStripText();s.onclick=openSyncSheet;}
    }
  };
}
{
  const _os=openSyncSheet;
  openSyncSheet=function(){
    _os.apply(this,arguments);
    const b=$('syncNow');if(b){b.textContent='☁ いまクラウドに保存';b.onclick=()=>{closeSheet();CL.integ.due=true;cloudSync(true);toast('☁ クラウドへ保存中…少し待て');};}
  };
}
{
  const _sl=saveLocal;
  saveLocal=function(synced){
    _sl(synced);
    if(CL.quietSave)return;
    let n=0;try{n=clMarkDirty();}catch(e){clNote('dirty','差の計算で例外：'+e.message);}
    if(CL.ready){try{renderSync();}catch(e){}if(n){if(CLQ.fails>1)CLQ.fails=1;clKick(1500);}}
  };
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)clOnHidden();else{clOnVisible('visible');clCheckUpdate();}},true);
let clUpAt=0;
async function clCheckUpdate(){try{if(!cloudConfigured()||Date.now()-clUpAt<20000)return;clUpAt=Date.now();
  const r=await fetch('./index.html?up='+Date.now(),{cache:'no-store'});if(!r.ok)return;const t=await r.text();
  const m=/const CL_APPVER="([^"]+)"/.exec(t);if(!m||m[1]===CL_APPVER)return;if(typeof appVerCheck==='function')appVerCheck(true);}catch(e){}}
function clShowUpdate(v){if(document.getElementById('clUp'))return;const d=document.createElement('div');d.id='clUp';
  d.style.cssText='position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:250;max-width:420px;margin:0 auto;background:#1f2430;color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;font:800 13.5px -apple-system,BlinkMacSystemFont,sans-serif';
  d.innerHTML='<span style="flex:1">🆕 新しい版（'+esc(v)+'）があります</span><button id="clUpGo" style="background:#0bc167;color:#fff;border:0;border-radius:12px;padding:9px 14px;font-weight:800">更新する</button>';
  document.body.appendChild(d);
  document.getElementById('clUpGo').onclick=async()=>{const b=document.getElementById('clUpGo');b.disabled=true;b.textContent='送っています…';
    try{if(cloudLoggedIn())await cloudSync(true);}catch(e){}
    try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}catch(e){}
    try{const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(x=>x.update().catch(()=>{})));}catch(e){}
    location.reload();};}
setInterval(()=>{if(typeof document==='undefined'||!document.hidden)clCheckUpdate();},15*60000);
setTimeout(()=>{clCheckUpdate();},3000);
window.addEventListener('pagehide',()=>{clOnHidden();},true);
window.addEventListener('pageshow',e=>{if(e&&e.persisted)clOnVisible('pageshow');});
document.addEventListener('resume',()=>{clOnVisible('resume');});
window.addEventListener('online',()=>{if(cloudLoggedIn()){CLQ.fails=0;clKick(500);}});
window.addEventListener('storage',e=>{
  if(!e||e.key!==CL_SESS||!e.newValue)return;
  try{const s=JSON.parse(e.newValue);if(s&&s.user&&s.access_token&&CL.sess&&CL.sess.user&&s.user.id===CL.sess.user.id&&(s.expires_at||0)>(CL.sess.expires_at||0)){CL.sess=s;clNote('refresh','別タブの新しい合言葉を採用');}}catch(x){}
});
setInterval(()=>{
  if(CLQ.run&&Date.now()-CLQ.beat>CL.T.watch){clNote('watchdog','無進捗 '+Math.round((Date.now()-CLQ.beat)/1000)+'秒 → 打ち切ってやり直す');clAbortRun();clKick(500);return;}
  if(!cloudLoggedIn()||!CL.ready||CLQ.run||CLQ.fails||(typeof document!=='undefined'&&document.hidden))return;
  if(Date.now()-(CL.freshAt||0)>60000){CL.freshAt=Date.now();try{clRecomputeDirty(true);}catch(e){}if(clDirtyCount()){clKick(1000);return;}}
  const idle=Date.now()-Math.max(CL.lastTry,CL.lastPull);
  if((clDirtyCount()>0&&idle>20000)||idle>60000)clKick(0);
},10000);
setInterval(()=>{try{const s=$('diagstrip');if(s&&s.style.display!=='none'&&cloudLoggedIn()&&(CL.retryAt>Date.now()||clDirtyCount()||clNoShadow()))s.textContent=clStripText();}catch(e){}},1000);
let afterCloudReady=function(){};
async function cloudBoot(){
  clBaseSigs();CL.trackHot=true;
  const verUp=clGet('hibiki-ver','')!==CL_APPVER&&!!clGet('hibiki-ver','');
  if(clGet('hibiki-ver','')!==CL_APPVER){clSet('hibiki-ver',CL_APPVER);clSet(CL_PWDAY,null);}
  if(!cloudConfigured()){CL.ready=true;renderSync();return;}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(p=>(navigator.storage.estimate?navigator.storage.estimate():Promise.resolve({})).then(es=>{
    const mb=x=>x?(x/1048576).toFixed(1):'?';clNote('storage','永続保存 '+(p?'許可':'未許可')+'・使用 '+mb(es.usage)+'/'+mb(es.quota)+'MB');})).catch(()=>{});}catch(e){}
  try{const is=await clStore.get('session');
    if(is&&is.user&&is.access_token&&(!CL.sess||(CL.sess.user&&CL.sess.user.id===is.user.id&&(is.expires_at||0)>(CL.sess.expires_at||0)))){CL.sess=is;try{localStorage.setItem(CL_SESS,JSON.stringify(is));}catch(e){}clNote('sess','IndexedDB の控えから合言葉を戻した');}}catch(e){}
  try{const ka=JSON.parse(localStorage.getItem(CL_KA)||'null');if(ka&&ka.n)CL.kaCheck=ka;}catch(e){}
  if(CL.sess&&CL.sess.user&&CL.sess.user.id){await clLoadShadow(CL.sess.user.id);await clOutboxRestore();}
  CL.ready=true;
  clRecomputeDirty(false);
  unsynced=clDirtyCount()>0||clNoShadow();renderSync();
  if(!cloudLoggedIn()||clDailyDue()||verUp){try{$('ovl').classList.add('cl-first');openLoginSheet({daily:cloudLoggedIn(),ver:verUp});}catch(e){}}
  if(!cloudLoggedIn()){return;}
  clNote('boot','起動 '+CL_APPVER+'｜影 '+(CL.shadowOk?'あり（受信位置 '+CL.seq+'）':'なし → 全件受信')+'｜未送信 '+clDirtyCount()+'件｜署名 '+CL.perf.baseSigs+'ms');
  CL.integ.due=true;
  await cloudSync();
}

boot().then(()=>cloudBoot()).catch(e=>{try{console.error(e);}catch(e2){}});
if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js');}catch(e){}}
